<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<title>Inspeção Móvel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --bg:#06070a;--surface:#0f1216;--surface2:#14181d;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --accent:#ffd600;--accent3:#c8a800;--text:#f0f0f2;--muted:#71717a;
  --font:system-ui,-apple-system,sans-serif;--r-sm:12px;--r-xl:24px;
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:var(--font);outline:none}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
#splash.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease}

/* MENU */
#main-menu{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#090b0f,#050609)}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:760px;width:100%}
.mc{position:relative;min-height:220px;padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:flex-end;gap:12px;background:#171b22;text-align:left}
.mc.pri{border-color:rgba(255,214,0,.28)}
.mc-i{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:#000}
.mc-i svg{width:30px;height:30px}
.mc h3{font-size:20px;font-weight:900}
.mc p{font-size:12px;color:var(--muted);line-height:1.4}

/* MODULES */
.module{display:none;position:fixed;inset:0;background:var(--bg);z-index:10}
.module.active{display:block}

/* GATE & SETTINGS */
#gate{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.gate-box{max-width:400px;width:100%;border-radius:var(--r-xl);border:1px solid var(--border);background:var(--surface2);padding:36px 24px;text-align:center}
.gate-btn{width:100%;min-height:46px;border-radius:var(--r-sm);background:rgba(255,255,255,.08);border:1px solid var(--border2);color:var(--text);font-size:11px;font-weight:800;text-transform:uppercase;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px}

#settings, #settingsUnica{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.7);opacity:0;visibility:hidden;pointer-events:none;transition:all .2s ease}
#settings.open, #settingsUnica.open{opacity:1;visibility:visible;pointer-events:auto}
.settings-content{width:min(90vw,380px);border-radius:var(--r-xl);border:1px solid var(--border2);background:var(--surface2);padding:24px}
.settings-close{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.s-group{margin-top:16px}
.s-lbl{display:block;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.s-inp{width:100%;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:#fff;padding:12px;font-size:13px}

/* HUD & VIDEOS */
video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hud{position:absolute;top:calc(18px + var(--safe-t));left:14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(4,120,87,.8);padding:10px 16px;text-align:center;backdrop-filter:blur(12px);z-index:100;pointer-events:none}
.hud span{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:rgba(220,252,231,.6)}
.hud p{font-size:24px;font-weight:900;line-height:1.1;margin-top:2px}

#rec-tag{position:absolute;top:calc(18px + var(--safe-t));right:14px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:100;pointer-events:none}
#rec-tag.on{opacity:1}
#rec-tag .dot{width:7px;height:7px;border-radius:50%;background:#ef4444}
#rec-tag span{font-size:9px;font-weight:900;text-transform:uppercase}

.ui-ctrl{position:absolute;bottom:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px calc(20px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}
.ui-btn{height:48px;border-radius:var(--r-sm);font-size:11px;font-weight:900;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid var(--border2);background:rgba(0,0,0,0.5);backdrop-filter:blur(10px)}

/* TOAST */
.toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(10px);border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);padding:10px 18px;font-size:11px;font-weight:800;text-transform:uppercase;z-index:99998;opacity:0;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(239,68,68,.3);color:#fca5a5}
canvas{display:none}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <h1 style="font-size:24px;font-weight:900">Sistema de Inspeção</h1>
</div>

<!-- MENU -->
<div id="main-menu">
  <div class="menu-grid">
    <button class="mc pri" onclick="openMod('foto-unica')">
      <span class="mc-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg></span>
      <div><h3>Foto e Vídeo</h3><p>Captura avulsa com KM e GPS</p></div>
    </button>
    <button class="mc" onclick="openMod('inspecao')">
      <span class="mc-i" style="background:var(--surface);color:var(--text)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div><h3>Inspeção PDF</h3><p>Captura automática por lote</p></div>
    </button>
  </div>
</div>

<!-- FOTO E VÍDEO -->
<div id="mod-foto-unica" class="module">
  <video id="vidUnica" autoplay playsinline muted></video>
  <div class="hud"><span>KM atual</span><p id="kmTxtUnica">KM ---</p></div>
  <div style="position:absolute;top:calc(18px + var(--safe-t));right:14px;z-index:100"><button class="ui-btn" onclick="openMod('menu')">Sair</button></div>

  <div id="settingsUnica">
    <div class="settings-content">
      <button class="settings-close" onclick="document.getElementById('settingsUnica').classList.toggle('open')">Fechar</button>
      <h2>Configurações</h2>
      <div class="s-group"><label class="s-lbl">Câmera</label><select class="s-inp" id="camSelUnica" onchange="switchCamUnica(this.value)"></select></div>
      <div class="s-group"><label class="s-lbl">Etiqueta</label><input class="s-inp" id="fotoLabelUnica" type="text" maxlength="80" placeholder="Opcional"></div>
    </div>
  </div>

  <div class="ui-ctrl">
    <button class="ui-btn" onclick="document.getElementById('settingsUnica').classList.toggle('open')">⚙️</button>
    <button onclick="takeSinglePhoto()" style="width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,0.2);display:grid;place-items:center"><div style="width:52px;height:52px;border-radius:50%;background:#fff"></div></button>
    <button class="ui-btn" id="btnRecVideoUnica" onclick="toggleVideoRecording()">🔴 Vídeo</button>
  </div>
  <canvas id="cUnica"></canvas>
</div>

<!-- INSPEÇÃO (PDF) -->
<div id="mod-inspecao" class="module">
  <div id="gate">
    <div class="gate-box">
      <h1 style="font-size:20px;font-weight:900">Inspeção Fotográfica</h1>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Selecione a pasta e inicie o relatório.</p>
      <div style="margin-top:16px;text-align:left"><label class="s-lbl">Etiqueta</label><input id="fotoLabel" type="text" class="s-inp" placeholder="Ex: Manutenção"></div>
      <button class="gate-btn" onclick="startApp()">Ativar Câmera</button>
      <button class="gate-btn" style="background:transparent;border:0;color:var(--muted)" onclick="openMod('menu')">Voltar</button>
    </div>
  </div>

  <div id="settings">
    <div class="settings-content">
      <button class="settings-close" onclick="document.getElementById('settings').classList.toggle('open')">Fechar</button>
      <h2>Configurações</h2>
      <div class="s-group"><label class="s-lbl">Câmera</label><select class="s-inp" id="camSel" onchange="switchCam(this.value)"></select></div>
      <div class="s-group"><label class="s-lbl">Intervalo (ms)</label><input type="number" class="s-inp" id="cfgInt" value="200" min="200"></div>
      <div class="s-group"><label class="s-lbl">Fotos por Lote</label><input type="number" class="s-inp" id="cfgLote" value="150" min="1"></div>
    </div>
  </div>

  <div id="app-shell" style="visibility:hidden">
    <div class="hud" style="top:calc(72px + var(--safe-t))"><span>KM atual</span><p id="kmTxt">KM ---</p></div>
    <div style="position:absolute;top:calc(18px + var(--safe-t));left:14px;font-size:10px;font-weight:800;background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:10px;border:1px solid var(--border2);z-index:100" id="captureCount">Lote 1 · 0 / 150</div>
    <div id="rec-tag"><div class="dot"></div><span>Gravando PDF</span></div>
    <video id="vid" autoplay playsinline muted onclick="manualPhoto()"></video>
    <div class="ui-ctrl">
      <button class="ui-btn" onclick="document.getElementById('settings').classList.toggle('open')">⚙️</button>
      <button class="ui-btn" id="btn-start" onclick="startCap()" style="background:var(--accent);color:#000">Iniciar</button>
      <button class="ui-btn" id="btn-stop" onclick="stopCap()" style="background:#ef4444;display:none">Finalizar</button>
      <button class="ui-btn" onclick="openMod('menu')">Sair</button>
    </div>
  </div>
  <canvas id="c"></canvas>
</div>

<div class="toast" id="toast"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => { document.getElementById('splash')?.classList.add('done'); setTimeout(() => document.getElementById('splash')?.remove(), 200); }, 200);
});

const parsePt = v => { const s = String(v ?? '').trim(); return /,\d+$/.test(s) ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s); };
function findCol(h, cs) { const m = h.map(s => String(s || '').trim().toUpperCase()); for (const c of cs) { const i = m.indexOf(c.toUpperCase()); if (i >= 0) return i; } return -1; }

let kmDB = [], stream = null, streamUnica = null, capturing = false, buffer = [], lat = '0.00', lon = '0.00';
let currentKm = '---', dirHandle = null, mediaRecorder = null, recordedChunks = [], isRecordingVideo = false, renderIntervalUnica = null;
let captureTimer = null, currentBatchNumber = 1, pdfQueue = [], pdfWorkerBusy = false, sessionEnding = false, captureBusy = false, savedBatchCount = 0;

async function chooseDirectoryForModule() {
  if (!('showDirectoryPicker' in window)) { showToast('Requer Chrome/Edge em HTTPS', 'err'); return null; }
  try {
    const chosen = await window.showDirectoryPicker({ mode: 'readwrite' });
    if ((await chosen.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error();
    dirHandle = chosen;
    return chosen;
  } catch (e) { showToast('Pasta não selecionada', 'err'); return null; }
}

async function saveFileToDirectory(blob, filename) {
  if (!dirHandle) return;
  try {
    const fh = await dirHandle.getFileHandle(filename, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    showToast('Salvo: ' + filename);
  } catch (e) { showToast('Erro ao salvar arquivo', 'err'); }
}

let _tt = null;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.className = 'toast ' + type; el.textContent = msg;
  clearTimeout(_tt);
  requestAnimationFrame(() => { el.classList.add('show'); _tt = setTimeout(() => el.classList.remove('show'), 2500); });
}

async function openMod(id) {
  if (id === 'menu') {
    if (capturing || pdfWorkerBusy || sessionEnding) { showToast('Aguarde o salvamento', 'err'); return; }
    capturing = false; clearTimeout(captureTimer); if (isRecordingVideo) stopVideoRecording();
    [streamUnica, stream].forEach(st => st?.getTracks().forEach(t => t.stop()));
    streamUnica = null; stream = null; clearInterval(renderIntervalUnica);
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    document.getElementById('main-menu').style.display = 'flex';
    dirHandle = null; return;
  }
  if (!(await chooseDirectoryForModule())) return;
  document.getElementById('main-menu').style.display = 'none';
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  document.getElementById('mod-' + id).classList.add('active');
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  if (id === 'foto-unica') initFotoUnica();
}

async function loadKm() {
  try {
    let r = await fetch('SNVBR116SPRJ.csv?v=' + Date.now()).catch(() => null);
    if (!r?.ok) return;
    let t = await r.text(); if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const lines = t.split(/\r?\n/).filter(l => l.trim()), h = lines.shift().split(';');
    const iKm = findCol(h, ['km']), iLat = findCol(h, ['lat']), iLon = findCol(h, ['lon', 'longitude']);
    kmDB = lines.map(l => { const r = l.split(';'); return { km: parsePt(r[iKm]), lat: parsePt(r[iLat]), lon: parsePt(r[iLon]) }; }).filter(p => !isNaN(p.km));
  } catch (e) {}
}
loadKm();

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    lat = p.coords.latitude.toFixed(6); lon = p.coords.longitude.toFixed(6);
    if (!kmDB.length) return;
    let best = null, minD = Infinity;
    for (const pt of kmDB) {
      const d = Math.hypot(pt.lat - p.coords.latitude, pt.lon - p.coords.longitude);
      if (d < minD) { minD = d; best = pt; }
    }
    if (best) {
      currentKm = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
      document.querySelectorAll('#kmTxtUnica, #kmTxt').forEach(el => el.textContent = 'KM ' + currentKm);
    }
  }, null, { enableHighAccuracy: true });
}

async function initFotoUnica() {
  try {
    streamUnica = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const vid = document.getElementById('vidUnica'); vid.srcObject = streamUnica;
    loadCamerasUnica();
    const c = document.getElementById('cUnica'), ctx = c.getContext('2d');
    if (renderIntervalUnica) clearInterval(renderIntervalUnica);
    renderIntervalUnica = setInterval(() => {
      if (vid.videoWidth) {
        if (c.width !== vid.videoWidth || c.height !== vid.videoHeight) { c.width = vid.videoWidth; c.height = vid.videoHeight; }
        drawOverlay(ctx, vid, c.width, c.height, currentKm, new Date().toLocaleString('pt-BR'), `${lat}, ${lon}`, document.getElementById('fotoLabelUnica').value.trim());
      }
    }, 100);
  } catch (e) { showToast('Erro na câmera', 'err'); }
}

async function loadCamerasUnica() {
  try {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('camSelUnica'); sel.innerHTML = '';
    devices.forEach((dev, idx) => { const opt = document.createElement('option'); opt.value = dev.deviceId; opt.textContent = `Câmera ${idx + 1}`; sel.appendChild(opt); });
  } catch(e){}
}

async function switchCamUnica(deviceId) {
  if (streamUnica) streamUnica.getTracks().forEach(t => t.stop());
  try {
    streamUnica = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }, audio: false });
    document.getElementById('vidUnica').srcObject = streamUnica;
  } catch (e) { showToast('Erro ao trocar câmera', 'err'); }
}

function takeSinglePhoto() {
  const c = document.getElementById('cUnica');
  if (!c.width) return;
  c.toBlob(blob => saveFileToDirectory(blob, `FOTO_KM_${currentKm}_${Date.now()}.jpg`), 'image/jpeg', 0.95);
}

async function toggleVideoRecording() {
  if (!isRecordingVideo) {
    const c = document.getElementById('cUnica');
    if (!c.width || !dirHandle) return;
    const canvasStream = c.captureStream(30);
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 8000000 });
    mediaRecorder.ondataavailable = e => { if (e.data?.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      canvasStream.getTracks().forEach(t => t.stop());
      saveFileToDirectory(new Blob(recordedChunks, { type: 'video/webm' }), `VIDEO_KM_${currentKm}_${Date.now()}.webm`);
    };
    mediaRecorder.start(1000); isRecordingVideo = true;
    document.getElementById('btnRecVideoUnica').style.background = '#ef4444';
    showToast('Gravando vídeo...');
  } else {
    mediaRecorder.stop(); isRecordingVideo = false;
    document.getElementById('btnRecVideoUnica').style.background = '';
  }
}

async function startApp() {
  if (!dirHandle) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    document.getElementById('vid').srcObject = stream;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app-shell').style.visibility = 'visible';
    loadCameras();
  } catch (e) { showToast('Erro ao acessar câmera', 'err'); }
}

async function loadCameras() {
  try {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('camSel'); sel.innerHTML = '';
    devices.forEach((dev, idx) => { const opt = document.createElement('option'); opt.value = dev.deviceId; opt.textContent = `Câmera ${idx + 1}`; sel.appendChild(opt); });
  } catch(e){}
}

async function switchCam(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }, audio: false });
    document.getElementById('vid').srcObject = stream;
  } catch (e) { showToast('Erro ao trocar', 'err'); }
}

function startCap() {
  if (!dirHandle || capturing) return;
  capturing = true; buffer = []; pdfQueue = []; currentBatchNumber = 1; savedBatchCount = 0;
  updateCount();
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'flex';
  document.getElementById('rec-tag').classList.add('on');
  captureLoop();
}

function captureLoop() {
  if (!capturing) return;
  const t = performance.now();
  captureFrame();
  const ms = Math.max(parseInt(document.getElementById('cfgInt').value) || 200, 200);
  captureTimer = setTimeout(captureLoop, Math.max(0, ms - (performance.now() - t)));
}

function captureFrame() {
  if (!capturing || captureBusy) return;
  const v = document.getElementById('vid'); if (!v.videoWidth) return;
  captureBusy = true;
  try {
    const c = document.getElementById('c'), x = c.getContext('2d');
    c.width = v.videoWidth; c.height = v.videoHeight;
    drawOverlay(x, v, c.width, c.height, currentKm, new Date().toLocaleString('pt-BR'), `${lat}, ${lon}`, document.getElementById('fotoLabel').value.trim());
    buffer.push({ img: c.toDataURL('image/jpeg', 0.85), km: currentKm });
    const lim = Math.max(parseInt(document.getElementById('cfgLote').value) || 150, 1);
    if (buffer.length >= lim) rotateBatch();
    updateCount();
  } catch(e){} finally { captureBusy = false; }
}

function rotateBatch() {
  if (!buffer.length) return;
  pdfQueue.push({ photos: buffer, batchNo: currentBatchNumber, final: false });
  buffer = []; currentBatchNumber++; processPdfQueue();
}

function manualPhoto() { if (capturing) captureFrame(); }
function updateCount() {
  const lim = Math.max(parseInt(document.getElementById('cfgLote').value) || 150, 1);
  document.getElementById('captureCount').textContent = `Lote ${currentBatchNumber} · ${buffer.length} / ${lim}`;
}

async function stopCap() {
  if (!capturing || sessionEnding) return;
  capturing = false; sessionEnding = true; clearTimeout(captureTimer);
  document.getElementById('rec-tag').classList.remove('on');
  if (buffer.length) { pdfQueue.push({ photos: buffer, batchNo: currentBatchNumber, final: true }); buffer = []; }
  processPdfQueue();
  while(pdfWorkerBusy || pdfQueue.length) await new Promise(r => setTimeout(r, 100));
  sessionEnding = false;
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-start').style.display = 'flex';
  showToast(`${savedBatchCount} lote(s) salvo(s)`);
}

async function processPdfQueue() {
  if (pdfWorkerBusy) return;
  pdfWorkerBusy = true;
  try {
    while (pdfQueue.length) {
      const job = pdfQueue.shift();
      const { jsPDF } = window.jspdf;
      const p0 = (new jsPDF()).getImageProperties(job.photos[0].img);
      const d = new jsPDF({ orientation: p0.width >= p0.height ? 'landscape' : 'portrait', unit: 'px', format: [p0.width, p0.height], compress: true });
      job.photos.forEach((it, i) => {
        const p = d.getImageProperties(it.img);
        if (i) d.addPage([p.width, p.height], p.width >= p.height ? 'landscape' : 'portrait');
        d.addImage(it.img, 'JPEG', 0, 0, p.width, p.height);
      });
      const a = job.photos[0]?.km || '0', z = job.photos.at(-1)?.km || '0';
      const fh = await dirHandle.getFileHandle(`Relatorio_KM_${a}_a_${z}.pdf`, { create: true });
      const w = await fh.createWritable(); await w.write(d.output('blob')); await w.close();
      savedBatchCount++;
    }
  } catch(e) { showToast('Erro ao gerar PDF', 'err'); }
  finally { pdfWorkerBusy = false; }
}

function drawOverlay(ctx, videoEl, w, h, kmVal, ts, gpsStr, label) {
  ctx.drawImage(videoEl, 0, 0, w, h);
  const bh = h * 0.12, grad = ctx.createLinearGradient(0, h - bh, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = grad; ctx.fillRect(0, h - bh, w, bh);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(bh * 0.32) + 'px sans-serif';
  ctx.fillText('KM ' + kmVal, 20, h - bh * 0.5);
  ctx.font = Math.round(bh * 0.18) + 'px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(ts + ' | GPS: ' + gpsStr, 20, h - bh * 0.2);

  if (label) {
    ctx.font = 'bold ' + Math.round(h * 0.035) + 'px sans-serif';
    const tw = ctx.measureText(label).width, px = 20, py = 12;
    ctx.fillStyle = '#ffd600';
    ctx.beginPath(); ctx.roundRect(w - tw - px * 2 - 30, 30, tw + px * 2, h * 0.035 + py * 2, 8); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillText(label, w - tw - px - 30, 30 + py + h * 0.025);
  }
}
</script>
