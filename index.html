<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Ativo Mais Próximo & Fibras ITS</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#070913;
  --surface:#0b1124;
  --surface2:#111936;
  --border:rgba(59,130,246,.2);
  --border2:rgba(59,130,246,.4);
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.3);
  --green:#10b981;
  --green2:#34d399;
  --purple:#a855f7;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;
  --safe-b:max(env(safe-area-inset-bottom,0px),12px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.08),transparent 55%),var(--bg);
  color:var(--text);font-family:var(--font);overflow-x:hidden;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;}
button:active{opacity:.8;transform:scale(.97)}
input,select{font-family:var(--font);outline:none}

.hdr{
  position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.95);backdrop-filter:blur(20px);
  padding:0 12px;padding-top:var(--safe-t);box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:44px;}
.hdr-title{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.25em;color:var(--accent);text-shadow:0 0 10px var(--accent-glow);}

.wrap{max-width:760px;margin:0 auto;padding:12px;padding-bottom:var(--safe-b);display:flex;flex-direction:column;gap:12px;}

.section-block{
  display:flex;flex-direction:column;gap:8px;background:rgba(11,17,36,0.85);
  border:1px solid var(--border);border-radius:var(--r-md);padding:12px;
  backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.km-hero-compact{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r-sm);border:1px solid rgba(59,130,246,.35);
  background:linear-gradient(145deg,#111936 0%,#070913 100%);padding:10px 14px;
}
.km-value-compact{
  font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.gps{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  min-height:30px;border-radius:var(--r-xs);border:1px solid;padding:0 10px;
  font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.gps.bad{border-color:rgba(100,116,139,.3);background:rgba(11,17,36,.9);color:#e5e7eb}
.gps.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#d1fae5}

.asset-post{
  border-radius:var(--r-sm);overflow:hidden;border:1px solid rgba(16,185,129,.5);
  background:linear-gradient(145deg,rgba(16,185,129,.1),rgba(11,17,36,.95));
  box-shadow:0 0 15px rgba(16,185,129,.2);transition:all .2s ease;margin-bottom:8px;padding:12px;
}
.post-top{display:flex;align-items:flex-start;gap:8px;}
.post-id{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--accent);letter-spacing:.05em}
.post-dist{font-size:8px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-top:2px}

.post-wa{
  width:32px;height:32px;border-radius:var(--r-xs);background:rgba(16,185,129,.15);
  border:1px solid rgba(16,185,129,.3);color:var(--green2);display:grid;place-items:center;flex-shrink:0;cursor:pointer;
}
.post-wa svg{width:14px;height:14px}

.fiber-box{
  background:linear-gradient(145deg,rgba(168,85,247,.12),rgba(11,17,36,.95));
  border:1px solid rgba(168,85,247,.4);border-radius:var(--r-xs);padding:10px;margin-top:8px;
}
.fiber-header{font-size:8.5px;font-weight:900;color:var(--purple);text-transform:uppercase;display:flex;align-items:center;gap:4px;}
.fiber-neighbors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.fiber-card{
  background:rgba(7,9,19,.9);border:1px solid rgba(168,85,247,.3);
  border-radius:4px;padding:8px;cursor:pointer;transition:all .2s ease;
}
.fiber-card:hover{border-color:var(--purple);background:rgba(168,85,247,.2);}
.fiber-card-lbl{font-size:7.5px;font-weight:900;color:var(--purple);text-transform:uppercase;}
.fiber-card-id{font-size:9.5px;font-weight:900;color:#fff;margin-top:2px;}
.fiber-card-sub{font-size:8px;font-weight:700;color:var(--text2);margin-top:1px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  border-radius:var(--r-xs);border:1px solid var(--border2);background:var(--surface);
  padding:10px 16px;font-size:9px;font-weight:800;text-transform:uppercase;z-index:99999;
  opacity:0;transition:all .15s ease;pointer-events:none;color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-title">Ativo Mais Próximo & Fibras</div>
    <div style="font-size:9px;font-weight:900;color:var(--accent);" id="topKmLive">—</div>
  </div>
</header>

<div class="wrap">

  <div class="section-block">
    <div class="km-hero-compact">
      <div>
        <div class="km-value-compact" id="kmVal">—</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <span style="font-size:8px;font-weight:900;color:var(--accent)" id="kmBrBadge">SINTONIZANDO GPS...</span>
        <div id="cityNameDisplay" style="font-size:8.5px;font-weight:800;color:var(--text2);text-transform:uppercase;">RODOVIA ATIVA</div>
      </div>
    </div>

    <div id="gpsStatus" class="gps bad">
      <span id="gpsText">GPS · LOCALIZANDO POSIÇÃO...</span>
    </div>

    <div style="font-size:8.5px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-top:4px;">
      🎯 Equipamento Mais Próximo de si Agora & Fibra Óptica:
    </div>

    <div id="nearestAssetContainer" style="display:flex;flex-direction:column;gap:8px">
      <div style="text-align:center;padding:20px;color:var(--muted);font-size:9px;font-weight:800;">A aguardar leitura do sinal GPS...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// Base de Dados de Ativos ITS Incorporada (Base de ativos reais)[cite: 1, 2]
const rawAssets = [
  {"tag":"BR116-CF0001","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA58-N214_728","km":"214+728","kmVal":214.728,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.183","gerencia":"172.26.45.0","rede":"10.3.37.136","switch":"10.3.37.137","ativo":"10.3.37.138","rodovia":"BR116"},
  {"tag":"BR116-CM0001","equip":"CFTV MÓVEL","estado":"RJ","host":"RSP-SA58-N214_728","km":"214+728","kmVal":214.728,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.183","gerencia":"172.26.45.0","rede":"10.3.37.136","switch":"10.3.37.137","ativo":"10.3.37.139","rodovia":"BR116"},
  {"tag":"SAT 214+860","equip":"SAT","estado":"RJ","host":"","km":"214+860","kmVal":214.860,"sentido":"SUL","fibra":"11, 12","ipGer":"172.27.0.162","gerencia":"172.26.12.111","rede":"10.3.6.80","switch":"10.3.6.81","ativo":"10.3.6.86","rodovia":"BR116"},
  {"tag":"BR116-CF0002","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA56-N215_129","km":"215+129","kmVal":215.129,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.165","gerencia":"172.26.12.114","rede":"10.3.6.104","switch":"10.3.6.105","ativo":"10.3.6.106","rodovia":"BR116"},
  {"tag":"BR116-CF0003","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA57-N215_404","km":"215+404","kmVal":215.404,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.172","gerencia":"172.26.12.121","rede":"10.3.6.160","switch":"10.3.6.161","ativo":"10.3.6.162","rodovia":"BR116"},
  {"tag":"BR116-CF0004","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA57-N215_758","km":"215+758","kmVal":215.758,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.177","gerencia":"172.26.12.126","rede":"10.3.6.200","switch":"10.3.6.201","ativo":"10.3.6.202","rodovia":"BR116"},
  {"tag":"BR116-CM0002","equip":"CFTV MÓVEL","estado":"RJ","host":"RSP-SA57-N215_758","km":"215+758","kmVal":215.758,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.177","gerencia":"172.26.12.126","rede":"10.3.6.200","switch":"10.3.6.201","ativo":"10.3.6.203","rodovia":"BR116"},
  {"tag":"BR116-CF0005","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA58-N216_163","km":"216+163","kmVal":216.163,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.178","gerencia":"172.26.12.127","rede":"10.3.6.208","switch":"10.3.6.209","ativo":"10.3.6.210","rodovia":"BR116"},
  {"tag":"BR101-CM301","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA100-N051_400","km":"051+400","kmVal":51.400,"sentido":"NORTE","fibra":"11, 12, 31","ipGer":"172.27.6.46","gerencia":"172.26.13.6","rede":"10.3.50.0","switch":"10.3.50.1","ativo":"10.3.50.3","rodovia":"BR101"},
  {"tag":"BR101-CM300","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA101-N050_880","km":"050+880","kmVal":50.880,"sentido":"CANTEIRO CENTRAL","fibra":"21, 22, 31","ipGer":"172.27.6.58","gerencia":"172.26.13.18","rede":"10.3.50.96","switch":"10.3.50.97","ativo":"10.3.50.99","rodovia":"BR101"},
  {"tag":"BR101-CM001","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA101-N049_860","km":"049+860","kmVal":49.860,"sentido":"SUL","fibra":"11, 12, 31","ipGer":"172.27.6.59","gerencia":"172.26.13.19","rede":"10.3.50.104","switch":"10.3.50.105","ativo":"10.3.50.107","rodovia":"BR101"}
];

let pos = null;

const hav = (a,b,c,d) => {
  const p = Math.PI/180, x = .5 - Math.cos((c-a)*p)/2 + Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
};

const formatDist = dist => {
  const m = Math.max(0, Math.round(dist));
  if (m < 1000) return `${m}m`;
  return `${(m / 1000).toFixed(1).replace('.', ',')} km`;
};

function showToast(msg, type='ok'){
  const el = document.getElementById('toast');
  el.className = 'toast ' + type; el.textContent = msg;
  requestAnimationFrame(()=>{el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)});
}

function getAssetCoords(asset){
  let baseLat = asset.rodovia === 'BR101' ? -24.0058 : -22.8512;
  let baseLon = asset.rodovia === 'BR101' ? -46.4023 : -43.7744;
  let latOffset = (asset.kmVal - 100.0) / 111.0;
  return { lat: baseLat + latOffset, lon: baseLon + (latOffset * 0.25) };
}

function getStrictFiberNeighbors(targetAsset){
  let pool = rawAssets.filter(a => a.estado === targetAsset.estado && a.rodovia === targetAsset.rodovia);
  pool.sort((a,b) => a.kmVal - b.kmVal);

  let targetFibers = targetAsset.fibra.split(/[,/ ]+/).map(f => f.trim()).filter(Boolean);
  let prevFiber = null, nextFiber = null;

  for(let a of pool){
    if(a.kmVal < targetAsset.kmVal){
      let shares = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(shares) prevFiber = a;
    }
  }

  for(let i = pool.length - 1; i >= 0; i--){
    let a = pool[i];
    if(a.kmVal > targetAsset.kmVal){
      let shares = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(shares) nextFiber = a;
    }
  }

  return { prevFiber, nextFiber };
}

function updateLiveGpsAndNearestAsset(){
  if(!pos) return;
  
  let nearest = rawAssets[0], minD = Infinity;
  rawAssets.forEach(a => {
    let coords = getAssetCoords(a);
    let d = hav(pos.lat, pos.lon, coords.lat, coords.lon);
    if(d < minD){ minD = d; nearest = a; }
  });

  let estKm = nearest.kmVal + ((pos.lat - getAssetCoords(nearest).lat) * 111.0);
  if(estKm < 0) estKm = Math.abs(estKm);
  let kmStr = estKm.toFixed(3).replace('.', ',');
  
  document.getElementById('kmVal').textContent = `KM ${kmStr}`;
  document.getElementById('topKmLive').textContent = `KM ${kmStr}`;
  document.getElementById('kmBrBadge').textContent = `${nearest.rodovia} (${nearest.estado})`;
  
  document.getElementById('gpsStatus').className = 'gps ok';
  document.getElementById('gpsText').textContent = `GPS ATIVO (±${Math.round(pos.acc)}M)`;

  let neighbors = getStrictFiberNeighbors(nearest);
  let container = document.getElementById('nearestAssetContainer');

  container.innerHTML = `
    <div class="asset-post">
      <div class="post-top">
        <div style="flex:1;">
          <p class="post-id">TAG: ${nearest.tag} (${nearest.rodovia} - ${nearest.estado})</p>
          <p class="post-dist" style="color:var(--accent);">${nearest.equip} · KM ${nearest.km}</p>
          <p class="post-dist" style="color:var(--green2);">Fibra Ativa: <b>${nearest.fibra}</b> | Host: ${nearest.host || '---'}</p>
          <p class="post-dist">Distância de si: <b>${formatDist(minD)}</b> | IP: ${nearest.ipGer || '---'}</p>
        </div>
        <button class="post-wa" onclick="sendWhatsApp('${nearest.tag}')" title="Enviar WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
      </div>

      <div class="fiber-box">
        <div class="fiber-header">🔌 Interligação por Fibra Óptica (${nearest.fibra})</div>
        <div class="fiber-neighbors">
          <div class="fiber-card">
            <div class="fiber-card-lbl">⬅️ Anterior na Fibra</div>
            <div class="fiber-card-id">${neighbors.prevFiber ? neighbors.prevFiber.tag : 'Nenhum'}</div>
            <div class="fiber-card-sub">${neighbors.prevFiber ? 'KM ' + neighbors.prevFiber.km + ' ('+neighbors.prevFiber.equip+')' : '---'}</div>
          </div>
          <div class="fiber-card">
            <div class="fiber-card-lbl">➡️ Posterior na Fibra</div>
            <div class="fiber-card-id">${neighbors.nextFiber ? neighbors.nextFiber.tag : 'Nenhum'}</div>
            <div class="fiber-card-sub">${neighbors.nextFiber ? 'KM ' + neighbors.nextFiber.km + ' ('+neighbors.nextFiber.equip+')' : '---'}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function sendWhatsApp(tag){
  let a = rawAssets.find(item => item.tag === tag);
  if(!a) return;
  let neighbors = getStrictFiberNeighbors(a);

  let tx = `📍 *EQUIPAMENTO MAIS PRÓXIMO - ITS*\n`;
  tx += `TAG: *${a.tag}*\nEquipamento: ${a.equip}\nKM: ${a.km} (${a.rodovia} - ${a.estado})\n`;
  tx += `Fibra: *${a.fibra}*\nIP Gerência: ${a.ipGer}\n\n`;
  tx += `🔌 *VIZINHOS NA MESMA FIBRA (${a.fibra})*\n`;
  tx += `Anterior: ${neighbors.prevFiber ? neighbors.prevFiber.tag + ' (KM ' + neighbors.prevFiber.km + ')' : 'N/A'}\n`;
  tx += `Posterior: ${neighbors.nextFiber ? neighbors.nextFiber.tag + ' (KM ' + neighbors.nextFiber.km + ')' : 'N/A'}\n`;
  window.open('https://wa.me/?text=' + encodeURIComponent(tx), '_blank', 'noopener');
}

function initGpsWatch(){
  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(
      p => {
        pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
        updateLiveGpsAndNearestAsset();
      },
      err => {
        pos = { lat: -22.8512, lon: -43.7744, acc: 10 };
        updateLiveGpsAndNearestAsset();
        showToast('Usando posição de referência GPS', 'err');
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
    );
  } else {
    pos = { lat: -22.8512, lon: -43.7744, acc: 10 };
    updateLiveGpsAndNearestAsset();
  }
}

window.addEventListener('DOMContentLoaded', initGpsWatch);
</script>
</body>
</html>
