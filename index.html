<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>TEC · Ativos BR-116 | KMReport</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#0b1220;--card:#121b2e;--card2:#18233a;--line:#24324f;--txt:#e6edf7;--mut:#8a9bb8;--acc:#38bdf8;--ok:#34d399;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0f1a30,#0b1220);border-bottom:1px solid var(--line);padding:12px 16px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--acc);color:#04121f;display:grid;place-items:center}
.brand h1{font-size:1.05rem;letter-spacing:.5px}
.brand small{display:block;color:var(--mut);font-size:.72rem}
.gps{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem}
.gps b{color:var(--acc);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}
main{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.sec-t{display:flex;align-items:center;gap:8px;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-bottom:8px}
.sec-t svg{width:16px;height:16px}
.hero{background:linear-gradient(135deg,#123052,#121b2e);border:1px solid var(--acc);border-radius:16px;padding:18px;box-shadow:0 0 24px rgba(56,189,248,.15)}
.hero .tag{font-size:1.6rem;font-weight:800;letter-spacing:.5px}
.hero .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.kv{background:rgba(0,0,0,.25);border-radius:10px;padding:10px}
.kv span{display:block;font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.kv b{font-size:.95rem;font-variant-numeric:tabular-nums;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-weight:800;font-size:.75rem;letter-spacing:.4px;border:1px solid}
.badge.ok{color:var(--ok);border-color:var(--ok);background:rgba(52,211,153,.12);box-shadow:0 0 14px rgba(52,211,153,.55);text-shadow:0 0 8px rgba(52,211,153,.9)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:rgba(239,68,68,.12);box-shadow:0 0 14px rgba(239,68,68,.55);text-shadow:0 0 8px rgba(239,68,68,.9)}
.badge.wait{color:var(--warn);border-color:var(--warn);background:rgba(245,158,11,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.cur{border-color:var(--acc);background:var(--card2)}
.card .pos{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.card .pos svg{width:14px;height:14px}
.card .t{font-weight:800;font-size:1.05rem}
.card .l{font-size:.8rem;color:var(--mut)}
.card .l b{color:var(--txt);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#0f182a;color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.8px}
tr.cur td{background:rgba(56,189,248,.08)}
tr:last-child td{border-bottom:0}
.foot{color:var(--mut);font-size:.72rem;text-align:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem;cursor:pointer}
.btn svg{width:15px;height:15px}
@media(max-width:520px){.hero .tag{font-size:1.25rem}.gps{width:100%;justify-content:center}}
.alert{border-radius:14px;padding:14px;font-weight:800;display:flex;gap:10px;align-items:center;border:1px solid var(--warn);background:rgba(245,158,11,.12);color:var(--warn)}.alert.near{border-color:var(--ok);color:var(--ok);background:rgba(52,211,153,.12);box-shadow:0 0 18px rgba(52,211,153,.4);animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 4px rgba(52,211,153,.2)}}select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px}</style>
<body>
<header><div class="hrow">
 <div class="brand"><div class="logo"><i data-lucide="radio-tower"></i></div><div><h1>KMReport · TEC</h1><small>Ativos por fibra · BR-116</small></div></div>
 <div class="gps"><span id="gpsDot" class="dot"></span><span id="gpsTxt">Obtendo GPS…</span> <b id="kmTxt">KM —</b></div>
</div></header>
<main>
 <div class="alert" id="alert"><i data-lucide="loader"></i><span>Carregando bases…</span></div>
 <section><div class="sec-t"><i data-lucide="crosshair"></i>Ativo mais próximo</div><div class="hero" id="hero"></div></section>
 <section><div class="sec-t" style="justify-content:space-between"><span style="display:flex;gap:8px;align-items:center"><i data-lucide="cable"></i><span id="fibTit">Mesma fibra</span></span>
   <select id="selFib"><option value="">Fibra do ativo atual</option></select></div>
   <div class="grid" id="grid"></div></section>
 <section><div class="sec-t"><i data-lucide="table"></i>Detalhamento · Ping ao vivo</div>
  <div class="tbl"><table><thead><tr><th>Posição</th><th>TAG</th><th>Equip.</th><th>KM</th><th>Dist.</th><th>IP</th><th>Hostname</th><th>Fibras</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
 <p class="foot" id="foot"></p>
</main>
<script>
const NEAR_M=150;           // distância para considerar "no ativo"
const norm=s=>String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_ ]+/g,' ').replace(/\s+/g,' ');
const parsePt=v=>{const s=String(v??'').trim();return/,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 12742000*Math.asin(Math.sqrt(x))};
function findCol(h,cs){const m=h.map(norm);for(const c of cs){const i=m.indexOf(norm(c));if(i>=0)return i}for(const c of cs){const i=m.findIndex(x=>x.includes(norm(c)));if(i>=0)return i}return-1}
function kmNum(v){const s=String(v||'').trim();if(s.includes('+')){const[a,b]=s.split('+');return(+a.replace(/\D/g,''))+(+b.replace(/\D/g,''))/1000}return parsePt(s)}
const kmFmt=n=>{if(!Number.isFinite(n))return'—';const a=Math.floor(n),b=Math.round((n-a)*1000);return String(a).padStart(3,'0')+'+'+String(b).padStart(3,'0')};
const fibKey=f=>String(f||'').replace(/\s/g,'').replace(/[;\/]/g,',');

let kmDB=[],ATIVOS=[],pos=null,curKm=null,center=null,status={},lastNear=null;
const FALLBACK=[["BR116-CF0815","CFTV DAI","098+908","172.26.45.184","RSP-SA14-N098_908","11, 12"],["SAT 099 + 140","SAT","099+140","172.26.9.229","RSP-ITS-N099_140","11, 12"],["BR116-CF0816","CFTV DAI","099+263","172.26.9.177","RSP-SA14-N099_263","21, 22"],["BR116-CF0817","CFTV DAI","099+622","172.26.9.194","RSP-SA15-N099_622","11, 12"],["BR116-CF0840","CFTV DAI","100+060","172.26.9.211","RSP-SA16-N100_060","21, 22"]].map(([tag,equip,km,ip,host,fibra])=>({tag,equip,km,ip,host,fibra,kmN:kmNum(km)}));

async function getText(names){for(const n of names){for(const pre of ['./','../','/']){try{const r=await fetch(pre+encodeURIComponent(n)+'?v='+Date.now(),{cache:'no-store'});if(r.ok){let t=await r.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);return t}}catch(e){}}}return null}
function rows(t){const L=t.split(/\r?\n/).filter(l=>l.trim());const sep=(L[0].split(';').length>=L[0].split(',').length)?';':',';return{h:L.shift().split(sep),r:L.map(l=>l.split(sep))}}

async function loadKm(){const t=await getText(['SNVBR116SPRJ.csv']);if(!t)return;const{h,r}=rows(t);
 const a=findCol(h,['km']),b=findCol(h,['lat','latitude']),c=findCol(h,['long','lon','longitude']);
 kmDB=r.map(x=>({km:parsePt(x[a]),lat:parsePt(x[b]),lon:parsePt(x[c])})).filter(p=>Number.isFinite(p.km)&&Number.isFinite(p.lat));}
function kmAt(lat,lon){let best=null,bd=Infinity;for(const p of kmDB){const d=hav(lat,lon,p.lat,p.lon);if(d<bd){bd=d;best=p}}return best?{km:best.km,d:bd}:null}

async function loadAtivos(){const t=await getText(['ativos 116.csv','ativos116.csv','ativos_116.csv']);
 if(!t){ATIVOS=FALLBACK;return'base embutida (ativos 116.csv não encontrado)'}
 const{h,r}=rows(t);const ix={tag:findCol(h,['tag']),equip:findCol(h,['equipamento','equip','tipo']),km:findCol(h,['km']),ip:findCol(h,['ip gerencia','ip']),host:findCol(h,['hostname','host']),fibra:findCol(h,['fibras','fibra']),lat:findCol(h,['latitude','lat']),lon:findCol(h,['longitude','long','lon'])};
 const g=(x,k)=>ix[k]>=0?String(x[ix[k]]??'').trim():'';
 ATIVOS=r.map(x=>{const o={tag:g(x,'tag'),equip:g(x,'equip'),km:g(x,'km'),ip:g(x,'ip'),host:g(x,'host'),fibra:g(x,'fibra')};o.kmN=kmNum(o.km);
   if(!Number.isFinite(o.kmN)&&ix.lat>=0&&kmDB.length){const k=kmAt(parsePt(x[ix.lat]),parsePt(x[ix.lon]));if(k){o.kmN=k.km;o.km=kmFmt(k.km)}}return o})
  .filter(o=>o.tag&&Number.isFinite(o.kmN)).sort((a,b)=>a.kmN-b.kmN);
 if(!ATIVOS.length){ATIVOS=FALLBACK;return'base embutida (colunas não reconhecidas)'}
 return ATIVOS.length+' ativos carregados';}

function fibras(){const s=[...new Set(ATIVOS.map(a=>fibKey(a.fibra)).filter(Boolean))].sort();const sel=document.getElementById('selFib');sel.innerHTML='<option value="">Fibra do ativo atual</option>'+s.map(f=>`<option>${f}</option>`).join('')}
function nearest(km){let b=null,bd=Infinity;for(const a of ATIVOS){const d=Math.abs(a.kmN-km);if(d<bd){bd=d;b=a}}return b}
function sequence(){if(!center)return[];const fk=document.getElementById('selFib').value||fibKey(center.fibra);
 const list=ATIVOS.filter(a=>fibKey(a.fibra)===fk);let i=list.indexOf(center);
 if(i<0){const ref=curKm??center.kmN;i=list.findIndex(a=>a.kmN>=ref);if(i<0)i=list.length-1}
 document.getElementById('fibTit').textContent=`Fibra ${fk||'—'} · ${list.length} ativos`;
 return[-2,-1,0,1,2].map(o=>list[i+o]||null)}
const LBL=["2º Anterior","1º Anterior","Atual","1º Posterior","2º Posterior"],ICO=["chevrons-left","chevron-left","map-pin","chevron-right","chevrons-right"];
const distM=a=>curKm==null?'—':Math.round(Math.abs(a.kmN-curKm)*1000)+' m';
function badge(ip){const s=status[ip];if(!ip)return'<span class="badge wait">SEM IP</span>';
 if(s==='ok')return'<span class="badge ok"><i data-lucide="wifi"></i>ONLINE (PING OK)</span>';
 if(s==='bad')return'<span class="badge bad"><i data-lucide="wifi-off"></i>OFFLINE (TIMEOUT / FALHA)</span>';
 return'<span class="badge wait"><i data-lucide="loader"></i>TESTANDO…</span>'}
function render(){const seq=sequence(),c=center,al=document.getElementById('alert');
 if(c&&curKm!=null){const d=Math.abs(c.kmN-curKm)*1000;
   if(d<=NEAR_M){al.className='alert near';al.innerHTML=`<i data-lucide="bell-ring"></i><span>VOCÊ ESTÁ NO ATIVO ${c.tag} · ${Math.round(d)} m</span>`;
     if(lastNear!==c.tag){lastNear=c.tag;navigator.vibrate?.([200,100,200])}}
   else{al.className='alert';al.innerHTML=`<i data-lucide="navigation"></i><span>Próximo ativo: ${c.tag} a ${Math.round(d)} m</span>`;lastNear=null}}
 document.getElementById('hero').innerHTML=c?`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="kv" style="background:none;padding:0"><span>${c.equip}</span></div><div class="tag">${c.tag}</div></div>${badge(c.ip)}</div>
  <div class="meta"><div class="kv"><span>KM</span><b>${c.km}</b></div><div class="kv"><span>Distância</span><b>${distM(c)}</b></div><div class="kv"><span>IP</span><b>${c.ip}</b></div><div class="kv"><span>Hostname</span><b>${c.host}</b></div><div class="kv"><span>Fibras</span><b>${c.fibra}</b></div></div>`:'Aguardando posição…';
 document.getElementById('grid').innerHTML=seq.map((a,i)=>a?`<div class="card ${i==2?'cur':''}"><div class="pos"><i data-lucide="${ICO[i]}"></i>${LBL[i]}</div><div class="t">${a.tag}</div><div class="l">${a.equip} · KM <b>${a.km}</b> · ${distM(a)}</div><div class="l">IP <b>${a.ip}</b></div><div class="l">Fibras <b>${a.fibra}</b></div><div style="margin-top:6px">${badge(a.ip)}</div></div>`:`<div class="card"><div class="pos">${LBL[i]}</div><div class="l">Sem ativo nesta fibra</div></div>`).join('');
 document.getElementById('tbody').innerHTML=seq.map((a,i)=>a?`<tr class="${i==2?'cur':''}"><td>${LBL[i]}</td><td><b>${a.tag}</b></td><td>${a.equip}</td><td>${a.km}</td><td>${distM(a)}</td><td>${a.ip}</td><td>${a.host}</td><td>${a.fibra}</td><td>${badge(a.ip)}</td></tr>`:'').join('');
 lucide.createIcons()}

function onPos(p){pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
 const k=kmDB.length?kmAt(pos.lat,pos.lon):null;const dot=document.getElementById('gpsDot'),tx=document.getElementById('gpsTxt');
 dot.className='dot '+(pos.acc<=15?'on':'');
 if(k&&k.d<1500){curKm=k.km;tx.textContent='GPS ±'+Math.round(pos.acc)+'m';document.getElementById('kmTxt').textContent='KM '+curKm.toFixed(2).replace('.',',');center=nearest(curKm)}
 else{tx.textContent=k?`Fora da rodovia (${(k.d/1000).toFixed(1)} km)`:'Base KM indisponível'}
 render()}
function onErr(e){document.getElementById('gpsDot').className='dot off';document.getElementById('gpsTxt').textContent='GPS indisponível';render()}

async function ping(ip){const c=new AbortController(),t=setTimeout(()=>c.abort(),1200);
 try{await fetch('http://'+ip+'/?_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:c.signal});return true}catch(e){return false}finally{clearTimeout(t)}}
async function loop(){while(true){const s=sequence().filter(a=>a&&a.ip);const r=await Promise.all(s.map(a=>ping(a.ip)));
 s.forEach((a,i)=>status[a.ip]=r[i]?'ok':'bad');render();
 document.getElementById('foot').textContent='Último teste '+new Date().toLocaleTimeString('pt-BR')+' · ciclo 3s · timeout 1.2s · '+window._info;
 await new Promise(r=>setTimeout(r,3000))}}
document.getElementById('selFib').onchange=render;

(async()=>{await loadKm();window._info=await loadAtivos();fibras();
 center=ATIVOS.find(a=>a.tag==='BR116-CF0816')||ATIVOS[0];
 document.getElementById('alert').innerHTML='<i data-lucide="satellite"></i><span>'+window._info+' · '+kmDB.length+' pontos KM · aguardando GPS</span>';render();
 if('geolocation'in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:10000});else onErr();
 loop()})();
</script>
</body></html>
