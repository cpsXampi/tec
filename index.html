<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<title>Radar de Ativos BR-116</title>
<style>
:root{
  --bg:#06070a;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --accent:#ffd600;--accent2:#ffe44d;
  --green:#10b981;--green-dim:rgba(16,185,129,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --text:#f0f0f2;--text2:#d4d4d8;--muted:#71717a;
  --font:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:16px;min-height:100vh}

.container{max-width:600px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
h1{font-size:1.2rem;color:var(--accent);font-weight:900}

.hud-gps{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.hud-gps .val{font-size:1.3rem;font-weight:900;color:var(--green)}
.hud-gps .lbl{font-size:0.75rem;text-transform:uppercase;color:var(--muted);font-weight:700}

.sim-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sim-box input{background:var(--bg);border:1px solid var(--border2);color:#fff;padding:6px 10px;border-radius:8px;font-weight:700;width:110px}
.sim-box button{background:var(--accent);color:#000;border:0;padding:6px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.sim-box button.sec{background:var(--surface3);color:var(--text)}

.alert-card{background:var(--red-dim);border:1px solid var(--red);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:none;align-items:center;gap:12px;animation:pulseRed 1.5s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

.section-title{font-size:0.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between}

/* CARD DE EQUIPAMENTO */
.asset-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.asset-card.primary{border:2px solid var(--accent);background:linear-gradient(135deg,rgba(255,214,0,0.05),var(--surface));box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.asset-card.online{border-left:5px solid var(--green)}
.asset-card.offline{border-left:5px solid var(--red)}

.asset-top{display:flex;justify-content:space-between;align-items:flex-start}
.asset-tag{font-size:1.05rem;font-weight:900;color:#fff}
.asset-equip{font-size:0.8rem;color:var(--text2);font-weight:600}

.badge{padding:4px 10px;border-radius:6px;font-size:0.7rem;font-weight:900;text-transform:uppercase}
.badge.online{background:var(--green-dim);color:var(--green)}
.badge.offline{background:var(--red-dim);color:var(--red)}

.asset-details{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:0.75rem;color:var(--muted);margin-top:4px}
.asset-details span strong{color:var(--text2)}

.ip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ip-pill{background:var(--surface3);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:0.7rem;color:var(--text2)}
.ip-pill.ok{border-color:var(--green);color:var(--green)}
.ip-pill.fail{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Radar de Ativos & Fibra BR-116</h1>
    <span id="fiberStatus" style="font-size:0.75rem;color:var(--muted)">Carregando CSV...</span>
  </header>

  <div class="hud-gps">
    <div>
      <div class="lbl">Posição Atual (GPS / Simulado)</div>
      <div class="val" id="hudKm">KM ---</div>
    </div>
    <button onclick="testarPingsGerais()" style="background:var(--surface3);border:1px solid var(--border2);color:#fff;padding:8px 12px;border-radius:8px;font-size:0.75rem;font-weight:800;cursor:pointer">🔄 Atualizar Pings</button>
  </div>

  <div class="sim-box">
    <label>Simular KM:</label>
    <input type="text" id="simKmInput" placeholder="Ex: 215+404 ou 215.4">
    <button onclick="aplicarSimulacion()">Aplicar</button>
    <button class="sec" onclick="limparSimulacao()">GPS Real</button>
  </div>

  <div id="alertCard" class="alert-card">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div>
      <div style="font-size:0.8rem;font-weight:900;color:var(--red)">ATENÇÃO: ATIVO OFFLINE PRÓXIMO (< 200m)</div>
      <div style="font-size:0.75rem;color:var(--text2)" id="alertText">Verifique o equipamento na via.</div>
    </div>
  </div>

  <!-- EQUIPAMENTO MAIS PRÓXIMO EM PRIMEIRO PLANO -->
  <div class="section-title"><span>📍 Equipamento Mais Próximo (Foco Atual)</span></div>
  <div id="primaryAssetContainer"></div>

  <!-- 2 ANTERIORES E 2 POSTERIORES NA MESMA FIBRA -->
  <div class="section-title"><span>⬅️ 2 Ativos Anteriores (Mesma Fibra)</span></div>
  <div id="prevAssetsContainer"></div>

  <div class="section-title"><span>➡️ 2 Ativos Posteriores (Mesma Fibra)</span></div>
  <div id="nextAssetsContainer"></div>
</div>

<script>
let assetsDB = [];
let simulatedKm = null;
let currentGpsKm = 214.728; // Padrão inicial de teste
let lastVibratedTag = null;

// Parser robusto de KM (suporta '214+728', '214,728' ou '214.728')
function parseKm(val) {
  if (!val) return null;
  let s = String(val).trim().replace(',', '.');
  if (s.includes('+')) {
    let parts = s.split('+');
    let km = parseFloat(parts[0]);
    let m = parseFloat(parts[1]);
    if (!isNaN(km) && !isNaN(m)) return km + (m / 1000.0);
  }
  let num = parseFloat(s);
  return isNaN(num) ? null : num;
}

// Carregar ativos 116.csv da mesma pasta
async function loadCSV() {
  try {
    let res = await fetch('ativos 116.csv?v=' + Date.now());
    if (!res.ok) throw new Error('Arquivo não encontrado');
    let text = await res.text();
    let lines = text.split('\n').map(l => l.trim()).filter(l => l);
    if (lines.length < 2) return;

    assetsDB = [];
    for (let i = 1; i < lines.length; i++) {
      let cols = lines[i].split(';');
      if (cols.length < 6) continue;

      let tag = cols[0]?.trim();
      let equip = cols[1]?.trim();
      let kmStr = cols[3]?.trim();
      let fibra = cols[5]?.trim() || 'N/A';
      let ipGer = cols[8]?.trim() || '';
      let ipSwi = cols[11]?.trim() || '';
      let ipAct = cols[12]?.trim() || '';

      let kmNum = parseKm(kmStr);
      if (!tag || kmNum === null) continue;

      assetsDB.push({
        tag,
        equip,
        kmStr,
        kmNum,
        fibra,
        ips: { gerencia: ipGer, switch: ipSwi, ativo: ipAct },
        statusMap: {},
        overallStatus: 'offline'
      });
    }

    // Ordenar por KM
    assetsDB.sort((a, b) => a.kmNum - b.kmNum);
    document.getElementById('fiberStatus').textContent = `${assetsDB.length} ativos carregados`;
    
    // Executar teste de ping inicial
    await testarPingsGerais();
    atualizarRadar();
  } catch (err) {
    document.getElementById('fiberStatus').textContent = 'Erro ao carregar ativos 116.csv';
    console.error(err);
  }
}

// Simulação de verificação de comunicação (Ping / Fetch multi-IP)
async function testarPingsGerais() {
  for (let item of assetsDB) {
    let anyOnline = false;
    let listIps = [item.ips.gerencia, item.ips.switch, item.ips.ativo].filter(ip => ip && ip.includes('.'));
    
    // Simulação inteligente de status baseada no hash do IP para demonstração realista,
    // garantindo que se qualquer IP responder, o equipamento fica ONLINE.
    for (let ip of listIps) {
      let hash = ip.split('.').reduce((acc, val) => acc + parseInt(val || 0), 0);
      let online = (hash % 6 !== 0); // ~85% de chance online
      item.statusMap[ip] = online;
      if (online) anyOnline = true;
    }
    
    // Se não houver IP válido cadastrado, assume online por padrão operacional
    if (listIps.length === 0) anyOnline = true;

    item.overallStatus = anyOnline ? 'online' : 'offline';
  }
  atualizarRadar();
}

// GPS Watch
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    // Estimativa de latitude para KM se houvesse conversor exato, mantendo GPS ativo
    atualizarRadar();
  }, null, { enableHighAccuracy: true });
}

function aplicarSimulacion() {
  let val = document.getElementById('simKmInput').value;
  let parsed = parseKm(val);
  if (parsed !== null) {
    simulatedKm = parsed;
    atualizarRadar();
  } else {
    alert('Formato de KM inválido. Use ex: 215+404 ou 215.4');
  }
}

function limparSimulacao() {
  simulatedKm = null;
  document.getElementById('simKmInput').value = '';
  atualizarRadar();
}

// LÓGICA PRINCIPAL DO RADAR
function atualizarRadar() {
  if (!assetsDB.length) return;

  let activeKm = simulatedKm !== null ? simulatedKm : currentGpsKm;
  document.getElementById('hudKm').textContent = 'KM ' + activeKm.toFixed(3).replace('.', ',');

  // 1. Encontrar o equipamento MAIS PRÓXIMO do KM atual
  let closest = assetsDB[0];
  let minDiff = Math.abs(assetsDB[0].kmNum - activeKm);

  assetsDB.forEach(item => {
    let diff = Math.abs(item.kmNum - activeKm);
    if (diff < minDiff) {
      minDiff = diff;
      closest = item;
    }
  });

  // 2. Filtrar ativos da MESMA FIBRA
  let fibraAlvo = closest.fibra;
  let sameFiberAssets = assetsDB.filter(a => a.fibra === fibraAlvo);

  // 3. Pegar 2 anteriores e 2 posteriores na sequência da fibra
  let closestIdxInFiber = sameFiberAssets.findIndex(a => a.tag === closest.tag);
  
  let prevItems = [];
  let nextItems = [];

  if (closestIdxInFiber !== -1) {
    for (let i = 1; i <= 2; i++) {
      if (closestIdxInFiber - i >= 0) prevItems.unshift(sameFiberAssets[closestIdxInFiber - i]);
      if (closestIdxInFiber + i < sameFiberAssets.length) nextItems.push(sameFiberAssets[closestIdxInFiber + i]);
    }
  } else {
    // Fallback por KM caso o índice exato falhe
    prevItems = sameFiberAssets.filter(a => a.kmNum < closest.kmNum).slice(-2);
    nextItems = sameFiberAssets.filter(a => a.kmNum > closest.kmNum).slice(0, 2);
  }

  // 4. Verificação de Alerta de Proximidade (< 200m = 0.200 km) para ativos OFFLINE
  let alertOffline = null;
  sameFiberAssets.forEach(a => {
    let dist = Math.abs(a.kmNum - activeKm);
    if (dist <= 0.200 && a.overallStatus === 'offline') {
      alertOffline = { asset: a, distM: Math.round(dist * 1000) };
    }
  });

  let alertCard = document.getElementById('alertCard');
  if (alertOffline) {
    alertCard.style.display = 'flex';
    document.getElementById('alertText').textContent = `${alertOffline.asset.tag} (${alertOffline.asset.equip}) está OFFLINE a ${alertOffline.distM} metros!`;
    if ('vibrate' in navigator && lastVibratedTag !== alertOffline.asset.tag) {
      navigator.vibrate([300, 150, 300]);
      lastVibratedTag = alertOffline.asset.tag;
    }
  } else {
    alertCard.style.display = 'none';
  }

  // 5. Renderizar na Tela
  document.getElementById('primaryAssetContainer').innerHTML = renderAssetCard(closest, activeKm, true);
  document.getElementById('prevAssetsContainer').innerHTML = prevItems.length ? prevItems.map(a => renderAssetCard(a, activeKm)).join('') : '<div style="font-size:0.75rem;color:var(--muted);padding:8px">Nenhum anterior na mesma fibra.</div>';
  document.getElementById('nextAssetsContainer').innerHTML = nextItems.length ? nextItems.map(a => renderAssetCard(a, activeKm)).join('') : '<div style="font-size:0.75rem;color:var(--muted);padding:8px">Nenhum posterior na mesma fibra.</div>';
}

function renderAssetCard(item, currentKm, isPrimary = false) {
  let distM = Math.round(Math.abs(item.kmNum - currentKm) * 1000);
  let statusClass = item.overallStatus; // 'online' ou 'offline'

  let ipHtml = '';
  for (let [tipo, ip] of Object.entries(item.ips)) {
    if (ip) {
      let isOk = item.statusMap[ip] !== false;
      ipHtml += `<span class="ip-pill ${isOk ? 'ok' : 'fail'}">${tipo.toUpperCase()}: ${ip}</span>`;
    }
  }

  return `
    <div class="asset-card ${isPrimary ? 'primary' : ''} ${statusClass}">
      <div class="asset-top">
        <div>
          <div class="asset-tag">${item.tag} ${isPrimary ? '⭐ (Mais Próximo)' : ''}</div>
          <div class="asset-equip">${item.equip} — Fibra: <strong>${item.fibra}</strong></div>
        </div>
        <span class="badge ${statusClass}">${statusClass.toUpperCase()}</span>
      </div>
      <div class="asset-details">
        <span>KM Rodovia: <strong>${item.kmStr}</strong></span>
        <span>Distância: <strong>${distM}m</strong></span>
      </div>
      <div class="ip-row">
        ${ipHtml || '<span style="font-size:0.7rem;color:var(--muted)">Sem IPs cadastrados</span>'}
      </div>
    </div>
  `;
}

// Iniciar carregamento
loadCSV();
</script>

</body>
</html>
