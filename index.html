<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor & Diagnóstico de Ativos BR-116</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --online: #22c55e;
            --offline: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 { font-size: 1.4rem; color: var(--accent); }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
        
        input, select, button {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        button {
            cursor: pointer;
            background: #0284c7;
            border: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex: 1;
            text-align: center;
        }

        .stat-card .val { font-size: 1.4rem; font-weight: bold; }
        .stat-card.online .val { color: var(--online); }
        .stat-card.offline .val { color: var(--offline); }

        /* Estilo dos Grupos (Fibra / Anel) */
        .group-container {
            margin-bottom: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .group-header {
            background: #111827;
            padding: 12px 16px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        th { background: #0f172a; color: var(--text-muted); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
        }
        .badge.online { background: rgba(34, 197, 94, 0.2); color: var(--online); }
        .badge.offline { background: rgba(239, 68, 68, 0.2); color: var(--offline); }
        .badge.pending { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
        
        .ip-list { font-family: monospace; font-size: 0.85rem; }
        .ip-tag { display: inline-block; background: #0f172a; padding: 2px 6px; border-radius: 4px; margin-right: 4px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <h1>Painel de Ativos & IPs - Rodovia BR-116</h1>
        <div style="font-size: 0.85rem; color: var(--text-muted);">
            Carregar CSV Local: <input type="file" id="csvFileInput" accept=".csv" style="display:inline-block; width: auto;">
        </div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Agrupar Por</label>
            <select id="groupMode" onchange="renderData()">
                <option value="none">Sem Agrupamento (Lista Direta)</option>
                <option value="anel">Anel FO / NEL (Nó de Enlace)</option>
                <option value="fibra">Par de Fibra (FO)</option>
                <option value="equipamento">Tipo de Equipamento</option>
            </select>
        </div>

        <div class="control-group">
            <label>Status Online/Offline</label>
            <select id="statusFilter" onchange="renderData()">
                <option value="all">Todos os Status</option>
                <option value="online">Apenas ONLINE</option>
                <option value="offline">Apenas OFFLINE</option>
            </select>
        </div>

        <div class="control-group" style="flex-grow: 1;">
            <label>Buscar (Tag, KM, IP, Equipamento)</label>
            <input type="text" id="searchInput" placeholder="Digite para buscar..." oninput="renderData()">
        </div>

        <div class="control-group" style="justify-content: flex-end;">
            <button onclick="pingAllSimulated()">Ping / Testar Conectividade</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-card"><div class="val" id="totalCount">0</div><div>Total Registros</div></div>
        <div class="stat-card online"><div class="val" id="onlineCount">0</div><div>Online</div></div>
        <div class="stat-card offline"><div class="val" id="offlineCount">0</div><div>Offline / Falha</div></div>
    </div>

    <div id="contentArea"></div>

    <script>
        let rawData = [];

        // Estrutura padrão de leitura do CSV de Ativos 116
        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length < 2) return [];

            const result = [];
            // O arquivo usa delimitador ';'
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(';');
                if (cols.length < 5) continue;

                const tag = cols[0]?.trim();
                const equip = cols[1]?.trim();
                const km = cols[3]?.trim();
                const fibra = cols[5]?.trim() || 'N/A';
                const anel = cols[7]?.trim() || 'Sem Anel / Não Informado';
                const ipGerencia = cols[8]?.trim();
                const ipSwitch = cols[11]?.trim();
                const ipAtivo = cols[12]?.trim();

                if (!tag && !ipGerencia && !ipSwitch) continue;

                // Definimos um IP principal de teste
                const targetIP = ipAtivo || ipSwitch || ipGerencia || 'N/A';

                result.push({
                    tag: tag || 'Sem TAG',
                    equip: equip || 'Outro',
                    km: km || '-',
                    fibra: fibra,
                    anel: anel,
                    ipGerencia: ipGerencia || '-',
                    ipSwitch: ipSwitch || '-',
                    ipAtivo: ipAtivo || '-',
                    targetIP: targetIP,
                    status: 'pending' // pending, online, offline
                });
            }
            return result;
        }

        // Leitura do arquivo carregado pelo usuário
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                rawData = parseCSV(evt.target.result);
                renderData();
            };
            reader.readAsText(file);
        });

        // Simulação de Ping / Teste de Conexão HTTP Fetch
        async function pingAllSimulated() {
            for (let item of rawData) {
                if (item.targetIP === 'N/A') {
                    item.status = 'offline';
                    continue;
                }
                
                // Em ambiente real de rede corporativa, o ping é simulado com requisição leve HTTP/HTTPS ou WebSocket:
                try {
                    // Simulação rápida para demonstração da interface (substituir por API local se necessário)
                    const isOnline = Math.random() > 0.15; // 85% de chance de dar online
                    item.status = isOnline ? 'online' : 'offline';
                } catch {
                    item.status = 'offline';
                }
            }
            renderData();
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            return rawData.filter(item => {
                const matchesSearch = 
                    item.tag.toLowerCase().includes(search) ||
                    item.equip.toLowerCase().includes(search) ||
                    item.km.toLowerCase().includes(search) ||
                    item.targetIP.toLowerCase().includes(search) ||
                    item.anel.toLowerCase().includes(search);

                const matchesStatus = 
                    statusFilter === 'all' || 
                    item.status === statusFilter;

                return matchesSearch && matchesStatus;
            });
        }

        function updateStats(filtered) {
            document.getElementById('totalCount').innerText = filtered.length;
            document.getElementById('onlineCount').innerText = filtered.filter(i => i.status === 'online').length;
            document.getElementById('offlineCount').innerText = filtered.filter(i => i.status === 'offline').length;
        }

        function renderTableRows(items) {
            return items.map(item => `
                <tr>
                    <td><strong>${item.tag}</strong></td>
                    <td>${item.equip}</td>
                    <td>KM ${item.km}</td>
                    <td><span class="badge ${item.status}">${item.status.toUpperCase()}</span></td>
                    <td class="ip-list">
                        <span class="ip-tag" title="IP Ativo">${item.ipAtivo}</span>
                    </td>
                    <td class="ip-list">${item.ipSwitch}</td>
                    <td class="ip-list">${item.ipGerencia}</td>
                    <td>${item.fibra}</td>
                </tr>
            `).join('');
        }

        function renderData() {
            const data = filterData();
            updateStats(data);

            const groupMode = document.getElementById('groupMode').value;
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            if (data.length === 0) {
                contentArea.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">Nenhum ativo encontrado ou carregue o arquivo ativos 116.csv.</div>';
                return;
            }

            if (groupMode === 'none') {
                contentArea.innerHTML = `
                    <div class="group-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>TAG</th>
                                    <th>Equipamento</th>
                                    <th>KM</th>
                                    <th>Status IP</th>
                                    <th>IP Ativo</th>
                                    <th>IP Switch</th>
                                    <th>IP Gerência</th>
                                    <th>FO</th>
                                </tr>
                            </thead>
                            <tbody>${renderTableRows(data)}</tbody>
                        </table>
                    </div>`;
            } else {
                // Agrupamento Dinâmico (Anel / Fibra / Equipamento)
                const groupKey = groupMode === 'anel' ? 'anel' : (groupMode === 'fibra' ? 'fibra' : 'equip');
                const groups = {};

                data.forEach(item => {
                    const key = item[groupKey] || 'Outros';
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(item);
                });

                for (let [groupName, items] of Object.entries(groups)) {
                    const onlineInGroup = items.filter(i => i.status === 'online').length;
                    const groupHtml = `
                        <div class="group-container">
                            <div class="group-header">
                                <span>${groupMode.toUpperCase()}: ${groupName}</span>
                                <span style="font-size:0.8rem; color: var(--text-muted);">
                                    Total: ${items.length} | Online: ${onlineInGroup}
                                </span>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>TAG</th>
                                        <th>Equipamento</th>
                                        <th>KM</th>
                                        <th>Status IP</th>
                                        <th>IP Ativo</th>
                                        <th>IP Switch</th>
                                        <th>IP Gerência</th>
                                        <th>FO</th>
                                    </tr>
                                </thead>
                                <tbody>${renderTableRows(items)}</tbody>
                            </table>
                        </div>`;
                    contentArea.innerHTML += groupHtml;
                }
            }
        }
    </script>
</body>
</html>
