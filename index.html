<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<title>KM Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{--bg:#0b1320;--s1:#141e30;--s2:#1e2a40;--line:rgba(255,255,255,.12);--acc:#fbbf24;--ok:#10b981;--bad:#ef4444;--tx:#f3f4f6;--mu:#9ca3af;--sb:max(env(safe-area-inset-bottom),16px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
#start{align-items:center;justify-content:center;padding:calc(24px + var(--st)) 20px var(--sb);overflow-y:auto}.card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}.card h1{font-size:22px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.fld{margin-top:16px;text-align:left}.fld label{display:block;font-size:11px;color:var(--mu);margin-bottom:6px;text-transform:uppercase}.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;color:#fff}.btn{width:100%;min-height:48px;border-radius:12px;font-weight:700;font-size:15px;margin-top:12px;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}.btn.pri{background:var(--acc);color:#0b1320;border-color:var(--acc)}.btn:active{transform:scale(.98)}.st{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--mu);margin-top:14px}.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.ok{background:var(--ok)}

#cam{flex-direction:column;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:absolute;z-index:5;max-width:min(75vw,320px);background:rgba(15,23,42,0.9);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;top:calc(14px + var(--st));left:12px}.hud b{display:block;font-size:20px;color:#fff}.hud .acc{font-size:10px;color:#93c5fd;margin-top:2px}.hud .address{font-size:11px;color:#fff;margin-top:2px;line-height:1.2}

.chip{position:absolute;z-index:5;top:calc(14px + var(--st));right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{background:rgba(11,19,32,.9);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.pill.rec{display:none}.pill.rec.on{display:flex}.pill.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
.lbl{width:150px;background:rgba(11,19,32,.9);border:1px solid rgba(251,191,36,.4);border-radius:10px;padding:8px 12px;font-size:13px;color:#fff;text-align:right}

.bar{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:20px 16px var(--sb);background:linear-gradient(transparent,rgba(11,19,32,.95));display:flex;flex-direction:column;gap:14px;align-items:center}body.clean .bar,body.clean .lbl{opacity:0;pointer-events:none}
.modes{display:flex;background:rgba(11,19,32,.8);border:1px solid var(--line);border-radius:20px;padding:3px;gap:4px}
.modes button{width:48px;height:38px;border-radius:16px;display:grid;place-items:center;color:var(--mu);transition:all .2s}
.modes button svg{width:20px;height:20px}
.modes button[aria-pressed=true]{background:var(--acc);color:#0b1320}

.row{display:flex;align-items:center;justify-content:center;gap:24px;width:100%}
.rb{width:46px;height:46px;border-radius:50%;background:rgba(11,19,32,.8);border:1px solid var(--line);display:grid;place-items:center;color:#fff}
.rb svg{width:20px;height:20px}
#shut{width:70px;height:70px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center}
#shut i{width:54px;height:54px;border-radius:50%;background:#fff;transition:all .15s}
#shut.rec i{background:var(--bad);border-radius:10px;width:30px;height:30px}
#snap{visibility:hidden}#snap.on{visibility:visible}

#set,#helpModal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px}
#set.on,#helpModal.on{display:flex}#set .card,#helpModal .card{max-height:85vh;overflow-y:auto}

.help-btn{position:absolute;top:calc(16px + var(--st));right:16px;background:var(--s2);border:1px solid var(--line);color:var(--acc);width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:bold;display:grid;place-items:center}

.checkrow{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:13px;margin-top:12px}
.checkrow input{width:18px;height:18px;accent-color:var(--acc)}
.checkgroup{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

.tutorial-step{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;text-align:left}
.tutorial-num{background:var(--acc);color:#0b1320;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.tutorial-text{font-size:12px;color:var(--mu);line-height:1.4}.tutorial-text b{color:#fff}

#toast{position:fixed;z-index:30;left:50%;top:calc(60px + var(--st));transform:translate(-50%,-10px);background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;opacity:0;transition:all .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{color:#fca5a5;border-color:rgba(239,68,68,.4)}
</style>
</head>
<body>

<button class="help-btn" id="openHelp" title="Ajuda">?</button>

<main id="start" class="screen on"><div class="card">
  <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg> KM Report</h1>
  <button class="btn" id="pick"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
  <p class="st"><span class="dot" id="dDir"></span><span id="tDir">---</span></p>
  <button class="btn pri" id="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
</div></main>

<div id="helpModal"><div class="card">
  <div class="tutorial-step"><div class="tutorial-num">1</div><div class="tutorial-text"><b>Pasta:</b> Selecione o diretório de salvamento.</div></div>
  <div class="tutorial-step"><div class="tutorial-num">2</div><div class="tutorial-text"><b>Câmera:</b> Inicie o sistema para leitura de KM/GPS.</div></div>
  <div class="tutorial-step"><div class="tutorial-num">3</div><div class="tutorial-text"><b>Modos:</b> Foto, Vídeo ou Relatório em PDF.</div></div>
  <button class="btn pri" id="closeHelp">OK</button>
</div></div>

<section id="cam" class="screen">
  <video id="v" autoplay playsinline muted></video>
  <div class="hud" id="hud"><b id="km">KM ---</b><div class="acc" id="gps">---</div><div class="address" id="address" hidden></div></div>
  <div class="chip"><div class="pill rec" id="rec">REC</div><input id="lbl" class="lbl" placeholder="#" maxlength="80"></div>
  <div class="bar">
    <div class="modes" role="group">
      <!-- Foto -->
      <button data-m="foto" aria-pressed="true" title="Foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <!-- Vídeo -->
      <button data-m="video" aria-pressed="false" title="Vídeo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
      <!-- PDF -->
      <button data-m="pdf" aria-pressed="false" title="PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
    </div>
    <div class="row">
      <!-- Gear/Ajustes -->
      <button class="rb" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <!-- Disparo -->
      <button id="shut" aria-label="Disparar"><i></i></button>
      <!-- Snap Rápido -->
      <button class="rb" id="snap" aria-label="Snap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
    <!-- Voltar -->
    <button class="pill" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</section>

<div id="set"><div class="card">
  <div class="fld"><label for="label">Etiqueta</label><input id="label" class="inp" maxlength="80" placeholder="#" autocomplete="off"></div>
  <div class="checkgroup">
    <label class="checkrow" for="showKm"><input id="showKm" type="checkbox" checked><span>KM</span></label>
    <label class="checkrow" for="showDate"><input id="showDate" type="checkbox" checked><span>Data/Hora</span></label>
    <label class="checkrow" for="showGps"><input id="showGps" type="checkbox" checked><span>GPS</span></label>
    <label class="checkrow" for="showLabel"><input id="showLabel" type="checkbox" checked><span>Etiqueta</span></label>
  </div>
  <div class="checkgroup"><label class="checkrow" for="showKmFar"><input id="showKmFar" type="checkbox"><span>KM Off-road (>300m)</span></label></div>
  <div class="fld"><label for="camSel">Câmera</label><select id="camSel" class="inp"></select></div>
  <div class="fld"><label for="int">Intervalo (ms)</label><input id="int" class="inp" type="number" min="100" step="50" value="200"></div>
  <div class="fld"><label for="lote">Lote (PDF)</label><input id="lote" class="inp" type="number" min="1" max="500" value="150"></div>
  <button class="btn pri" id="closeSet">OK</button>
</div></div>

<div id="toast" role="status"></div><canvas id="c" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const S={db:[],km:'---',lat:0,lon:0,acc:null,dist:null,address:'',dir:null,stream:null,mode:'foto',cap:false,rec:null,buf:[],batch:1,queue:[],busy:false,saved:0,timer:null,lock:null,tt:0,lastGeoRequest:0,lastGeoPoint:null,geoTimer:null,geoCache:new Map(),geoSeq:0};
const cv=$('c'),cx=cv.getContext('2d',{alpha:false,willReadFrequently:true}),OUTSIDE_LIMIT_M=300;
const safe=(s='')=>String(s).replace(/[,/\\:]/g,'_'),pad=n=>String(n).padStart(2,'0');
const stamp=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
function toast(m,err=false){const t=$('toast');t.textContent=m;t.className=err?'err show':'show';clearTimeout(S.tt);S.tt=setTimeout(()=>t.className='',1800);}
function persist(){try{localStorage.setItem('kmr',JSON.stringify({label:$('label').value,int:$('int').value,lote:$('lote').value,showKm:$('showKm').checked,showDate:$('showDate').checked,showGps:$('showGps').checked,showLabel:$('showLabel').checked,showKmFar:$('showKmFar').checked}));}catch(e){}}
const cfg=(()=>{try{return JSON.parse(localStorage.getItem('kmr')||'{}');}catch{return {};}})();
['label','int','lote'].forEach(k=>{if(cfg[k]!==undefined&&cfg[k]!==null)$(k).value=cfg[k];});
const oldMeta=typeof cfg.showMeta==='boolean'?cfg.showMeta:true;
['showKm','showDate','showGps','showLabel'].forEach(k=>$(k).checked=typeof cfg[k]==='boolean'?cfg[k]:oldMeta);
if(typeof cfg.showKmFar==='boolean')$('showKmFar').checked=cfg.showKmFar;
$('lbl').value=$('label').value;$('lbl').oninput=e=>{$('label').value=e.target.value;persist();};
['label','int','lote'].forEach(k=>$(k).addEventListener('input',persist));
['showKm','showDate','showGps','showLabel','showKmFar'].forEach(k=>$(k).addEventListener('change',()=>{persist();updateLocationUI();}));

$('openHelp').onclick=()=>$('helpModal').classList.add('on');
$('closeHelp').onclick=()=>$('helpModal').classList.remove('on');

const num=v=>{const s=String(v??'').trim();if(!s)return NaN;return /,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s);};
const col=(h,c)=>{const m=h.map(s=>String(s).trim().toLowerCase());for(const x of c){const i=m.indexOf(x);if(i>=0)return i;}return -1;};
function parseCsv(t){
  if(!t)return[];if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  const L=t.split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];
  const sep=L[0].includes(';')?';':',',h=L.shift().split(sep);
  const a=col(h,['km']),b=col(h,['lat','latitude']),c=col(h,['lon','long','longitude']);
  if(a<0||b<0||c<0)return[];
  return L.map(l=>{const r=l.split(sep);return{km:num(r[a]),lat:num(r[b]),lon:num(r[c])};}).filter(p=>[p.km,p.lat,p.lon].every(Number.isFinite));
}

function nearest(la,lo){
  if(!S.db.length)return null;
  const rad=Math.PI/180,R=6371000;let best=null,min=Infinity;
  for(let i=0,len=S.db.length;i<len;i++){
    const p=S.db[i];
    const dLat=(p.lat-la)*rad,dLon=(p.lon-lo)*rad,a=Math.sin(dLat/2)**2+Math.cos(la*rad)*Math.cos(p.lat*rad)*Math.sin(dLon/2)**2,dist=2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    if(dist<min){min=dist;best=p;}
  }
  return best?{km:best.km,dist:min}:null;
}

async function loadCsvData(){
  const possibleFiles = ['SNVBR116SPRJ.csv', 'dados.csv', 'km.csv', 'rodovia.csv'];
  for(const file of possibleFiles){
    try{
      const res = await fetch(file+'?v='+Date.now(),{cache:'no-store'});
      if(res.ok){
        const text = await res.text();
        const parsed = parseCsv(text);
        if(parsed.length > 0){S.db = parsed;refreshNearest();break;}
      }
    }catch(e){}
  }
}

function addressFromResult(data){const a=data?.address||{},street=a.road||a.pedestrian||a.residential||a.footway||a.path||a.highway;const number=a.house_number;const area=a.suburb||a.neighbourhood||a.city_district;const city=a.city||a.town||a.village||a.municipality;const state=a.state;const parts=[];if(street)parts.push(`${street}${number?' '+number:''}`);if(area&&area!==street)parts.push(area);if(city&&city!==area)parts.push(city);if(state)parts.push(state);return parts.join(', ')||data?.display_name||'';}
function geoCacheKey(lat,lon){return `${lat.toFixed(3)},${lon.toFixed(3)}`;}
function requestAddress(){
  if(S.dist===null||S.dist<=OUTSIDE_LIMIT_M||S.acc===null)return;
  const key=geoCacheKey(S.lat,S.lon),cached=S.geoCache.get(key);
  if(cached){S.address=cached;updateLocationUI();return;}
  if(S.lastGeoPoint&&Math.hypot(S.lat-S.lastGeoPoint.lat,S.lon-S.lastGeoPoint.lon)<.001)return;
  clearTimeout(S.geoTimer);
  S.geoTimer=setTimeout(async()=>{
    if(S.dist===null||S.dist<=OUTSIDE_LIMIT_M)return;
    const lat=S.lat,lon=S.lon,requestKey=geoCacheKey(lat,lon),seq=++S.geoSeq;
    S.lastGeoRequest=Date.now();S.lastGeoPoint={lat,lon};
    try{
      const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1&accept-language=pt-BR`;
      const res=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json(),address=addressFromResult(data)| me ||'Endereço N/A';
      S.geoCache.set(requestKey,address);if(S.geoCache.size>100)S.geoCache.delete(S.geoCache.keys().next().value);
      if(seq===S.geoSeq&&S.dist>OUTSIDE_LIMIT_M){S.address=address;updateLocationUI();}
    }catch(err){if(seq===S.geoSeq&&S.dist>OUTSIDE_LIMIT_M){S.address='Endereço N/A';updateLocationUI();}}
  },1100);
}

function refreshNearest(){
  const n=S.db.length&&S.acc!==null?nearest(S.lat,S.lon):null;
  S.dist=n?n.dist:null;
  if(n)S.km=(Math.round(n.km*100)/100).toFixed(2).replace('.',',');
  if(S.dist!==null&&S.dist<=OUTSIDE_LIMIT_M){clearTimeout(S.geoTimer);S.address='';S.geoSeq++;}
  updateLocationUI();
  if(S.dist!==null&&S.dist>OUTSIDE_LIMIT_M)requestAddress();
}

function updateLocationUI(){
  const outside=S.dist!==null&&S.dist>OUTSIDE_LIMIT_M,showFarKm=$('showKmFar').checked;
  const kmIsShown=!outside||showFarKm;
  $('hud').classList.toggle('outside',outside&&!showFarKm);
  $('km').textContent=outside&&!showFarKm?'Off-road':(S.km==='---'?'KM ---':`KM ${S.km}`);
  $('gps').textContent = S.acc===null?'GPS…':`±${Math.round(S.acc)}m`;
  $('address').hidden=!(outside&&S.address);
  if(outside&&S.address)$('address').innerHTML=`${escapeHtml(S.address)}`;
  return{outside,kmIsShown};
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

loadCsvData();
if('geolocation'in navigator)navigator.geolocation.watchPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;S.acc=p.coords.accuracy;refreshNearest();},()=>{$('gps').textContent='N/A';},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});

if(!('showDirectoryPicker'in window))$('pick').hidden=true;
$('pick').onclick=async()=>{if(!('showDirectoryPicker'in window))return;try{const d=await showDirectoryPicker({mode:'readwrite'});if(await d.requestPermission({mode:'readwrite'})!=='granted')throw new Error();S.dir=d;$('dDir').className='dot ok';$('tDir').textContent=d.name;}catch(e){}};
async function save(blob,name){name=safe(name);if(S.dir){try{const w=await(await S.dir.getFileHandle(name,{create:true})).createWritable();await w.write(blob);await w.close();toast('✓');return true;}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('✓');return true;}

async function openCam(id){S.stream?.getTracks().forEach(t=>t.stop());const constraints=id?{deviceId:{exact:id}}:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}};S.stream=await navigator.mediaDevices.getUserMedia({video:constraints,audio:false});$('v').srcObject=S.stream;const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cur=S.stream.getVideoTracks()[0]?.getSettings()?.deviceId;$('camSel').innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>Cam ${i+1}</option>`).join('');if(!devs.length)$('camSel').innerHTML='<option value="">Cam</option>';}
$('camSel').onchange=e=>openCam(e.target.value);
$('go').onclick=async()=>{try{await openCam();$('lbl').value=$('label').value;$('start').classList.remove('on');$('cam').classList.add('on');document.documentElement.requestFullscreen?.().catch(()=>{});pinchZoom();}catch(e){toast('Err',1);}};
function pinchZoom(){const v=$('v');let d0=0,z0=1;v.ontouchstart=e=>{if(e.touches.length===2){d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const t=S.stream?.getVideoTracks?.()[0];z0=t?.getSettings?.().zoom||1;}};v.ontouchmove=e=>{const t=S.stream?.getVideoTracks?.()[0],c=t?.getCapabilities?.()||{};if(e.touches.length===2&&d0&&c.zoom){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);t.applyConstraints({advanced:[{zoom:Math.min(c.zoom.max,Math.max(c.zoom.min,z0*d/d0))}]}).catch(()=>{});}};}
$('gear').onclick=()=>$('set').classList.add('on');$('closeSet').onclick=()=>$('set').classList.remove('on');
$('back').onclick=()=>{if(S.cap||S.rec||S.busy||S.queue.length)return;S.stream?.getTracks().forEach(t=>t.stop());$('cam').classList.remove('on');$('start').classList.add('on');document.fullscreenElement&&document.exitFullscreen();};
function updateModeUI(){document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===S.mode)));}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{if(S.cap||S.rec)return;S.mode=b.dataset.m;updateModeUI();});

function frame(){
  const v=$('v');if(!v||!v.videoWidth)return null;const w=cv.width=v.videoWidth,h=cv.height=v.videoHeight;cx.drawImage(v,0,0,w,h);
  const {outside,kmIsShown}=updateLocationUI(),lines=[];
  
  if($('showKm').checked&&kmIsShown&&S.km!=='---'&&(!outside||$('showKmFar').checked)){
    lines.push({text:`KM ${S.km}`,large:true});
  }
  
  if(outside&&$('showGps').checked&&S.address) lines.push({text:S.address});
  else if($('showDate').checked) lines.push({text:new Date().toLocaleString('pt-BR')});
  
  if($('showGps').checked){
    const accTxt = S.acc !== null ? `±${Math.round(S.acc)}m` : 'GPS…';
    lines.push({text: `${accTxt} · ${S.lat.toFixed(6)}, ${S.lon.toFixed(6)}`, small: true});
  }

  if(lines.length){
    const bh=h*.20,g=cx.createLinearGradient(0,h-bh,0,h);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(.25,'rgba(0,0,0,.55)');
    g.addColorStop(1,'rgba(0,0,0,.9)');
    cx.fillStyle=g;cx.fillRect(0,h-bh,w,bh);cx.textAlign='left';cx.textBaseline='alphabetic';
    
    let y=h-20;
    const fontLarge = `bold ${Math.round(bh*.24)}px Arial,sans-serif`;
    const fontNormal = `${Math.round(bh*.15)}px Arial,sans-serif`;
    const fontSmall = `${Math.round(bh*.12)}px Arial,sans-serif`;
    
    for(let i=lines.length-1;i>=0;i--){
      const line=lines[i];
      cx.fillStyle=line.large?'#fff':(line.small?'rgba(255,255,255,.7)':'rgba(255,255,255,.88)');
      cx.font=line.large?fontLarge:(line.small?fontSmall:fontNormal);
      cx.fillText(line.text,20,y,w-40);
      y -= line.large ? Math.round(bh*.30) : (line.small ? Math.round(bh*.15) : Math.round(bh*.20));
    }
  }

  const lb=$('label').value.trim();
  if(lb&&$('showLabel').checked){
    const fs=Math.round(h*.035);
    cx.font=`bold ${fs}px Arial,sans-serif`;
    const px=fs*.8,py=fs*.5,bw=cx.measureText(lb).width+px*2,bh2=fs+py*2,x=w-bw-30,y=30;
    cx.save();cx.globalAlpha=.85;cx.fillStyle='#fbbf24';cx.beginPath();
    cx.roundRect(x,y,bw,bh2,8);cx.fill();cx.globalAlpha=1;
    cx.fillStyle='#0b1320';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(lb,x+bw/2,y+bh2/2+1);cx.restore();
  }
  return cv;
}

const toBlob=q=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));
$('shut').onclick=()=>{navigator.vibrate?.(20);({foto:photo,video:toggleVideo,pdf:togglePdf})[S.mode]?.();};
async function photo(){if(!frame())return;const b=await toBlob(.9);if(b)save(b,`KM_${S.km}_${stamp()}.jpg`);}
$('snap').onclick=e=>{e.stopPropagation();if(!frame())return;toBlob(.9).then(b=>b&&save(b,`SNAP_KM_${S.km}_${stamp()}.jpg`));};

let vidLoop=0;
function toggleVideo(){if(S.rec){S.rec.stop();return;}if(!frame())return;const cs=cv.captureStream?cv.captureStream(30):null;if(!cs)return;const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';let r;try{r=new MediaRecorder(cs,{mimeType:mt||undefined,videoBitsPerSecond:8e6});}catch(e){return;}const ini=stamp(),km0=S.km,ch=[];r.ondataavailable=e=>e.data.size&&ch.push(e.data);r.onstop=async()=>{cancelAnimationFrame(vidLoop);S.rec=null;setRec(false);await save(new Blob(ch,{type:r.mimeType||'video/webm'}),`VIDEO_KM_${km0}_${ini}.webm`);};r.start(1000);S.rec=r;setRec(true,'REC');(function d(){frame();vidLoop=requestAnimationFrame(d);})();}
function setRec(on,t){$('rec').classList.toggle('on',on);if(t)$('rec').textContent=t;$('shut').classList.toggle('rec',on);$('snap').classList.toggle('on',on&&S.mode==='pdf');document.body.classList.toggle('clean',!!(on&&S.mode==='pdf'));if(on)navigator.wakeLock?.request('screen').then(l=>S.lock=l).catch(()=>{});else{S.lock?.release?.();S.lock=null;}}

const lim=()=>Math.max(parseInt($('lote').value)||150,1),upd=()=>{if(S.cap)$('rec').textContent=`${S.buf.length}/${lim()}`;};
function togglePdf(){S.cap?stopPdf():startPdf();}
function startPdf(){if(!window.jspdf)return;S.cap=true;S.buf=[];S.queue=[];S.batch=1;S.saved=0;setRec(true);upd();loop();}
function loop(){if(!S.cap)return;const start=performance.now();if(frame())toBlob(.82).then(async b=>{if(!S.cap||!b)return;S.buf.push({u8:new Uint8Array(await b.arrayBuffer()),km:S.km});if(S.buf.length>=lim())rotate(false);upd();}).catch(()=>{});clearTimeout(S.timer);S.timer=setTimeout(loop,Math.max(0,Math.max(parseInt($('int').value)||200,100)-(performance.now()-start)));}
function rotate(final){if(!S.buf.length)return;S.queue.push({p:S.buf,n:S.batch});S.buf=[];S.batch++;runQueue();if(final&&!S.queue.length)return;}
async function stopPdf(){if(!S.cap)return;S.cap=false;clearTimeout(S.timer);$('shut').disabled=true;rotate(true);await runQueue();while(S.busy||S.queue.length)await new Promise(r=>setTimeout(r,100));setRec(false);$('shut').disabled=false;}
async function runQueue(){if(S.busy)return;S.busy=true;try{while(S.queue.length){await makePdf(S.queue.shift());S.saved++;await new Promise(r=>setTimeout(r,0));}}catch(e){}finally{S.busy=false;}}
async function makePdf({p,n}){const {jsPDF}=window.jspdf,sz=u=>{const i=new jsPDF().getImageProperties(u);return[i.width,i.height];};const [w,h]=sz(p[0].u8),d=new jsPDF({orientation:w>=h?'landscape':'portrait',unit:'px',format:[w,h],compress:true,hotfixes:['px_scaling']});p.forEach((it,i)=>{if(i)d.addPage([w,h],w>=h?'landscape':'portrait');d.addImage(it.u8,'JPEG',0,0,w,h,undefined,'FAST');it.u8=null;});await save(d.output('blob'),`Lote_${n}_KM_${p[0].km}_a_${p[p.length-1].km}.pdf`);}
$('cam').addEventListener('click',e=>{if(S.cap&&!e.target.closest('button,input,select'))document.body.classList.toggle('clean');});
window.addEventListener('beforeunload',e=>{if(S.cap||S.rec||S.busy||S.queue.length){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(S.cap||S.rec))navigator.wakeLock?.request('screen').then(l=>S.lock=l).catch(()=>{});});
updateModeUI();updateLocationUI();
</script>
