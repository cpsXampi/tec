<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>INDEX - Monitor de Campo & Backbone</title>
<style>
:root {
  --bg: #0a0e14;
  --card: #141a24;
  --card-active: #1e2636;
  --accent: #ffd600;
  --green: #10b981;
  --red: #ef4444;
  --text: #ffffff;
  --sub: #94a3b8;
  --line: rgba(255, 255, 255, 0.15);
  --sb: max(env(safe-area-inset-bottom), 16px);
  --st: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: calc(10px + var(--st)) 12px var(--sb);
  gap: 8px;
}

/* HUD PRINCIPAL - VERDE */
.hud-card {
  background: linear-gradient(135deg, #064e3b, #022c22);
  border: 2px solid #059669;
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  flex: none;
}
.hud-top { font-size: 10px; color: #a7f3d0; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }
.hud-km { font-size: 32px; font-weight: 900; color: #ffffff; line-height: 1.1; margin: 2px 0; }
.hud-meta { display: flex; justify-content: space-between; font-size: 10px; color: #a7f3d0; font-weight: 600; }

/* JANELINHA DO ATIVO EM QUE VOCÊ PROVAVELMENTE ESTÁ (BASE) */
.current-asset-box {
  background: linear-gradient(135deg, rgba(255, 214, 0, 0.2), rgba(255, 214, 0, 0.05));
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 10px 14px;
  flex: none;
  box-shadow: 0 0 14px rgba(255, 214, 0, 0.25);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.current-asset-title {
  font-size: 10px;
  color: var(--accent);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  display: flex;
  justify-content: space-between;
}

.current-asset-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.current-asset-tag { font-size: 17px; font-weight: 900; color: #fff; }
.current-asset-km { background: rgba(255, 214, 0, 0.2); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-weight: 900; font-size: 12px; }

.current-asset-ip {
  font-family: monospace;
  font-size: 14px;
  color: #10b981;
  font-weight: 800;
  background: rgba(0,0,0,0.4);
  padding: 4px 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* BARRA DE PESQUISA RÁPIDA */
.search-box {
  flex: none;
  display: flex;
  gap: 8px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 6px 12px;
  align-items: center;
}
.search-box input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.search-box input::placeholder { color: var(--sub); font-weight: 500; }

/* SEÇÃO DE BOTÕES */
.big-buttons-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: none;
}

.button-group-label {
  font-size: 9px;
  color: var(--sub);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.grid-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.btn-big {
  background: var(--card);
  border: 2px solid var(--line);
  color: #fff;
  border-radius: 10px;
  padding: 8px 4px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease-in-out;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.btn-big:active { transform: scale(0.96); }
.btn-big.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(255, 214, 0, 0.4);
}
.btn-big small { font-size: 9px; opacity: 0.85; font-weight: 700; }

/* CONTAINER DO BACKBONE E VAGÕES */
.assets-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 4px 0 10px 0;
}

.backbone-line {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0px;
}

.vagon-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.fiber-link {
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin: -2px 0;
  z-index: 1;
}

.fiber-cable {
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, #10b981, #059669);
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
}

.fiber-label {
  position: absolute;
  background: #064e3b;
  border: 1px solid #10b981;
  color: #a7f3d0;
  font-size: 9px;
  font-weight: 900;
  padding: 1px 8px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}

.asset-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  z-index: 2;
}

.asset-card.nearest {
  border: 2px solid var(--accent);
}

.asset-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.asset-tag { font-size: 14px; font-weight: 900; color: #fff; }
.asset-km-badge {
  background: rgba(255, 214, 0, 0.18);
  color: var(--accent);
  font-size: 12px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 6px;
}

.asset-ip-box {
  background: rgba(0, 0, 0, 0.4);
  border: 1px dashed #10b981;
  border-radius: 8px;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.asset-ip-box span { font-size: 10px; color: var(--sub); font-weight: 700; }
.asset-ip-box b { font-size: 15px; font-family: monospace; color: #10b981; font-weight: 900; }

.asset-info {
  font-size: 10px;
  color: #cbd5e1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
}

.asset-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 4px;
  border-top: 1px solid var(--line);
  font-size: 10px;
}

.badge-status {
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
}
.badge-status.online { background: rgba(16, 185, 129, 0.25); color: #10b981; border: 1px solid #10b981; }
.badge-status.offline { background: rgba(239, 68, 68, 0.3); color: #ef4444; border: 1px solid #ef4444; }
.badge-status.checking { background: rgba(255, 214, 0, 0.25); color: var(--accent); border: 1px solid var(--accent); }

.empty-msg { text-align: center; color: var(--sub); margin: auto; font-size: 13px; padding: 20px; font-weight: 600; }
</style>
</head>
<body>

<div class="app-container">

  <!-- HUD DE KM E GPS (VERDE) -->
  <div class="hud-card">
    <div class="hud-top" id="gpsStatusTitle">Localizando GPS em Tempo Real...</div>
    <div class="hud-km" id="kmDisplay">KM ---</div>
    <div class="hud-meta">
      <span id="gpsPrecision">Precisão: ...</span>
      <span id="gpsCoords">0.0000, 0.0000</span>
    </div>
  </div>

  <!-- JANELINHA DO ATIVO EM QUE VOCÊ PROVAVELMENTE ESTÁ (PONTO DE BASE) -->
  <div class="current-asset-box" id="baseAssetBox">
    <div class="current-asset-title">
      <span>📍 Ativo Mais Próximo da Posição (Base)</span>
      <span id="baseDist">0m de você</span>
    </div>
    <div class="current-asset-body">
      <span class="current-asset-tag" id="baseTag">Buscando...</span>
      <span class="current-asset-km" id="baseKm">KM ---</span>
    </div>
    <div class="current-asset-ip">
      <span style="font-size:10px; color:var(--sub);">IP:</span>
      <b id="baseIp">0.0.0.0</b>
      <span id="baseStatus" class="badge-status checking">CHECANDO</span>
    </div>
  </div>

  <!-- CAMPO DE BUSCA RÁPIDA -->
  <div class="search-box">
    <span style="font-size:16px;">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por Tag, IP ou KM..." oninput="onSearchChange()">
  </div>

  <!-- SEÇÃO DE BOTÕES -->
  <div class="big-buttons-section">
    <div class="button-group-label">1. Sentido de Leitura da Via:</div>
    <div class="grid-buttons" id="dirButtons">
      <button class="btn-big active" onclick="selectDir('all', this)">
        <span>↕️ TODOS</span>
        <small>Sequência Geral</small>
      </button>
      <button class="btn-big" onclick="selectDir('crescente', this)">
        <span>⬆️ KM MAIOR</span>
        <small>Crescente</small>
      </button>
      <button class="btn-big" onclick="selectDir('decrescente', this)">
        <span>⬇️ KM MENOR</span>
        <small>Decrescente</small>
      </button>
    </div>

    <div class="button-group-label" style="margin-top:2px;">2. Filtrar Circuito de Fibra:</div>
    <div class="grid-buttons" id="fiberButtons">
      <button class="btn-big active" onclick="selectFiber('all', this)">
        <span>⚡ TODAS</span>
      </button>
      <button class="btn-big" onclick="selectFiber('11, 12', this)">
        <span>🧵 11, 12</span>
      </button>
      <button class="btn-big" onclick="selectFiber('21, 22', this)">
        <span>🧵 21, 22</span>
      </button>
    </div>
  </div>

  <!-- LISTA DE ATIVOS RESTANTES (BACKBONE / VAGÕES) -->
  <div class="assets-container" id="assetsContainer">
    <div class="empty-msg">Iniciando leitor de GPS e alinhando rede de fibras...</div>
  </div>

</div>

<script>
const STATE = {
  snv: [],
  assets: [],
  pingCache: {},
  currentKm: null,
  lat: 0,
  lon: 0,
  acc: null,
  dirFilter: 'all',
  fiberFilter: 'all',
  searchQuery: ''
};

const $ = id => document.getElementById(id);

function parseKm(val) {
  if (val === null || val === undefined) return NaN;
  let s = String(val).trim().replace(/^\uFEFF/, '').replace(/^"/, '').replace(/"$/, '');
  if (!s) return NaN;

  const m = s.match(/^(\d{1,3})\s*\+\s*(\d{1,3})(?:[,.](\d+))?$/);
  if (m) {
    const km = Number(m[1]);
    const mt = (m[2] + (m[3] || '')).padEnd(3, '0').slice(0, 3);
    return km + (Number(mt) / 1000);
  }

  s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

const escapeH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function parseSnvCsv(txt) {
  if (!txt) return [];
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const sep = lines[0].includes(';') ? ';' : ',';
  const h = lines[0].split(sep).map(x => x.trim().toLowerCase().replace(/[^a-z]/g, ''));
  const iKm = h.findIndex(x => x.includes('km'));
  const iLat = h.findIndex(x => x.includes('lat'));
  const iLon = h.findIndex(x => x.includes('lon') || x.includes('long'));

  if (iKm < 0 || iLat < 0 || iLon < 0) return [];

  const list = [];
  for (let i = 1; i < lines.length; i++) {
    const r = lines[i].split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    if (r.length <= Math.max(iKm, iLat, iLon)) continue;
    const k = parseKm(r[iKm]);
    const la = Number(r[iLat].replace(',', '.'));
    const lo = Number(r[iLon].replace(',', '.'));
    if (Number.isFinite(k) && Number.isFinite(la) && Number.isFinite(lo)) {
      list.push({ km: k, lat: la, lon: lo });
    }
  }
  return list;
}

function parseAssetsCsv(txt) {
  if (!txt) return [];
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 3) return [];

  const list = [];
  for (let i = 2; i < lines.length; i++) {
    const r = lines[i].split(';').map(x => x.trim().replace(/^"|"$/g, ''));
    if (r.length < 9) continue;

    const tag = r[0] || 'Ativo';
    const equip = r[1] || 'Equipamento';
    const rawKm = r[3] || '';
    const km = parseKm(rawKm);
    const sentido = r[4] || '';
    const fibra = r[5] || '11, 12';
    const ip = r[8] || '';

    if (Number.isFinite(km)) {
      list.push({
        tag: tag,
        equip: equip,
        km: km,
        rawKm: rawKm || km.toFixed(3),
        sentido: sentido,
        fibra: fibra.trim(),
        ip: ip
      });
    }
  }
  return list.sort((a, b) => a.km - b.km);
}

function calcNearestKm(la, lo) {
  if (!STATE.snv.length) return null;
  let best = STATE.snv[0], minD = Infinity;
  const rad = Math.PI / 180, R = 6371000;

  for (let i = 0; i < STATE.snv.length; i++) {
    const p = STATE.snv[i];
    const dLat = (p.lat - la) * rad;
    const dLon = (p.lon - lo) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(la * rad) * Math.cos(p.lat * rad) * Math.sin(dLon / 2) ** 2;
    const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
