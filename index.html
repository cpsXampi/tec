<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Localizador de Ativos & Fibra</title>
<style>
:root {
  --bg: #07090c;
  --s1: #10141a;
  --s2: #171c24;
  --line: rgba(255, 255, 255, 0.12);
  --acc: #ffd600;
  --ok: #34d399;
  --bad: #ef4444;
  --tx: #f2f2f4;
  --mu: #8b8f98;
  --sb: max(env(safe-area-inset-bottom), 16px);
  --st: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

/* Layout Principal */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: calc(12px + var(--st)) 14px var(--sb);
  gap: 12px;
}

/* Header de Localização / KM HUD */
.hud-card {
  background: rgba(4, 90, 64, 0.92);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px;
  padding: 14px 18px;
  flex: none;
}
.hud-card small { display: block; font-size: 11px; color: #bbf7d0; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.hud-card b { display: block; font-size: 28px; line-height: 1.1; color: #fff; margin-top: 2px; }
.hud-card .meta { font-size: 12px; color: #bbf7d0; margin-top: 4px; display: flex; justify-content: space-between; }

/* Cabeçalho da Topologia */
.fiber-header {
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex: none;
}
.fiber-header .title { font-size: 13px; font-weight: 800; color: var(--acc); }
.fiber-header .fiber-tag { font-size: 11px; background: rgba(255,214,0,0.15); color: var(--acc); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(255,214,0,0.3); font-weight: 700; }

/* Lista de Ativos (3 Antes e 3 Depois) */
.assets-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 2px;
}
.asset-card {
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform 0.1s ease;
}
.asset-card.nearest {
  background: rgba(255, 214, 0, 0.12);
  border-color: rgba(255, 214, 0, 0.5);
  box-shadow: 0 0 15px rgba(255, 214, 0, 0.08);
}
.asset-head { display: flex; justify-content: space-between; align-items: flex-start; }
.asset-title { font-size: 14px; font-weight: 800; color: #fff; }
.asset-card.nearest .asset-title { color: var(--acc); }
.asset-km { font-size: 12px; font-weight: 700; color: var(--mu); }

.asset-details { font-size: 12px; color: #c3c6ce; display: flex; gap: 12px; }
.asset-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; font-size: 11px; }

/* Badges de Status de Ping */
.badge-ping {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}
.badge-ping.online { background: rgba(52, 211, 153, 0.2); color: var(--ok); border: 1px solid rgba(52, 211, 153, 0.4); }
.badge-ping.offline { background: rgba(239, 68, 68, 0.2); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.4); }
.badge-ping.checking { background: rgba(255, 214, 0, 0.2); color: var(--acc); border: 1px solid rgba(255, 214, 0, 0.4); }
.badge-ping::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.empty-state { text-align: center; color: var(--mu); margin: auto; font-size: 14px; padding: 20px; }
</style>
</head>
<body>

<div class="app-container">
  <!-- HUD Localizador de KM -->
  <div class="hud-card">
    <small id="locTitle">Localizando Via GPS…</small>
    <b id="kmLabel">KM ---</b>
    <div class="meta">
      <span id="gpsAcc">Precisão GPS: --</span>
      <span id="coords">--</span>
    </div>
  </div>

  <!-- Identificador da Fibra -->
  <div class="fiber-header">
    <span class="title">Ativos na Fibra Local</span>
    <span class="fiber-tag" id="fiberTag">Buscando Fibra...</span>
  </div>

  <!-- Lista dos 3 antes e 3 depois -->
  <div class="assets-container" id="assetsList">
    <div class="empty-state">Aguardando coordenadas GPS do veículo…</div>
  </div>
</div>

<script>
const S = {
  db: [],
  assets: [],
  pingStatus: {},
  kmValue: null,
  kmText: '---',
  lat: 0,
  lon: 0,
  acc: null
};

const $ = id => document.getElementById(id);
const num = v => { const s = String(v ?? '').trim(); if (!s) return NaN; return /,\d+$/.test(s) ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s); };
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 1. Cálculo geográfico de marcos de KM */
function parseKmCsv(t) {
  if (!t) return [];
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const L = t.split(/\r?\n/).filter(l => l.trim());
  if (!L.length) return [];
  const sep = L[0].includes(';') ? ';' : ',';
  const h = L.shift().split(sep).map(x => x.trim().toLowerCase());
  const a = h.findIndex(x => ['km'].includes(x));
  const b = h.findIndex(x => ['lat', 'latitude'].includes(x));
  const c = h.findIndex(x => ['lon', 'long', 'longitude'].includes(x));
  if (a < 0 || b < 0 || c < 0) return [];
  return L.map(l => {
    const r = l.split(sep);
    return { km: num(r[a]), lat: num(r[b]), lon: num(r[c]) };
  }).filter(p => [p.km, p.lat, p.lon].every(Number.isFinite));
}

function nearestKm(la, lo) {
  const rad = Math.PI / 180, R = 6371000;
  let best = null, min = Infinity;
  for (const p of S.db) {
    const dLat = (p.lat - la) * rad, dLon = (p.lon - lo) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(la * rad) * Math.cos(p.lat * rad) * Math.sin(dLon / 2) ** 2;
    const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    if (dist < min) { min = dist; best = p; }
  }
  return best ? { km: best.km, dist: min } : null;
}

/* 2. Parsing do ativos 116.csv (KM, IP, Fibra) */
function parseAssetKm(v) {
  const s = String(v ?? '').trim().replace(/^\uFEFF/, '');
  const m = s.match(/^(\d{1,3})\s*\+\s*(\d{1,3})(?:[,.](\d+))?$/);
  if (m) return Number(m[1]) + Number(`${m[2]}${m[3] || ''}`) / Math.pow(10, (m[3] || '').length + 3);
  return num(s);
}

function parseAssetsCsv(t) {
  if (!t) return [];
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const lines = t.split(/\r?\n/).filter(x => x.trim());
  if (lines.length < 2) return [];
  const h = lines[0].split(';').map(x => x.replace(/^\s*\uFEFF/, '').replace(/"/g, '').trim().toLowerCase());
  const find = names => h.findIndex(x => names.includes(x));
  const tag = find(['tag', 'ativo', 'equipamento']), equip = find(['equipamento', 'tipo']), km = find(['km']), ip = find(['ip', 'endereço ip', 'endereco ip']), fibra = find(['fibra', 'anel', 'tubo', 'circuito']);
  if (km < 0) return [];
  return lines.slice(1).map(line => {
    const r = line.split(';').map(x => x.trim().replace(/^"|"$/g, ''));
    return {
      tag: tag >= 0 ? r[tag] : '',
      equip: equip >= 0 ? r[equip] : '',
      km: parseAssetKm(r[km]),
      kmLabel: r[km] || '',
      ip: ip >= 0 ? r[ip] : '',
      fibra: fibra >= 0 ? r[fibra] : 'FIBRA-PRINCIPAL'
    };
  }).filter(a => Number.isFinite(a.km));
}

/* 3. Teste de Conectividade do IP */
async function pingIp(ip) {
  if (!ip) return 'no-ip';
  try {
    const apiRes = await fetch(`http://localhost:8080/ping?ip=${ip}`, { cache: 'no-store' });
    if (apiRes.ok) {
      const data = await apiRes.json();
      return data.online ? 'online' : 'offline';
    }
  } catch (e) {}

  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), 1200);
  try {
    await fetch(ip.startsWith('http') ? ip : `http://${ip}`, { mode: 'no-cors', signal: controller.signal, cache: 'no-store' });
    clearTimeout(id);
    return 'online';
  } catch (e) {
    clearTimeout(id);
    return (e.name === 'AbortError') ? 'offline' : 'online';
  }
}

async function checkAssetPings(displayAssets) {
  for (const asset of displayAssets) {
    if (!asset.ip) continue;
    const res = await pingIp(asset.ip);
    S.pingStatus[asset.ip] = res;
  }
  renderAssetsUIOnly();
}

/* 4. Filtragem por Fibra e Seleção (3 Antes / 3 Depois) */
function getSurroundingAssetsByFiber(currentKm) {
  if (!S.assets.length) return { finalGroup: [], nearestAsset: null, currentFiber: 'SEM DADOS' };

  let nearestAsset = S.assets[0];
  let minDiff = Math.abs(S.assets[0].km - currentKm);

  for (let i = 1; i < S.assets.length; i++) {
    const diff = Math.abs(S.assets[i].km - currentKm);
    if (diff < minDiff) {
      minDiff = diff;
      nearestAsset = S.assets[i];
    }
  }

  const currentFiber = nearestAsset.fibra || 'FIBRA-PRINCIPAL';
  const fiberAssets = S.assets.filter(a => (a.fibra || 'FIBRA-PRINCIPAL') === currentFiber).sort((a, b) => a.km - b.km);

  const before = fiberAssets.filter(a => a.km <= currentKm).sort((a, b) => b.km - a.km).slice(0, 3).reverse();
  const after = fiberAssets.filter(a => a.km > currentKm).sort((a, b) => a.km - b.km).slice(0, 3);

  const map = new Map();
  [...before, nearestAsset, ...after].forEach(a => map.set(`${a.tag}_${a.km}_${a.ip}`, a));
  const finalGroup = Array.from(map.values()).sort((a, b) => a.km - b.km);

  return { finalGroup, nearestAsset, currentFiber };
}

function renderAssetsUIOnly() {
  const current = S.kmValue;
  if (!Number.isFinite(current)) return;

  const { finalGroup, nearestAsset, currentFiber } = getSurroundingAssetsByFiber(current);
  $('fiberTag').textContent = currentFiber;

  $('assetsList').innerHTML = finalGroup.map(a => {
    const isNearest = a === nearestAsset;
    const delta = a.km - current;
    const dir = delta < 0 ? 'atrás' : delta > 0 ? 'à frente' : 'no ponto';
    const st = S.pingStatus[a.ip] || 'checking';

    let badgeClass = 'checking', badgeText = 'CHECANDO';
    if (st === 'online') { badgeClass = 'online'; badgeText = 'ONLINE'; }
    else if (st === 'offline') { badgeClass = 'offline'; badgeText = 'OFFLINE'; }
    if (!a.ip) { badgeClass = 'checking'; badgeText = 'SEM IP'; }

    return `<div class="asset-card${isNearest ? ' nearest' : ''}">
      <div class="asset-head">
        <span class="asset-title">${isNearest ? '★ ' : ''}${escapeHtml(a.tag || a.equip || 'Ativo')}</span>
        <span class="asset-km">KM ${escapeHtml(a.kmLabel)}</span>
      </div>
      <div class="asset-details">
        <span><b>Tipo:</b> ${escapeHtml(a.equip)}</span>
        <span><b>IP:</b> ${a.ip ? escapeHtml(a.ip) : 'Não informado'}</span>
      </div>
      <div class="asset-foot">
        <span>${Math.abs(delta).toFixed(3)} km (${dir})</span>
        <span class="badge-ping ${badgeClass}">${badgeText}</span>
      </div>
    </div>`;
  }).join('');
}

function renderAssets() {
  const current = S.kmValue;
  if (!S.assets.length) {
    $('assetsList').innerHTML = '<div class="empty-state">Carregando lista de ativos e fibras…</div>';
    return;
  }
  if (!Number.isFinite(current)) {
    $('assetsList').innerHTML = '<div class="empty-state">Aguardando sinal GPS para identificar o KM atual…</div>';
    return;
  }

  const { finalGroup } = getSurroundingAssetsByFiber(current);
  renderAssetsUIOnly();
  checkAssetPings(finalGroup);
}

function updateLocationUI() {
  $('kmLabel').textContent = S.kmText === '---' ? 'KM ---' : `KM ${S.kmText}`;
  $('locTitle').textContent = S.acc !== null ? 'KM Atual Na Rodovia' : 'Buscando sinal GPS…';
  $('gpsAcc').textContent = S.acc !== null ? `GPS ±${Math.round(S.acc)} m` : 'GPS: Aguardando';
  $('coords').textContent = S.acc !== null ? `${S.lat.toFixed(5)}, ${S.lon.toFixed(5)}` : '--';
}

function refreshNearest() {
  const n = S.db.length && S.acc !== null ? nearestKm(S.lat, S.lon) : null;
  if (n) {
    S.kmValue = n.km;
    S.kmText = (Math.round(n.km * 100) / 100).toFixed(2).replace('.', ',');
  } else {
    S.kmValue = null;
    S.kmText = '---';
  }
  updateLocationUI();
  renderAssets();
}

/* Inicialização e Leitura */
fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { S.db = parseKmCsv(t); refreshNearest(); });

fetch(encodeURI('ativos 116.csv?v=' + Date.now()), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { S.assets = parseAssetsCsv(t); renderAssets(); });

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    S.lat = p.coords.latitude;
    S.lon = p.coords.longitude;
    S.acc = p.coords.accuracy;
    refreshNearest();
  }, () => {
    $('locTitle').textContent = 'Sinal GPS Indisponível';
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
</script>
</body>
</html>
