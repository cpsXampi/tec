<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MONITOR DE CAMPO - BACKBONE BR-116</title>
<style>
:root {
  --bg: #000000;
  --card: #0d1117;
  --accent: #ffd600;
  --green: #10b981;
  --red: #ef4444;
  --text: #ffffff;
  --sub: #8b949e;
  --line: #30363d;
  --sb: max(env(safe-area-inset-bottom), 12px);
  --st: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, sans-serif; overflow: hidden; }

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: calc(6px + var(--st)) 8px var(--sb);
  gap: 6px;
}

/* TOP HUD */
.hud-card {
  background: #04271d;
  border: 1px solid #059669;
  border-radius: 8px;
  padding: 6px 10px;
  flex: none;
}
.hud-top { font-size: 9px; color: #6ee7b7; font-weight: 800; text-transform: uppercase; }
.hud-km { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; margin: 2px 0; }
.hud-meta { display: flex; justify-content: space-between; font-size: 9px; color: #a7f3d0; }

/* BASE ASSET BOX */
.base-box {
  background: #161b22;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: 8px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.base-head { display: flex; justify-content: space-between; font-size: 9px; color: var(--accent); font-weight: 800; }
.base-body { display: flex; justify-content: space-between; align-items: center; }
.base-tag { font-size: 15px; font-weight: 900; color: #fff; }
.base-km { background: rgba(255,214,0,0.2); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 11px; }
.base-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-family: monospace; }
.base-ip { color: var(--green); font-weight: 800; cursor: pointer; text-decoration: underline; }

/* PING COMMAND BOX */
.ping-box {
  display: flex;
  gap: 6px;
  flex: none;
}
.ping-box input {
  flex: 1;
  background: #0d1117;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--accent);
  font-family: monospace;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 8px;
  outline: none;
}
.btn-action {
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0 12px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}
.btn-action:active { opacity: 0.7; }

/* SEARCH & FILTERS */
.search-box input {
  width: 100%;
  background: #0d1117;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: #fff;
  font-size: 12px;
  padding: 6px 8px;
  outline: none;
}
.filters-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  flex: none;
}
.btn-filter {
  background: #0d1117;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  padding: 6px 2px;
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
}
.btn-filter.active { background: var(--accent); color: #000; border-color: var(--accent); }

/* LIST */
.list-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 10px;
}
.asset-card {
  background: #0d1117;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.asset-card.nearest { border-color: var(--accent); background: #161b22; }
.card-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
.card-body { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: var(--sub); }
.card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--sub); }

.badge {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 900;
  font-family: monospace;
}
.badge.online { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
.badge.offline { background: rgba(239, 68, 68, 0.25); color: #ef4444; border: 1px solid #ef4444; }
.badge.checking { background: rgba(255, 214, 0, 0.2); color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>

<div class="app-container">
  <!-- HUD GPS -->
  <div class="hud-card">
    <div class="hud-top" id="gpsStatus">Aguardando GPS...</div>
    <div class="hud-km" id="kmDisplay">KM ---</div>
    <div class="hud-meta">
      <span id="gpsAcc">Precisão: --</span>
      <span id="gpsCoords">0.0000, 0.0000</span>
    </div>
  </div>

  <!-- BASE ASSET -->
  <div class="base-box">
    <div class="base-head">
      <span>📍 ATIVO BASE MAIS PRÓXIMO</span>
      <span id="baseDist">--</span>
    </div>
    <div class="base-body">
      <span class="base-tag" id="baseTag">Localizando...</span>
      <span class="base-km" id="baseKm">KM ---</span>
    </div>
    <div class="base-meta">
      <span>FIBRA: <b id="baseFiber" style="color:var(--accent);">--</b></span>
      <span class="base-ip" id="baseIp" onclick="setManualIp(this.innerText)">0.0.0.0</span>
      <span id="baseBadge" class="badge checking">DEC</span>
    </div>
  </div>

  <!-- MANUAL PING ENGINE -->
  <div class="ping-box">
    <input type="text" id="targetIp" placeholder="Endereço IP para teste..." value="">
    <button class="btn-action" onclick="runSinglePing()">TESTAR IP</button>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Filtrar Tag, IP ou KM..." oninput="onSearch()">
  </div>

  <!-- FILTERS -->
  <div class="filters-grid">
    <button class="btn-filter active" id="btnDirAll" onclick="setDir('all')">↕️ TODOS</button>
    <button class="btn-filter" id="btnDirUp" onclick="setDir('up')">⬆️ KM MAIOR</button>
    <button class="btn-filter" id="btnDirDown" onclick="setDir('down')">⬇️ KM MENOR</button>
  </div>

  <!-- ASSET LIST -->
  <div class="list-container" id="listContainer">
    <div style="text-align:center; padding:20px; font-size:12px; color:var(--sub);">Carregando dados SNV e Ativos...</div>
  </div>
</div>

<script>
const STATE = {
  snv: [],
  assets: [],
  pings: {},
  currentKm: null,
  lat: 0,
  lon: 0,
  acc: null,
  dir: 'all',
  search: ''
};

const $ = id => document.getElementById(id);

function setManualIp(ip) {
  if (!ip || ip === '0.0.0.0' || ip === 'SEM IP') return;
  $('targetIp').value = ip.trim();
}

/* FAST ASYNCHRONOUS PING FUNCTION (FETCH ABORT TIMEOUT) */
async function fastPing(ip, timeout = 600) {
  if (!ip || ip === '0.0.0.0') return { status: 'offline', ms: 0 };
  const cleanIp = ip.replace(/^https?:\/\//, '').trim();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  const start = performance.now();

  try {
    await fetch(`http://${cleanIp}`, { mode: 'no-cors', signal: controller.signal, cache: 'no-store' });
    clearTimeout(timer);
    return { status: 'online', ms: Math.round(performance.now() - start) };
  } catch (err) {
    clearTimeout(timer);
    const ms = Math.round(performance.now() - start);
    // Se deu erro de conexão recusada ou CORS em tempo inferior ao timeout, o dispositivo respondeu na rede
    if (err.name !== 'AbortError' && ms < timeout) {
      return { status: 'online', ms: ms };
    }
    return { status: 'offline', ms: 0 };
  }
}

async function runSinglePing() {
  const ip = $('targetIp').value.trim();
  if (!ip) return;
  
  STATE.pings[ip] = { status: 'checking', ms: 0 };
  renderUI();
  
  const res = await fastPing(ip, 800);
  STATE.pings[ip] = res;
  renderUI();
}

function parseKm(val) {
  if (!val) return NaN;
  let s = String(val).trim();
  const m = s.match(/^(\d{1,3})\s*\+\s*(\d{1,3})/);
  if (m) return Number(m[1]) + (Number(m[2]) / 1000);
  s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function parseCsv(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 3) return [];
  const list = [];
  for (let i = 2; i < lines.length; i++) {
    const r = lines[i].split(';').map(x => x.trim().replace(/^"|"$/g, ''));
    if (r.length < 9) continue;
    const km = parseKm(r[3]);
    if (Number.isFinite(km)) {
      list.push({ tag: r[0] || 'Ativo', equip: r[1] || '', km: km, rawKm: r[3], fibra: r[5] || '', ip: r[8] || '' });
    }
  }
  return list.sort((a, b) => a.km - b.km);
}

function parseSnv(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = lines[0].includes(';') ? ';' : ',';
  const list = [];
  for (let i = 1; i < lines.length; i++) {
    const r = lines[i].split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    if (r.length < 3) continue;
    const km = parseKm(r[0]);
    const la = Number(r[1].replace(',', '.'));
    const lo = Number(r[2].replace(',', '.'));
    if (Number.isFinite(km) && Number.isFinite(la) && Number.isFinite(lo)) {
      list.push({ km: km, lat: la, lon: lo });
    }
  }
  return list;
}

function calcKm(la, lo) {
  if (!STATE.snv.length) return null;
  let minD = Infinity, best = STATE.snv[0];
  const rad = Math.PI / 180, R = 6371000;
  for (let i = 0; i < STATE.snv.length; i++) {
    const p = STATE.snv[i];
    const dLat = (p.lat - la) * rad, dLon = (p.lon - lo) * rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(la*rad)*Math.cos(p.lat*rad)*Math.sin(dLon/2)**2;
    const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    if (dist < minD) { minD = dist; best = p; }
  }
  return { km: best.km, dist: minD };
}

function setDir(d) {
  STATE.dir = d;
  ['All', 'Up', 'Down'].forEach(x => $('btnDir' + x).classList.remove('active'));
  $('btnDir' + (d === 'all' ? 'All' : d === 'up' ? 'Up' : 'Down')).classList.add('active');
  renderUI();
}

function onSearch() {
  STATE.search = $('searchInput').value.trim().toLowerCase();
  renderUI();
}

function renderUI() {
  const km = STATE.currentKm;
  if (!STATE.assets.length || !Number.isFinite(km)) return;

  // Find Nearest
  let nearest = STATE.assets[0], minDiff = Math.abs(STATE.assets[0].km - km);
  for (let i = 1; i < STATE.assets.length; i++) {
    const d = Math.abs(STATE.assets[i].km - km);
    if (d < minDiff) { minDiff = d; nearest = STATE.assets[i]; }
  }

  // Update Base Card
  $('baseTag').textContent = nearest.tag;
  $('baseKm').textContent = `KM ${nearest.rawKm}`;
  $('baseIp').textContent = nearest.ip || 'SEM IP';
  $('baseFiber').textContent = nearest.fibra || 'N/A';
  $('baseDist').textContent = `${Math.round(minDiff * 1000)}m de você`;

  const basePing = STATE.pings[nearest.ip] || { status: 'checking', ms: 0 };
  $('baseBadge').className = `badge ${basePing.status}`;
  $('baseBadge').textContent = basePing.status === 'online' ? `${basePing.ms}ms` : basePing.status.toUpperCase();

  // Filter Pool
  let pool = STATE.assets;
  if (STATE.search) {
    pool = pool.filter(a => a.tag.toLowerCase().includes(STATE.search) || a.ip.includes(STATE.search) || a.rawKm.includes(STATE.search));
  }

  let list = [];
  if (STATE.dir === 'up') list = pool.filter(a => a.km >= km).slice(0, 8);
  else if (STATE.dir === 'down') list = pool.filter(a => a.km <= km).sort((a,b) => b.km - a.km).slice(0, 8);
  else list = pool.filter(a => Math.abs(a.km - km) <= 5).slice(0, 8);

  // Render List
  let html = '';
  list.forEach(a => {
    const isBase = a.tag === nearest.tag;
    const distM = Math.round(Math.abs(a.km - km) * 1000);
    const ping = STATE.pings[a.ip] || { status: 'checking', ms: 0 };
    const pCls = ping.status;
    const pTxt = ping.status === 'online' ? `${ping.ms}ms` : ping.status.toUpperCase();

    html += `<div class="asset-card ${isBase ? 'nearest' : ''}">
      <div class="card-head">
        <span>${isBase ? '★ ' : ''}${a.tag}</span>
        <span style="color:var(--accent);">KM ${a.rawKm}</span>
      </div>
      <div class="card-body">
        <span>FIBRA: ${a.fibra}</span>
        <span style="color:var(--green); cursor:pointer;" onclick="setManualIp('${a.ip}')">${a.ip || 'SEM IP'}</span>
      </div>
      <div class="card-foot">
        <span>${a.equip}</span>
        <span><b>${distM}m</b></span>
        <span class="badge ${pCls}">${pTxt}</span>
      </div>
    </div>`;
  });

  $('listContainer').innerHTML = html || '<div style="text-align:center; padding:10px; color:var(--sub);">Nenhum ativo encontrado.</div>';

  // Trigger background ping on top 3 visible
  list.slice(0, 3).forEach(async a => {
    if (a.ip && !STATE.pings[a.ip]) {
      STATE.pings[a.ip] = { status: 'checking', ms: 0 };
      const r = await fastPing(a.ip, 500);
      STATE.pings[a.ip] = r;
      renderUI();
    }
  });
}

// Load Data Files
async function init() {
  try {
    let r = await fetch('SNVBR116SPRJ.csv');
    if (r.ok) STATE.snv = parseSnv(await r.text());

    r = await fetch('ativos_116.csv');
    if (!r.ok) r = await fetch('ativos 116.csv');
    if (r.ok) STATE.assets = parseCsv(await r.text());

    renderUI();
  } catch(e) {}
}

init();

// Watch GPS
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    STATE.lat = p.coords.latitude;
    STATE.lon = p.coords.longitude;
    STATE.acc = p.coords.accuracy;

    const res = calcKm(STATE.lat, STATE.lon);
    if (res) {
      STATE.currentKm = res.km;
      $('kmDisplay').textContent = `KM ${res.km.toFixed(2).replace('.', ',')}`;
      $('gpsStatus').textContent = 'GPS Localizado';
      $('gpsAcc').textContent = `GPS: ±${Math.round(STATE.acc)}m`;
      $('gpsCoords').textContent = `${STATE.lat.toFixed(4)}, ${STATE.lon.toFixed(4)}`;
      renderUI();
    }
  }, () => {
    $('gpsStatus').textContent = 'Sem sinal de GPS';
  }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 });
}
</script>
</body>
</html>
