<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Monitor de Ativos & Fibra</title>
<style>
:root {
  --bg: #07090c;
  --s1: #10141a;
  --s2: #171c24;
  --line: rgba(255, 255, 255, 0.12);
  --acc: #ffd600;
  --ok: #34d399;
  --bad: #ef4444;
  --tx: #f2f2f4;
  --mu: #8b8f98;
  --sb: max(env(safe-area-inset-bottom), 16px);
  --st: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: calc(10px + var(--st)) 12px var(--sb);
  gap: 10px;
}

/* Header de KM / GPS */
.hud-card {
  background: rgba(4, 90, 64, 0.92);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 12px 16px;
  flex: none;
}
.hud-card small { display: block; font-size: 11px; color: #bbf7d0; font-weight: 700; text-transform: uppercase; }
.hud-card b { display: block; font-size: 26px; line-height: 1.1; color: #fff; margin-top: 2px; }
.hud-card .meta { font-size: 11px; color: #bbf7d0; margin-top: 4px; display: flex; justify-content: space-between; }

/* Barra de Topologia de Fibra e Controles */
.control-bar {
  display: flex;
  gap: 8px;
  flex: none;
}
.fiber-badge {
  flex: 1;
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.fiber-badge small { font-size: 10px; color: var(--mu); text-transform: uppercase; }
.fiber-badge b { font-size: 12px; color: var(--acc); }

.btn-bip {
  background: var(--s2);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 12px;
  padding: 0 16px;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-bip.active {
  background: rgba(52, 211, 153, 0.2);
  border-color: var(--ok);
  color: var(--ok);
}

/* Lista dos Ativos */
.assets-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 2px;
}
.asset-card {
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.asset-card.nearest {
  background: rgba(255, 214, 0, 0.12);
  border-color: rgba(255, 214, 0, 0.5);
}
.asset-head { display: flex; justify-content: space-between; align-items: flex-start; }
.asset-title { font-size: 13px; font-weight: 800; color: #fff; }
.asset-card.nearest .asset-title { color: var(--acc); }
.asset-km { font-size: 11px; font-weight: 700; color: var(--mu); }

.asset-details { font-size: 11px; color: #c3c6ce; display: flex; gap: 10px; }
.asset-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; font-size: 11px; }

/* Status Visuais */
.badge-ping {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}
.badge-ping.online { background: rgba(52, 211, 153, 0.2); color: var(--ok); border: 1px solid rgba(52, 211, 153, 0.5); }
.badge-ping.offline { background: rgba(239, 68, 68, 0.25); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.6); }
.badge-ping.checking { background: rgba(255, 214, 0, 0.2); color: var(--acc); border: 1px solid rgba(255, 214, 0, 0.4); }
.badge-ping::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge-ping.online::before { box-shadow: 0 0 6px var(--ok); }
.badge-ping.offline::before { box-shadow: 0 0 6px var(--bad); animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }

.empty-state { text-align: center; color: var(--mu); margin: auto; font-size: 13px; padding: 20px; }
</style>
</head>
<body>

<div class="app-container">
  <!-- HUD de KM Local -->
  <div class="hud-card">
    <small id="locTitle">Obtendo coordenadas…</small>
    <b id="kmLabel">KM ---</b>
    <div class="meta">
      <span id="gpsAcc">GPS: Conectando</span>
      <span id="coords">--</span>
    </div>
  </div>

  <!-- Fibra Ativa e Controle Sonoro -->
  <div class="control-bar">
    <div class="fiber-badge">
      <small>Circuito / Fibra Ativa</small>
      <b id="fiberTag">Aguardando KM...</b>
    </div>
    <button class="btn-bip" id="btnBip" onclick="toggleBipAlert()">
      <span id="bipIcon">🔔</span> <span id="bipText">Alerta Bip: OFF</span>
    </button>
  </div>

  <!-- Lista de Ativos -->
  <div class="assets-container" id="assetsList">
    <div class="empty-state">Carregando tabelas de ativos e SNV…</div>
  </div>
</div>

<script>
const S = {
  db: [],
  assets: [],
  pingStatus: {},
  kmValue: null,
  kmText: '---',
  lat: 0,
  lon: 0,
  acc: null,
  bipActive: false,
  audioCtx: null
};

const $ = id => document.getElementById(id);
const num = v => { const s = String(v ?? '').trim(); if (!s) return NaN; return /,\d+$/.test(s) ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s); };
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function playBeep(freq = 880, duration = 150) {
  try {
    if (!S.audioCtx) S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (S.audioCtx.state === 'suspended') S.audioCtx.resume();
    const osc = S.audioCtx.createOscillator();
    const gain = S.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, S.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, S.audioCtx.currentTime + duration / 1000);
    osc.connect(gain);
    gain.connect(S.audioCtx.destination);
    osc.start();
    osc.stop(S.audioCtx.currentTime + duration / 1000);
  } catch(e) {}
}

function toggleBipAlert() {
  S.bipActive = !S.bipActive;
  $('btnBip').className = S.bipActive ? 'btn-bip active' : 'btn-bip';
  $('bipIcon').textContent = S.bipActive ? '🚨' : '🔔';
  $('bipText').textContent = S.bipActive ? 'Alerta Bip: ON' : 'Alerta Bip: OFF';
  if(S.bipActive) playBeep(1200, 200);
}

/* Leitura SNV (KM) */
function parseKmCsv(t) {
  if (!t) return [];
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const L = t.split(/\r?\n/).filter(l => l.trim());
  if (!L.length) return [];
  const sep = L[0].includes(';') ? ';' : ',';
  const h = L.shift().split(sep).map(x => x.trim().toLowerCase());
  const a = h.findIndex(x => ['km'].includes(x));
  const b = h.findIndex(x => ['lat', 'latitude'].includes(x));
  const c = h.findIndex(x => ['lon', 'long', 'longitude'].includes(x));
  if (a < 0 || b < 0 || c < 0) return [];
  return L.map(l => {
    const r = l.split(sep);
    return { km: num(r[a]), lat: num(r[b]), lon: num(r[c]) };
  }).filter(p => [p.km, p.lat, p.lon].every(Number.isFinite));
}

function nearestKm(la, lo) {
  if (!S.db.length) return null;
  let best = S.db[0], min = Infinity;
  const rad = Math.PI / 180, R = 6371000;
  // Acha o mais próximo sem travar por distância máxima
  for (const p of S.db) {
    const dLat = (p.lat - la) * rad, dLon = (p.lon - lo) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(la * rad) * Math.cos(p.lat * rad) * Math.sin(dLon / 2) ** 2;
    const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    if (dist < min) { min = dist; best = p; }
  }
  return { km: best.km, dist: min };
}

/* Leitura de Ativos (ativos 116.csv) */
function parseAssetKm(v) {
  const s = String(v ?? '').trim().replace(/^\uFEFF/, '');
  const m = s.match(/^(\d{1,3})\s*\+\s*(\d{1,3})(?:[,.](\d+))?$/);
  if (m) return Number(m[1]) + Number(`${m[2]}${m[3] || ''}`) / Math.pow(10, (m[3] || '').length + 3);
  return num(s);
}

function parseAssetsCsv(t) {
  if (!t) return [];
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const lines = t.split(/\r?\n/).filter(x => x.trim());
  if (lines.length < 2) return [];
  const h = lines[0].split(';').map(x => x.replace(/^\s*\uFEFF/, '').replace(/"/g, '').trim().toLowerCase());
  const find = names => h.findIndex(x => names.includes(x));
  const tag = find(['tag', 'ativo', 'equipamento']), equip = find(['equipamento', 'tipo']), km = find(['km']), ip = find(['ip', 'endereço ip', 'endereco ip']), fibra = find(['fibra', 'anel', 'tubo', 'circuito']);
  if (km < 0) return [];
  return lines.slice(1).map(line => {
    const r = line.split(';').map(x => x.trim().replace(/^"|"$/g, ''));
    return {
      tag: tag >= 0 ? r[tag] : '',
      equip: equip >= 0 ? r[equip] : '',
      km: parseAssetKm(r[km]),
      kmLabel: r[km] || '',
      ip: ip >= 0 ? r[ip] : '',
      fibra: fibra >= 0 ? r[fibra] : 'FIBRA-PRINCIPAL'
    };
  }).filter(a => Number.isFinite(a.km));
}

/* Ping / Teste VPN */
async function pingIp(ip) {
  if (!ip) return 'no-ip';
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), 1200);
  try {
    await fetch(ip.startsWith('http') ? ip : `http://${ip}`, { mode: 'no-cors', signal: controller.signal, cache: 'no-store' });
    clearTimeout(id);
    return 'online';
  } catch (e) {
    clearTimeout(id);
    return (e.name === 'AbortError') ? 'offline' : 'online';
  }
}

async function checkAssetPings(displayAssets) {
  let hasOffline = false;
  for (const asset of displayAssets) {
    if (!asset.ip) continue;
    const res = await pingIp(asset.ip);
    S.pingStatus[asset.ip] = res;
    if (res === 'offline') hasOffline = true;
  }
  if (S.bipActive && hasOffline) {
    playBeep(440, 400);
    setTimeout(() => playBeep(330, 400), 250);
  }
  renderAssetsUIOnly();
}

/* Seleção de Fibra (3 Antes e 3 Depois) baseada no KM mais próximo */
function getSurroundingAssetsByFiber(currentKm) {
  if (!S.assets.length) return { finalGroup: [], nearestAsset: null, currentFiber: 'SEM DADOS' };

  let nearestAsset = S.assets[0];
  let minDiff = Math.abs(S.assets[0].km - currentKm);

  for (let i = 1; i < S.assets.length; i++) {
    const diff = Math.abs(S.assets[i].km - currentKm);
    if (diff < minDiff) {
      minDiff = diff;
      nearestAsset = S.assets[i];
    }
  }

  const currentFiber = nearestAsset.fibra || 'FIBRA-PRINCIPAL';
  const fiberAssets = S.assets.filter(a => (a.fibra || 'FIBRA-PRINCIPAL') === currentFiber).sort((a, b) => a.km - b.km);

  const before = fiberAssets.filter(a => a.km <= currentKm).sort((a, b) => b.km - a.km).slice(0, 3).reverse();
  const after = fiberAssets.filter(a => a.km > currentKm).sort((a, b) => a.km - b.km).slice(0, 3);

  const map = new Map();
  [...before, nearestAsset, ...after].forEach(a => map.set(`${a.tag}_${a.km}_${a.ip}`, a));
  const finalGroup = Array.from(map.values()).sort((a, b) => a.km - b.km);

  return { finalGroup, nearestAsset, currentFiber };
}

function renderAssetsUIOnly() {
  const current = S.kmValue;
  if (!Number.isFinite(current)) return;

  const { finalGroup, nearestAsset, currentFiber } = getSurroundingAssetsByFiber(current);
  $('fiberTag').textContent = currentFiber;

  $('assetsList').innerHTML = finalGroup.map(a => {
    const isNearest = a === nearestAsset;
    const delta = a.km - current;
    const dir = delta < 0 ? 'atrás' : delta > 0 ? 'à frente' : 'no ponto';
    const st = S.pingStatus[a.ip] || 'checking';

    let badgeClass = 'checking', badgeText = 'CHECANDO';
    if (st === 'online') { badgeClass = 'online'; badgeText = 'ONLINE'; }
    else if (st === 'offline') { badgeClass = 'offline'; badgeText = 'OFFLINE'; }
    if (!a.ip) { badgeClass = 'checking'; badgeText = 'SEM IP'; }

    return `<div class="asset-card${isNearest ? ' nearest' : ''}">
      <div class="asset-head">
        <span class="asset-title">${isNearest ? '★ VOCÊ ESTÁ AQUI · ' : ''}${escapeHtml(a.tag || a.equip || 'Ativo')}</span>
        <span class="asset-km">KM ${escapeHtml(a.kmLabel)}</span>
      </div>
      <div class="asset-details">
        <span><b>Tipo:</b> ${escapeHtml(a.equip)}</span>
        <span><b>IP:</b> ${a.ip ? escapeHtml(a.ip) : 'Não informado'}</span>
      </div>
      <div class="asset-foot">
        <span>${Math.abs(delta).toFixed(3)} km (${dir})</span>
        <span class="badge-ping ${badgeClass}">${badgeText}</span>
      </div>
    </div>`;
  }).join('');
}

function renderAssets() {
  const current = S.kmValue;
  if (!S.assets.length) {
    $('assetsList').innerHTML = '<div class="empty-state">Carregando planilha de ativos…</div>';
    return;
  }
  if (!Number.isFinite(current)) {
    $('assetsList').innerHTML = '<div class="empty-state">Aguardando sinal GPS para calcular o KM…</div>';
    return;
  }

  const { finalGroup } = getSurroundingAssetsByFiber(current);
  renderAssetsUIOnly();
  checkAssetPings(finalGroup);
}

function updateLocationUI() {
  $('kmLabel').textContent = S.kmText === '---' ? 'KM ---' : `KM ${S.kmText}`;
  $('locTitle').textContent = 'KM Mais Próximo (GPS Ativo)';
  $('gpsAcc').textContent = S.acc !== null ? `Precisão GPS ±${Math.round(S.acc)} m` : 'GPS Ativo';
  $('coords').textContent = `${S.lat.toFixed(5)}, ${S.lon.toFixed(5)}`;
}

function refreshNearest() {
  if (!S.db.length || !S.lat) return;
  const n = nearestKm(S.lat, S.lon);
  if (n) {
    S.kmValue = n.km;
    S.kmText = (Math.round(n.km * 100) / 100).toFixed(2).replace('.', ',');
    updateLocationUI();
    renderAssets();
  }
}

/* Carregamento automático imediato */
fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { S.db = parseKmCsv(t); refreshNearest(); });

fetch(encodeURI('ativos 116.csv?v=' + Date.now()), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { S.assets = parseAssetsCsv(t); renderAssets(); });

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    S.lat = p.coords.latitude;
    S.lon = p.coords.longitude;
    S.acc = p.coords.accuracy;
    refreshNearest();
  }, (err) => {
    $('locTitle').textContent = 'Erro no GPS: verifique permissões';
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}
</script>
</body>
</html>
