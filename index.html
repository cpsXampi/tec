<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sistema de Foto-Relatório</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== DESIGN TOKENS ===== */
:root{
  --bg:#06070a;--bg2:#0a0d11;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.16);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --accent-dim:rgba(255,214,0,.06);--accent-glow:rgba(255,214,0,.15);
  --green:#10b981;--green2:#34d399;--green3:#059669;
  --green-dim:rgba(16,185,129,.08);
  --red:#ef4444;--red-dim:rgba(239,68,68,.08);
  --warn:#f59e0b;--warn-dim:rgba(245,158,11,.08);
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;--dim:#3f3f46;--dimmer:#27272a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--r-2xl:28px;
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
  --glass:rgba(255,255,255,.03);--glass2:rgba(255,255,255,.05);--glass3:rgba(255,255,255,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;-webkit-user-select:none;user-select:none}
input,select{font-family:var(--font);outline:none}
img,video{display:block;max-width:100%}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
#splash.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s ease}
.sp-bg{position:absolute;inset:0;overflow:hidden}
.sp-glow{position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 42%,rgba(255,214,0,.09),transparent 70%);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,black 10%,transparent 65%)}
.sp-scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,214,0,.12),transparent);animation:scan 3s linear infinite}
@keyframes scan{from{top:-2px}to{top:100%}}
.sp-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.sp-logo-wrap{position:relative;width:104px;height:104px}
.sp-logo{width:100%;height:100%;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent3));display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,214,0,.25),0 24px 80px rgba(255,214,0,.22),inset 0 1px 0 rgba(255,255,255,.3);animation:logoIn .7s cubic-bezier(.34,1.56,.64,1) .15s both}
.sp-logo svg{width:56px;height:56px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
@keyframes logoIn{from{transform:scale(0) rotate(-140deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.sp-title{margin-top:16px;font-size:clamp(28px,8vw,36px);font-weight:900;letter-spacing:-.03em;background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sp-bar{margin-top:48px;width:180px;height:3px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.sp-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:barLoad 1.1s 1s ease-in-out both;transform-origin:left}
@keyframes barLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== MENU ===== */
#main-menu{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:var(--bg);overflow-y:auto}
.menu-inner{max-width:460px;width:100%;margin:0 auto}
.menu-grid{display:flex;flex-direction:column;gap:16px}
.mc{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--glass);transition:all .2s var(--ease);text-align:left;width:100%}
.mc:active{transform:scale(.975)}
.mc.pri{border-color:rgba(255,214,0,.3);background:linear-gradient(135deg,rgba(255,214,0,.08),rgba(255,214,0,.02));box-shadow:0 6px 24px rgba(255,214,0,.06)}
.mc-i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:rgba(255,214,0,.12);color:var(--accent)}
.mc-i svg{width:24px;height:24px}
.mc-b{flex:1;min-width:0}
.mc-b h3{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.mc-b p{font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.mc-a{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--glass);color:var(--dim);flex-shrink:0}

/* ===== MODULE ===== */
.module{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:var(--bg);z-index:10}
.module.active{display:block}

/* ===== INSPEÇÃO & FOTO ÚNICA ===== */
#mod-inspecao, #mod-foto-unica{position:fixed;inset:0;overflow:hidden;background:#000}
#gate{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow-y:auto}
.gate-box{max-width:400px;width:100%;border-radius:var(--r-xl);border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface2) 100%);padding:36px 24px;text-align:center;box-shadow:var(--shadow-xl)}
.gate-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent-dim),rgba(255,214,0,.06));border:1px solid rgba(255,214,0,.12);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.gate-icon svg{width:36px;height:36px}
.gate-box h1{font-size:22px;font-weight:900;margin-top:24px}
.gate-box>p{font-size:12px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.6}
.gate-err{margin-top:16px;border-radius:var(--r-sm);background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);padding:12px;font-size:11px;font-weight:700;color:#fca5a5;text-align:left}
.gate-btn{width:100%;min-height:52px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 20px rgba(255,214,0,.12)}
.gate-btn:active{transform:scale(.98)}
.gate-btn.sec{background:var(--glass);border:1px solid var(--border);color:var(--text);margin-top:8px;box-shadow:none}

#app-shell{position:relative;width:100vw;height:100vh;height:100dvh;visibility:hidden;overflow:hidden}
#vid, #vidUnica{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#km-hud, #km-hud-unica{position:absolute;top:calc(18px + var(--safe-t));left:14px;min-width:160px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.1);background:rgba(4,120,87,.78);padding:10px 18px;text-align:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 6px 28px rgba(0,0,0,.5);pointer-events:none;z-index:100}
#km-hud .h-l, #km-hud-unica .h-l{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:rgba(220,252,231,.55)}
#km-hud .h-v, #km-hud-unica .h-v{font-size:26px;font-weight:900;line-height:1.1;margin-top:2px}
#rec-tag{position:absolute;top:calc(22px + var(--safe-t));right:14px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);padding:7px 13px;border-radius:22px;backdrop-filter:blur(12px);opacity:0;transition:all .25s var(--ease);z-index:100;pointer-events:none}
#rec-tag.on{opacity:1}
#rec-tag .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1s infinite;box-shadow:0 0 8px rgba(239,68,68,.5)}
@keyframes blink{50%{opacity:.1}}
#rec-tag span{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}

#ui-ctrl{position:absolute;bottom:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 24px calc(24px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.35) 55%,transparent)}
.ui-btn{height:52px;border-radius:var(--r-sm);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s var(--ease);box-shadow:var(--shadow-md)}
.ui-btn:active{transform:scale(.94)}
.ui-btn svg{width:18px;height:18px}
#btn-gear, .btn-gear-unica{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:var(--text2);display:grid;place-items:center}
#btn-start{flex:1;margin:0 12px;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;box-shadow:0 6px 24px rgba(255,214,0,.16)}
#btn-stop{flex:1;margin:0 12px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;display:none;box-shadow:0 6px 24px rgba(220,38,38,.16)}
#btn-menu, .btn-menu-unica{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:var(--text2);display:grid;place-items:center}

/* BOTÃO DE CÂMERA NATIVA (BOLA / OBTURADOR LIMPO) */
.shutter-btn{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;display:grid;place-items:center;transition:transform .1s var(--ease);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.shutter-btn:active{transform:scale(.92)}
.shutter-btn-inner{width:100%;height:100%;border-radius:50%;background:#fff;transition:background .15s var(--ease)}
.shutter-btn:active .shutter-btn-inner{background:var(--accent)}

/* INDICADOR DE ZOOM */
.zoom-hud{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:900;color:#fff;backdrop-filter:blur(10px);pointer-events:none;opacity:0;transition:opacity .2s ease;z-index:150}
.zoom-hud.show{opacity:1}

/* ===== SETTINGS ===== */
.settings-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.6);opacity:0;visibility:hidden;pointer-events:none;transition:all .25s var(--ease)}
.settings-modal.open{opacity:1;visibility:visible;pointer-events:auto}
.settings-content{width:min(90vw,400px);max-height:85vh;border-radius:var(--r-xl);border:1px solid var(--border2);background:rgba(10,13,17,0.96);padding:24px;overflow-y:auto;box-shadow:var(--shadow-xl);transform:scale(.95);transition:transform .25s var(--ease)}
.settings-modal.open .settings-content{transform:scale(1)}
.settings-close{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.settings-close svg{width:14px;height:14px}
.s-group{margin-top:22px}
.s-lbl{display:block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.s-inp{width:100%;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:#fff;padding:13px;font-size:13px;font-weight:800;appearance:none;-webkit-appearance:none}

canvas#c, canvas#cUnica{display:none}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(16px);border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);padding:12px 20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);z-index:99998;opacity:0;transition:all .25s var(--ease);pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:14px;height:14px;flex-shrink:0}
.toast.ok{border-color:rgba(16,185,129,.25);color:var(--green2)}
.toast.err{border-color:rgba(239,68,68,.25);color:#fca5a5}
</style>
</head>
<body>
<!-- SPLASH -->
<div id="splash" aria-hidden="true">
  <div class="sp-bg">
    <div class="sp-glow"></div>
    <div class="sp-grid"></div>
    <div class="sp-scan"></div>
  </div>
  <div class="sp-content">
    <div class="sp-logo-wrap">
      <div class="sp-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
    </div>
    <h1 class="sp-title">Sistema de Inspeção</h1>
    <div class="sp-bar"><div class="sp-bar-fill"></div></div>
  </div>
</div>

<!-- MENU -->
<div id="main-menu">
  <div class="menu-inner">
    <div class="menu-grid">
      <button class="mc pri" onclick="openMod('foto-unica')">
        <span class="mc-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg></span>
        <span class="mc-b"><h3>Foto Única</h3><p>Tirar foto avulsa com KM e salvar na pasta</p></span>
        <span class="mc-a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
      <button class="mc pri" onclick="openMod('inspecao')">
        <span class="mc-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg></span>
        <span class="mc-b"><h3>Inspeção Fotográfica PDF</h3><p>Relatório completo em PDF por lote</p></span>
        <span class="mc-a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
    </div>
  </div>
</div>

<!-- FOTO ÚNICA -->
<div id="mod-foto-unica" class="module">
  <video id="vidUnica" autoplay playsinline muted></video>
  <div id="km-hud-unica">
    <span class="h-l">KM atual</span>
    <p class="h-v" style="color:#fff" id="kmTxtUnica">KM ---</p>
  </div>
  
  <div class="zoom-hud" id="zoomHudUnica">1.0x</div>

  <div style="position:absolute;bottom:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 28px calc(28px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.82),transparent)">
    <button class="btn-gear-unica" onclick="toggleSet('settingsUnica')" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    
    <!-- BOTÃO NATIVO DE CÂMERA (BOLA LIMPA SEM TEXTO) -->
    <button class="shutter-btn" onclick="takeSinglePhoto()" aria-label="Tirar foto">
      <div class="shutter-btn-inner"></div>
    </button>
    
    <button class="btn-menu-unica" onclick="openMod('menu')" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </div>
  <canvas id="cUnica"></canvas>
</div>

<!-- INSPEÇÃO (PDF) -->
<div id="mod-inspecao" class="module">
  <div id="gate">
    <div class="gate-box">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      </div>
      <h1>Inspeção Fotográfica PDF</h1>
      <p>Configure e inicie a captura das fotos para a geração automática do relatório em PDF.</p>
      <div id="gateErr" class="gate-err" style="display:none"></div>
      <div style="margin-top:20px;text-align:left">
        <label style="display:block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px">Etiqueta / Tipo de serviço <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim)">(opcional)</span></label>
        <input id="fotoLabel" type="text" placeholder="Ex: Manutenção, Inspeção, Vistoria..." autocomplete="off" spellcheck="false" oninput="syncFotoLabel(this.value)" style="width:100%;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:#fff;padding:13px;font-size:13px;font-weight:600;outline:none;font-family:var(--font)">
      </div>
      <button class="gate-btn" onclick="startApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Ativar Câmera
      </button>
      <button class="gate-btn sec" onclick="openMod('menu')">Voltar ao menu</button>
    </div>
  </div>

  <div id="app-shell">
    <video id="vid" autoplay playsinline muted onclick="manualPhoto()"></video>
    <div id="km-hud"><span class="h-l">KM atual</span><p class="h-v" id="kmTxt">KM ---</p></div>
    <div id="label-hud" style="position:absolute;top:calc(82px + var(--safe-t));right:14px;max-width:220px;border-radius:var(--r-sm);border:1px solid rgba(255,214,0,.3);background:rgba(0,0,0,.68);padding:8px 12px;backdrop-filter:blur(12px);z-index:100">
      <p style="font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,214,0,.75);margin-bottom:5px">Etiqueta</p>
      <input id="fotoLabelLive" type="text" placeholder="Tipo de serviço..." autocomplete="off" spellcheck="false" oninput="syncFotoLabel(this.value)" style="background:transparent;border:none;outline:none;color:#fff;font-size:11px;font-weight:700;width:100%;caret-color:var(--accent);font-family:var(--font)">
    </div>
    <div id="rec-tag"><div class="dot"></div><span>Registrando no PDF</span></div>
    
    <div class="zoom-hud" id="zoomHudInspecao">1.0x</div>

    <div id="ui-ctrl">
      <button class="ui-btn" id="btn-gear" onclick="toggleSet('settingsInspecao')" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="ui-btn" id="btn-start" onclick="startCap()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>Iniciar
      </button>
      <button class="ui-btn" id="btn-stop" onclick="stopCap()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>Finalizar PDF
      </button>
      <button class="ui-btn" id="btn-menu" onclick="openMod('menu')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
  </div>
  <canvas id="c"></canvas>
</div>

<!-- SETTINGS MODAL (FOTO ÚNICA) -->
<div id="settingsUnica" class="settings-modal">
  <div class="settings-content">
    <button class="settings-close" onclick="toggleSet('settingsUnica')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Fechar</button>
    <h2>Configurações de Câmera</h2>
    <div class="s-group"><label class="s-lbl">Câmera ativa</label><select class="s-inp camSel" onchange="switchCam(this.value, 'unica')"></select></div>
  </div>
</div>

<!-- SETTINGS MODAL (INSPEÇÃO) -->
<div id="settingsInspecao" class="settings-modal">
  <div class="settings-content">
    <button class="settings-close" onclick="toggleSet('settingsInspecao')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Fechar</button>
    <h2>Configurações</h2>
    <div class="s-group"><label class="s-lbl">Câmera ativa</label><select class="s-inp camSel" onchange="switchCam(this.value, 'inspecao')"></select></div>
    <div class="s-group"><label class="s-lbl">Intervalo de captura (ms)</label><input type="number" class="s-inp" id="cfgInt" value="2000" min="1000" step="500"></div>
    <div class="s-group"><label class="s-lbl">Fotos por lote</label><input type="number" class="s-inp" id="cfgLote" value="50"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" aria-live="polite"></div>

<script>
/* ===== UTILITIES & STATE ===== */
const parsePt=v=>{const s=String(v??'').trim();return/,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
function findCol(h,cs){const m=h.map(s=>String(s||'').trim().toUpperCase());for(const c of cs){const i=m.indexOf(c.toUpperCase());if(i>=0)return i}return-1}

let kmDB=[], stream=null, streamUnica=null, capturing=false, buffer=[], lat='0.000000', lon='0.000000';
let currentKm = '---';
let dirHandle = null;

let currentTrack = null;
let zoomCapabilities = null;
let currentZoom = 1;
let initialPinchDistance = null;

/* ===== FULLSCREEN HELPER ===== */
function triggerFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen().catch(() => {});
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  }
}

/* ===== SELEÇÃO DE PASTA NATIVA DO DISPOSITIVO ===== */
async function selectDirectory() {
  if ('showDirectoryPicker' in window) {
    try {
      dirHandle = await window.showDirectoryPicker();
      showToast('Pasta selecionada com sucesso!');
      return true;
    } catch (err) {
      if (err.name !== 'AbortError') showToast('Erro ao selecionar pasta', 'err');
      return false;
    }
  } else {
    showToast('Modo de salvamento por downloads ativos');
    return true;
  }
}

async function saveBlobToDirectory(blob, fileName) {
  if (dirHandle) {
    try {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    } catch (e) {
      console.error(e);
    }
  }
  // Fallback tradicional se o diretório direto não estiver habilitado
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

/* ===== TOAST ===== */
let _tt=null;
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  const icons={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>',err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'};
  el.className='toast '+type;
  el.innerHTML=(icons[type]||'')+msg;
  clearTimeout(_tt);
  requestAnimationFrame(()=>{el.classList.add('show');_tt=setTimeout(()=>el.classList.remove('show'),3000)});
}

/* ===== NAVEGAÇÃO E SOLICITAÇÃO DE PASTA ===== */
async function openMod(id){
  const menu=document.getElementById('main-menu');
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  if(id==='menu'){
    menu.style.display='flex';
    if(streamUnica){streamUnica.getTracks().forEach(t=>t.stop());streamUnica=null;}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    capturing=false;
    return;
  }
  
  // Solicita obrigatoriamente a pasta de destino ao acessar qualquer módulo
  if (id === 'foto-unica' || id === 'inspecao') {
    const ok = await selectDirectory();
    if (!ok && 'showDirectoryPicker' in window) return;
  }

  menu.style.display='none';
  document.getElementById('mod-'+id).classList.add('active');
  triggerFullscreen();
  if(id==='foto-unica')initFotoUnica();
}

/* ===== SPLASH ===== */
setTimeout(()=>document.getElementById('splash').classList.add('done'),1500);

/* ===== BASE DE DADOS KM ===== */
async function loadKm(){
  try{
    let r=await fetch('SNVBR116SPRJ.csv?v='+Date.now(),{cache:'no-store'}).catch(()=>null);
    if(!r?.ok)return;
    let t=await r.text();
    if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
    const lines=t.split(/\r?\n/).filter(l=>l.trim());
    const h=lines.shift().split(';');
    const iKm=findCol(h,['km']),iLat=findCol(h,['lat','latitude']),iLon=findCol(h,['lon','long','longitude']);
    kmDB=lines.map(l=>{
      const r=l.split(';');
      return {km:parsePt(r[iKm]),lat:parsePt(r[iLat]),lon:parsePt(r[iLon])};
    }).filter(p=>Number.isFinite(p.km)&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));
  }catch(e){}
}
loadKm();

/* ===== GPS WATCH ===== */
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(p=>{
    lat = p.coords.latitude.toFixed(6);
    lon = p.coords.longitude.toFixed(6);
    if(!kmDB.length)return;
    let best=null,minD=Infinity;
    for(const pt of kmDB){
      const d=Math.hypot(pt.lat-p.coords.latitude,pt.lon-p.coords.longitude);
      if(d<minD){minD=d;best=pt}
    }
    if(best){
      currentKm = (Math.round(best.km*100)/100).toFixed(2).replace('.',',');
      document.getElementById('kmTxtUnica').textContent='KM '+currentKm;
      document.getElementById('kmTxt').textContent='KM '+currentKm;
    }
  },null,{enableHighAccuracy:true});
}

/* ===== CÂMERA & DISPOSITIVOS ===== */
async function populateCameraList() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    document.querySelectorAll('.camSel').forEach(select => {
      select.innerHTML = '';
      videoDevices.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Câmera ${idx + 1}`;
        select.appendChild(opt);
      });
    });
  } catch (e) {}
}

async function switchCam(deviceId, type) {
  const constraints = { video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  if (type === 'unica') {
    if (streamUnica) streamUnica.getTracks().forEach(t => t.stop());
    streamUnica = await navigator.mediaDevices.getUserMedia(constraints);
    const video = document.getElementById('vidUnica');
    video.srcObject = streamUnica;
    setupTrackCapabilities(streamUnica);
  } else {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    const video = document.getElementById('vid');
    video.srcObject = stream;
    setupTrackCapabilities(stream);
  }
}

function setupTrackCapabilities(mediaStream) {
  currentTrack = mediaStream.getVideoTracks()[0];
  if (currentTrack.getCapabilities) {
    const capabilities = currentTrack.getCapabilities();
    if (capabilities.zoom) {
      zoomCapabilities = capabilities.zoom;
      currentZoom = currentTrack.getSettings().zoom || zoomCapabilities.min;
    } else {
      zoomCapabilities = null;
    }
  }
}

/* ===== PINCH TO ZOOM (DOIS DEDOS PINÇANDO A TELA) ===== */
function initPinchZoom(videoEl, hudEl) {
  videoEl.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      initialPinchDistance = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
    }
  });

  videoEl.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && initialPinchDistance && zoomCapabilities) {
      const currentDistance = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      const diff = currentDistance - initialPinchDistance;
      const step = (zoomCapabilities.max - zoomCapabilities.min) / 100;
      let newZoom = currentZoom + (diff > 0 ? step : -step);
      newZoom = Math.min(Math.max(newZoom, zoomCapabilities.min), zoomCapabilities.max);
      
      currentTrack.applyConstraints({ advanced: [{ zoom: newZoom }] });
      currentZoom = newZoom;
      initialPinchDistance = currentDistance;

      hudEl.textContent = newZoom.toFixed(1) + 'x';
      hudEl.classList.add('show');
    }
  });

  videoEl.addEventListener('touchend', () => {
    initialPinchDistance = null;
    setTimeout(() => hudEl.classList.remove('show'), 1000);
  });
}

/* ===== FOTO ÚNICA ===== */
async function initFotoUnica(){
  try{
    triggerFullscreen();
    streamUnica = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
    const video = document.getElementById('vidUnica');
    video.srcObject = streamUnica;
    setupTrackCapabilities(streamUnica);
    initPinchZoom(video, document.getElementById('zoomHudUnica'));
    await populateCameraList();
  }catch(e){
    showToast('Erro ao acessar a câmera', 'err');
  }
}

async function takeSinglePhoto(){
  const vid = document.getElementById('vidUnica');
  const c = document.getElementById('cUnica');
  const ctx = c.getContext('2d');
  if(!vid.videoWidth)return;

  c.width = vid.videoWidth;
  c.height = vid.videoHeight;
  
  drawOverlayCustom(ctx, vid, c.width, c.height, currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${lat}, ${lon}`);

  c.toBlob(async blob => {
    const fileName = `FOTO_AVULSA_KM_${currentKm}_${Date.now()}.jpg`;
    await saveBlobToDirectory(blob, fileName);
    showToast('Foto salva na pasta!');
  }, 'image/jpeg', 0.85);
}

/* ===== INSPEÇÃO FOTOGRÁFICA (PDF ORIGINAL) ===== */
async function startApp(){
  try{
    triggerFullscreen();
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
    const video = document.getElementById('vid');
    video.srcObject = stream;
    setupTrackCapabilities(stream);
    initPinchZoom(video, document.getElementById('zoomHudInspecao'));
    await populateCameraList();
    
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app-shell').style.visibility = 'visible';
  }catch(e){
    document.getElementById('gateErr').style.display='block';
    document.getElementById('gateErr').textContent='Erro ao acessar câmera: '+e.message;
  }
}

function syncFotoLabel(val){
  document.getElementById('fotoLabel').value = val;
  document.getElementById('fotoLabelLive').value = val;
}

function toggleSet(id){
  document.getElementById(id).classList.toggle('open');
}

function startCap(){
  capturing = true;
  buffer = [];
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'flex';
  document.getElementById('rec-tag').classList.add('on');
  showToast('Gravação do relatório iniciada');
  captureLoop();
}

function captureLoop(){
  if(!capturing) return;
  manualPhoto();
  const interval = Math.max(parseInt(document.getElementById('cfgInt').value) || 2000, 1000);
  setTimeout(captureLoop, interval);
}

async function manualPhoto(){
  const vid = document.getElementById('vid');
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  if(!vid.videoWidth) return;

  c.width = vid.videoWidth;
  c.height = vid.videoHeight;

  drawOverlayCustom(ctx, vid, c.width, c.height, currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${lat}, ${lon}`);
  
  const dataUrl = c.toDataURL('image/jpeg', 0.75);
  buffer.push({
    img: dataUrl,
    km: currentKm,
    time: new Date().toLocaleTimeString('pt-BR')
  });

  // Salva a foto individual na pasta selecionada no momento do disparo
  c.toBlob(async blob => {
    const fileName = `INSPECAO_KM_${currentKm}_${Date.now()}.jpg`;
    await saveBlobToDirectory(blob, fileName);
  }, 'image/jpeg', 0.85);
}

function stopCap(){
  capturing = false;
  document.getElementById('btn-start').style.display = 'flex';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('rec-tag').classList.remove('on');

  if(buffer.length === 0){
    showToast('Nenhuma foto capturada', 'err');
    return;
  }

  generatePDF();
}

async function generatePDF(){
  showToast('Gerando PDF, aguarde...');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  
  const label = document.getElementById('fotoLabel').value || 'Relatório de Inspeção';
  
  doc.setFontSize(16);
  doc.text(label, 14, 15);
  doc.setFontSize(10);
  doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')} | Total de Fotos: ${buffer.length}`, 14, 22);

  let y = 30;
  buffer.forEach((item, index)=>{
    if(y > 230){
      doc.addPage();
      y = 20;
    }
    doc.addImage(item.img, 'JPEG', 14, y, 80, 50);
    doc.setFontSize(9);
    doc.text(`Foto #${index + 1}`, 100, y + 10);
    doc.text(`KM: ${item.km}`, 100, y + 18);
    doc.text(`Horário: ${item.time}`, 100, y + 26);
    y += 58;
  });

  const pdfBlob = doc.output('blob');
  const pdfName = `Relatorio_Inspecao_KM_${buffer[0]?.km||'0'}_a_${buffer[buffer.length-1]?.km||'0'}.pdf`;
  await saveBlobToDirectory(pdfBlob, pdfName);

  showToast('PDF salvo com sucesso!');
  buffer = [];
}

/* ===== MANTÉM A ESTAMPA / OVERLAY ORIGINAL DA FOTO ===== */
function drawOverlayCustom(ctx, videoEl, w, h, kmVal, ts, gpsStr){
  ctx.drawImage(videoEl, 0, 0, w, h);
  const bh = h * .13;
  const grad = ctx.createLinearGradient(0, h - bh, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(.25, 'rgba(0,0,0,.55)');
  grad.addColorStop(1, 'rgba(0,0,0,.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, h - bh, w, bh);

  const label = document.getElementById('fotoLabel').value;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(bh * .30) + 'px Arial,sans-serif';
  ctx.fillText('KM ' + kmVal + (label ? ' - ' + label : ''), 20, h - bh * .55);
  ctx.font = Math.round(bh * .18) + 'px Arial,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText(ts + ' | GPS: ' + gpsStr, 20, h - bh * .22);
}
</script>
