<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Consulta Ativos BR116 — Inspeção & Topologia</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#06070a;--surface:#0f1216;--surface2:#14181d;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-sm:12px;--r-md:16px;--r-xl:24px;
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);--shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:9px}

/* HEADER FIXO */
header{position:fixed;top:0;left:0;right:0;height:calc(60px + var(--safe-t));padding-top:var(--safe-t);background:rgba(6,7,10,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);z-index:500;display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;display:grid;place-items:center;font-weight:900}
.brand-title{font-size:16px;font-weight:900;letter-spacing:-.02em}

/* MAIN CONTAINER */
main{position:fixed;inset:calc(60px + var(--safe-t)) 0 0 0;overflow-y:auto;padding:16px 16px calc(24px + var(--safe-b))}
.container{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* CARDS DE APRESENTAÇÃO */
.card{background:linear-gradient(145deg,#121720,#0b0e14);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg)}

/* BADGES E BOTÕES */
.badge-gps{font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa}
.btn-primary{width:100%;padding:14px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(255,214,0,.25)}
.btn-sec{padding:12px 16px;border-radius:var(--r-sm);background:rgba(255,255,255,.06);border:1px solid var(--border2);color:#fff;font-size:11px;font-weight:800;text-transform:uppercase}

/* MODAL DE FOTO E REGISTRO DE ATIVO */
#modalFoto{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);display:none;flex-direction:column;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow-y:auto}
#modalFoto.active{display:flex}
.preview-box{width:100%;height:260px;border-radius:16px;background:#000;position:relative;overflow:hidden;border:1px solid var(--border2)}
#cameraVid{width:100%;height:100%;object-fit:cover}

.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(16px);border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);padding:12px 20px;font-size:11px;font-weight:800;text-transform:uppercase;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);z-index:99998;opacity:0;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon"><i data-lucide="radio"></i></div>
    <div>
      <h1 class="brand-title">Consulta Ativos</h1>
      <p style="font-size:10px;color:var(--text3)">Sistema de Manutenção BR116</p>
    </div>
  </div>
  <span id="gpsBadgeHeader" class="badge-gps">Sincronizando GPS...</span>
</header>

<main>
  <div class="container">
    
    <!-- BARRA DE SELEÇÃO E BUSCA POR GPS -->
    <div class="card">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)">Ativo Sincronizado</span>
          <span id="kmRealTime" style="font-size:11px;font-weight:900;color:var(--accent)">KM ---</span>
        </div>
        <select id="topoSelect" onchange="renderTechnicalConsultation(this.value)" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:#fff;padding:12px;border-radius:var(--r-sm);font-size:13px;font-weight:700">
          <option value="">Aguardando leitura do GPS para encontrar ativo...</option>
        </select>
      </div>
    </div>

    <!-- CARD PRINCIPAL DE EXIBIÇÃO DE DADOS DO ATIVO -->
    <div id="topoVisualCard">
      <div class="card" style="text-align:center;padding:40px;color:var(--muted)">
        <p style="font-size:13px;font-weight:800">Aguardando coordenadas de GPS na rodovia para localizar o equipamento mais próximo e suas conexões ópticas...</p>
      </div>
    </div>

  </div>
</main>

<!-- MODAL PARA CÂMERA, REGISTRO E EMISSÃO DE PDF DE DOCUMENTAÇÃO -->
<div id="modalFoto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:16px;font-weight:900">Registro & Documentação do Ativo</h2>
    <button class="btn-sec" onclick="closeFotoModal()">Fechar</button>
  </div>

  <div class="preview-box">
    <video id="cameraVid" autoplay playsinline muted></video>
    <canvas id="photoCanvas" style="display:none"></canvas>
  </div>

  <div style="margin-top:16px;display:flex;gap:12px">
    <button class="btn-primary" onclick="capturePhoto()" style="flex:1"><i data-lucide="camera"></i> Capturar Foto</button>
  </div>

  <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
    <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)">Observações Técnicas de Inspeção</label>
    <textarea id="obsTecnicas" rows="3" placeholder="Informe condições do ativo, caixa de fiação, switch, conectores ópticos, etc..." style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px;color:#fff;font-size:12px"></textarea>
    
    <button class="btn-primary" onclick="generateAssetPDFReport()" style="background:linear-gradient(135deg,#34d399,#047857);color:#fff"><i data-lucide="file-check"></i> Gerar Relatório PDF com Marca D'Água</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let kmDB = [];
let ativosDatabase = [];
let currentKmNum = null;
let currentKmStr = "---";
let selectedAsset = null;
let capturedImageBase64 = null;
let cameraStream = null;

const parsePt = v => { const s = String(v ?? '').trim(); return /,\d+$/.test(s) ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s); };
function findCol(h, cs) { const m = h.map(s => String(s || '').trim().toUpperCase()); for (const c of cs) { const i = m.indexOf(c.toUpperCase()); if (i >= 0) return i; } return -1; }

function parseKmStringToNum(kmStr) {
  if (!kmStr) return 0;
  const s = String(kmStr).trim().toUpperCase().replace('KM', '').trim();
  if (s.includes('+')) {
    const parts = s.split('+');
    const kmInt = parseFloat(parts[0]) || 0;
    const metros = parseFloat(parts[1]) || 0;
    return kmInt + (metros / 1000.0);
  }
  return parseFloat(s.replace(',', '.')) || 0;
}

window.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  loadAtivosCSV();
  loadSNVData();
});

async function loadAtivosCSV() {
  try {
    const res = await fetch('ativos 116.csv?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    let text = await res.text();
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    lines.shift(); lines.shift(); // Remove cabeçalhos da planilha
    
    const rawData = [];
    for (const line of lines) {
      const cols = line.split(';');
      if (cols.length < 13) continue;
      const tag = (cols[0] || '').trim();
      const kmStr = (cols[3] || '').trim();
      if (!tag || !kmStr || tag === 'TAG') continue;

      rawData.push({
        tag: tag,
        eq: (cols[1] || '').trim(),
        host: (cols[2] || '-').trim(),
        kmStr: kmStr,
        sentido: (cols[4] || '-').trim(),
        fibra: (cols[5] || '-').trim(),
        cidade: (cols[6] || '-').trim(),
        anel: (cols[7] || '-').trim(),
        ipGer: (cols[8] || '-').trim(),
        gerencia: (cols[9] || '-').trim(),
        rede: (cols[10] || '-').trim(),
        switchIp: (cols[11] || '-').trim(),
        ativoIp: (cols[12] || '-').trim()
      });
    }

    rawData.forEach(item => { item.kmNum = parseKmStringToNum(item.kmStr); });
    rawData.sort((a,b) => a.kmNum - b.kmNum);

    rawData.forEach((item, idx) => {
      let prev = idx > 0 ? rawData[idx - 1] : rawData[rawData.length - 1];
      let next = idx < rawData.length - 1 ? rawData[idx + 1] : rawData[0];
      ativosDatabase.push({
        ...item,
        prevTag: prev.tag, prevKm: prev.kmStr, prevFibra: prev.fibra, prevDist: Math.abs(item.kmNum - prev.kmNum).toFixed(3),
        nextTag: next.tag, nextKm: next.kmStr, nextFibra: next.fibra, nextDist: Math.abs(next.kmNum - item.kmNum).toFixed(3)
      });
    });

    if (currentKmNum !== null) locateNearestAsset();
  } catch(e) { console.error("Erro ao carregar CSV:", e); }
}

async function loadSNVData() {
  try {
    let r = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (!r?.ok) return;
    let t = await r.text();
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const lines = t.split(/\r?\n/).filter(l => l.trim());
    const h = lines.shift().split(';');
    const iKm = findCol(h, ['km']), iLat = findCol(h, ['lat', 'latitude']), iLon = findCol(h, ['lon', 'long', 'longitude']);
    kmDB = lines.map(l => {
      const r = l.split(';');
      return { km: parsePt(r[iKm]), lat: parsePt(r[iLat]), lon: parsePt(r[iLon]) };
    }).filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  } catch (e) {}
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    if (!kmDB.length) return;
    let best = null, minD = Infinity;
    for (const pt of kmDB) {
      const d = Math.hypot(pt.lat - p.coords.latitude, pt.lon - p.coords.longitude);
      if (d < minD) { minD = d; best = pt; }
    }
    if (best) {
      currentKmNum = parseFloat(best.km);
      currentKmStr = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
      document.getElementById('kmRealTime').textContent = 'KM ' + currentKmStr;
      document.getElementById('gpsBadgeHeader').textContent = 'KM ' + currentKmStr + ' (GPS OK)';
      locateNearestAsset();
    }
  }, null, { enableHighAccuracy: true });
}

function locateNearestAsset() {
  if (currentKmNum === null || !ativosDatabase.length) return;
  let bestIdx = 0, minDiff = Infinity;
  ativosDatabase.forEach((item, idx) => {
    const diff = Math.abs(item.kmNum - currentKmNum);
    if (diff < minDiff) { minDiff = diff; bestIdx = idx; }
  });

  const sel = document.getElementById('topoSelect');
  if (sel) {
    sel.innerHTML = '';
    ativosDatabase.forEach((item, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${item.tag} — ${item.eq} (KM ${item.kmStr}) [Fibra ${item.fibra}]`;
      if (idx === bestIdx) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  renderTechnicalConsultation(bestIdx);
}

function renderTechnicalConsultation(idx) {
  const data = ativosDatabase[idx];
  if(!data) return;
  selectedAsset = data;
  const container = document.getElementById('topoVisualCard');

  const fibrasArr = data.fibra.split(',').map(s => s.trim());
  const fibraTx = fibrasArr[0] || '-';
  const fibraRx = fibrasArr[1] || fibrasArr[0] || '-';

  container.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <!-- PAINEL CENTRAL DO ATIVO LOCALIZADO -->
      <div class="card" style="border-color:rgba(59,130,246,.5);background:linear-gradient(145deg,#182338,#0e1524);text-align:center;padding:24px">
        <span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa">📍 Equipamento Localizado em Tempo Real</span>
        <h3 style="font-size:clamp(26px,5vw,36px);font-weight:900;font-family:monospace;color:var(--accent);margin:6px 0 2px">${data.tag}</h3>
        <p style="font-size:14px;font-family:monospace;color:#fff;font-weight:800">${data.eq} | KM ${data.kmStr} | Sentido ${data.sentido}</p>
        
        <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.4)">Fibra TX: ${fibraTx} / RX: ${fibraRx}</span>
          <span style="font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.4)">Cidade: ${data.cidade}</span>
        </div>

        <button class="btn-primary" onclick="openFotoModal()" style="margin-top:18px"><i data-lucide="camera"></i> Registrar Foto & Emitir Relatório PDF</button>
      </div>

      <!-- TABELA COMPLETA DE DADOS TÉCNICOS DA PLANILHA -->
      <div class="card" style="padding:20px">
        <h4 style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:14px">📋 Dados da Planilha de Ativos</h4>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:12px;font-family:monospace">
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>TAG:</strong><br><span style="color:#ffd600">${data.tag}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Equipamento:</strong><br><span style="color:#fff">${data.eq}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Hostname:</strong><br><span style="color:#60a5fa">${data.host}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>KM / Sentido:</strong><br><span style="color:#fff">KM ${data.kmStr} (${data.sentido})</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Fibra:</strong><br><span style="color:#34d399">${data.fibra}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Cidade:</strong><br><span style="color:#fff">${data.cidade}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Anel FO:</strong><br><span style="color:#fff">${data.anel}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>IP Gerência:</strong><br><span style="color:#ffd600">${data.ipGer}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Gerência:</strong><br><span style="color:#fff">${data.gerencia}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Rede:</strong><br><span style="color:#fff">${data.rede}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Switch:</strong><br><span style="color:#fff">${data.switchIp}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>IP Ativo:</strong><br><span style="color:#fff">${data.ativoIp}</span></div>
        </div>
      </div>

      <!-- MAPA DE INTERLIGAÇÃO ÓPTICA -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card" style="border-left:4px solid #f59e0b">
          <span style="font-size:10px;font-weight:900;color:#f59e0b;text-transform:uppercase">⬅️ Ativo Anterior (${data.prevDist} km)</span>
          <p style="font-size:15px;font-weight:900;color:#fff;margin-top:4px">${data.prevTag}</p>
          <p style="font-size:11px;color:var(--text3)">KM ${data.prevKm} [Fibra ${data.prevFibra}]</p>
        </div>

        <div class="card" style="border-left:4px solid #3b82f6">
          <span style="font-size:10px;font-weight:900;color:#3b82f6;text-transform:uppercase">Ativo Posterior ➡️ (${data.nextDist} km)</span>
          <p style="font-size:15px;font-weight:900;color:#fff;margin-top:4px">${data.nextTag}</p>
          <p style="font-size:11px;color:var(--text3)">KM ${data.nextKm} [Fibra ${data.nextFibra}]</p>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
}

async function openFotoModal() {
  document.getElementById('modalFoto').classList.add('active');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    document.getElementById('cameraVid').srcObject = cameraStream;
  } catch(e) { showToast('Não foi possível ativar a câmera.'); }
}

function closeFotoModal() {
  if(cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }
  document.getElementById('modalFoto').classList.remove('active');
}

function capturePhoto() {
  const vid = document.getElementById('cameraVid');
  const canvas = document.getElementById('photoCanvas');
  canvas.width = vid.videoWidth || 1280;
  canvas.height = vid.videoHeight || 720;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
  
  // Marca d'água no estilo KMReport
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 24px monospace';
  ctx.fillText(`KM ${currentKmStr} | ${selectedAsset ? selectedAsset.tag : ''}`, 20, canvas.height - 45);
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Data/Hora: ${new Date().toLocaleString('pt-BR')}`, 20, canvas.height - 18);

  capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
  showToast('Foto capturada com marca d\'água!');
}

function generateAssetPDFReport() {
  if(!selectedAsset) { showToast('Nenhum ativo selecionado'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFillColor(6, 7, 10);
  doc.rect(0, 0, 210, 297, 'F');

  doc.setTextColor(255, 214, 0);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.text('Relatório de Inspeção - Consulta Ativos BR116', 14, 22);

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(11);
  doc.text(`TAG do Ativo: ${selectedAsset.tag}`, 14, 34);
  doc.text(`Equipamento: ${selectedAsset.eq}`, 14, 42);
  doc.text(`Quilometragem: KM ${selectedAsset.kmStr}`, 14, 50);
  doc.text(`IP Ativo / Gerência: ${selectedAsset.ativoIp} / ${selectedAsset.ipGer}`, 14, 58);
  doc.text(`Switch / Rede: ${selectedAsset.switchIp} / ${selectedAsset.rede}`, 14, 66);
  doc.text(`Anel FO / Cidade: ${selectedAsset.anel} (${selectedAsset.cidade})`, 14, 74);

  const obs = document.getElementById('obsTecnicas').value;
  if(obs) {
    doc.setTextColor(255, 214, 0);
    doc.text('Observações Técnicas:', 14, 88);
    doc.setTextColor(200, 200, 200);
    doc.text(obs, 14, 96);
  }

  if(capturedImageBase64) {
    doc.addImage(capturedImageBase64, 'JPEG', 14, 115, 182, 102);
  }

  doc.save(`Relatorio_Ativo_${selectedAsset.tag}.pdf`);
  showToast('Relatório PDF gerado com sucesso!');
  closeFotoModal();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
