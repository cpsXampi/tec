<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Apoio Técnico</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#070913;
  --surface:#0b1124;
  --surface2:#111936;
  --border:rgba(59,130,246,.2);
  --border2:rgba(59,130,246,.4);
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.3);
  --green:#10b981;
  --green2:#34d399;
  --red:#ef4444;
  --warn:#f59e0b;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;
  --safe-b:max(env(safe-area-inset-bottom,0px),12px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.08),transparent 55%),var(--bg);
  color:var(--text);
  font-family:var(--font);
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{
  font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button:active{opacity:.8;transform:scale(.97)}
input,select{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}

.hdr{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.95);
  backdrop-filter:blur(20px);
  padding:0 12px;padding-top:var(--safe-t);
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hdr-in{
  max-width:760px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;height:44px;
}
.hdr-title{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.25em;
  color:var(--accent);text-shadow:0 0 10px var(--accent-glow);
}

.wrap{
  max-width:760px;margin:0 auto;
  padding:12px;padding-bottom:var(--safe-b);
  display:flex;flex-direction:column;gap:12px;
}

.section-block{
  display:flex;flex-direction:column;gap:8px;
  background:rgba(11,17,36,0.85);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:12px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.menu-pills-grid{
  display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;
}
@media(max-width:600px){
  .menu-pills-grid{grid-template-columns:1fr 1fr;}
}
.menu-pill{
  width:100%;padding:8px;border-radius:var(--r-xs);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text2);
  font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .2s ease;cursor:pointer;text-align:center;
}
.menu-pill.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}

.collapsible-pane{
  display:none;flex-direction:column;gap:6px;margin-top:2px;
}
.collapsible-pane.show{display:flex;}

.km-hero-compact{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r-sm);
  border:1px solid rgba(59,130,246,.35);
  background:linear-gradient(145deg,#111936 0%,#070913 100%);
  padding:10px 14px;
}
.km-value-compact{
  font-size:22px;font-weight:900;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.km-meta-compact{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}

.gps{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  min-height:30px;border-radius:var(--r-xs);
  border:1px solid;padding:0 10px;
  font-size:8px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;
}
.gps.bad{border-color:rgba(100,116,139,.3);background:rgba(11,17,36,.9);color:#e5e7eb}
.gps.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#d1fae5}
.gps.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fef3c7}

.card{
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:rgba(11,17,36,0.9);
  padding:10px;
}
.card-accent{
  border-color:rgba(59,130,246,.35);
  background:linear-gradient(145deg,rgba(59,130,246,.05),rgba(11,17,36,.9));
}

.search-row{display:flex;gap:6px}
.search-wrap{flex:1;min-width:0;position:relative}
.search-input{
  width:100%;border-radius:var(--r-xs);
  border:1px solid var(--border2);
  background:rgba(7,9,19,.9);
  padding:8px 10px;
  font-size:10px;font-weight:800;text-transform:uppercase;color:#fff;
  transition:all .2s ease;
}
.search-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}
.btn-icon{
  width:34px;height:34px;border-radius:var(--r-xs);
  display:grid;place-items:center;flex-shrink:0;
  border:1px solid var(--border);
}
.btn-icon.go{background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;font-weight:900;border:none;box-shadow:0 0 8px var(--accent-glow)}
.btn-icon.clr{background:rgba(7,9,19,.9);color:var(--muted)}
.btn-icon svg{width:14px;height:14px}
.search-msg{
  margin-top:4px;font-size:8px;font-weight:800;
  text-transform:uppercase;color:var(--warn);
}

.modal-box{
  background:rgba(11,17,36,0.98);
  border:1px solid var(--border2);
  border-radius:var(--r-xs);
  padding:10px;
  margin-top:6px;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.modal-box p{font-size:8.5px;font-weight:900;color:var(--accent);text-transform:uppercase;}
.modal-btns{display:flex;gap:6px}
.modal-btn{
  flex:1;padding:8px;border-radius:var(--r-xs);font-size:8px;font-weight:900;text-transform:uppercase;
  background:var(--accent);color:#fff;cursor:pointer;text-align:center;
  border:1px solid rgba(255,255,255,.2);
}
.modal-btn.rj{background:#2563eb;color:#fff;}

.coord-container{
  display:flex;flex-direction:column;gap:6px;
}
.coord-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.coord-input{
  width:100%;border-radius:var(--r-xs);border:1px solid var(--border2);
  background:rgba(7,9,19,.9);padding:8px;font-size:10px;font-weight:800;color:#fff;text-align:center;
}
.coord-input::placeholder{
  font-size:7.5px;font-weight:600;color:var(--muted);text-transform:lowercase;opacity:0.7;
}

.map-box{
  border-radius:var(--r-xs);border:1px solid var(--border2);
  overflow:hidden;position:relative;height:260px;background:#020617;
  margin-top:4px;
}

/* Modo Full Screen Absoluto */
body.fs-active .hdr,
body.fs-active .wrap > .section-block:not(:has(#mapBox)) {
  display: none !important;
}

body.fs-active .wrap {
  max-width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
}

body.fs-active .map-box.fullscreen {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  z-index: 999999 !important;
  border-radius: 0 !important;
  border: none !important;
  margin: 0 !important;
}

.map-ctrls{
  position:absolute;top:6px;right:6px;z-index:1000;
  display:flex;gap:4px;background:rgba(7,9,19,.9);padding:3px;border-radius:4px;border:1px solid var(--border2);
}
.map-btn{
  font-size:7.5px;font-weight:900;text-transform:uppercase;padding:3px 6px;
  border-radius:2px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;
}
.map-btn.active{background:var(--accent);color:#fff}

.fs-close-btn{
  display:none;
  position:fixed;top:16px;left:16px;z-index:10000000;
  background:rgba(239,68,68,.95);color:#fff;padding:10px 18px;
  border-radius:var(--r-xs);font-size:10px;font-weight:900;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,0,0,.7);cursor:pointer;border:1px solid rgba(255,255,255,.4);
  align-items:center;gap:6px;
}
body.fs-active .fs-close-btn {display:inline-flex;}

.post{
  border-radius:var(--r-sm);overflow:hidden;
  border:1px solid var(--border);
  background:rgba(11,17,36,0.95);
  transition:all .2s ease;
}
.post.near{
  border-color:rgba(16,185,129,.5);
  background:linear-gradient(145deg,rgba(16,185,129,.1),rgba(11,17,36,.95));
  box-shadow:0 0 12px rgba(16,185,129,.15);
}
.post.searched{
  border-color:rgba(59,130,246,.5);
  background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(11,17,36,.95));
  box-shadow:0 0 12px var(--accent-glow);
}
.post-top{display:flex;align-items:flex-start;gap:10px;padding:12px;}
.post-chk{margin-top:3px;width:15px;height:15px;accent-color:var(--accent);flex-shrink:0}

/* Blocos de Separação Visual Otimizados (Preenchimento e Proporção Elegante) */
.system-data-box {
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: var(--r-xs);
  padding: 8px 10px;
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}
.system-data-header {
  font-size: 7.5px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--warn);
  border-bottom: 1px solid rgba(245, 158, 11, 0.25);
  padding-bottom: 3px;
}
.system-data-content {
  font-size: 10px;
  font-weight: 900;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: .02em;
}
.system-data-sub {
  font-size: 8.5px;
  font-weight: 700;
  color: var(--text2);
  line-height: 1.3;
}

.dynamic-data-box {
  background: rgba(59, 130, 246, 0.07);
  border: 1px solid rgba(59, 130, 246, 0.35);
  border-radius: var(--r-xs);
  padding: 8px 10px;
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}
.dynamic-data-header {
  font-size: 7.5px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--accent);
  border-bottom: 1px solid rgba(59, 130, 246, 0.25);
  padding-bottom: 3px;
}
.dynamic-data-content {
  font-size: 9.5px;
  font-weight: 900;
  color: var(--green2);
  text-transform: uppercase;
}
.dynamic-data-sub {
  font-size: 8.5px;
  font-weight: 800;
  color: var(--muted);
  line-height: 1.3;
}

.post-id{
  font-size: 11.5px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--accent);
  letter-spacing: .08em;
}
.post-coords{
  font-size: 8px;
  color: var(--dim);
  font-weight: 700;
  margin-top: 6px;
  letter-spacing: .04em;
}

.post-wa{
  width: 32px;
  height: 32px;
  border-radius: var(--r-xs);
  background: rgba(16,185,129,.15);
  border: 1px solid rgba(16,185,129,.35);
  color: var(--green2);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: all .2s ease;
}
.post-wa:active {
  background: rgba(16,185,129,.3);
}
.post-wa svg{width:14px;height:14px}

.post-map{height:130px;width:100%;border:0;filter:grayscale(15%) contrast(1.05)}

.ctrl-send{
  width:auto;min-width:130px;padding:6px 12px;border-radius:var(--r-xs);
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;font-size:8.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 2px 8px rgba(16,185,129,.25);
}
.ctrl-send:disabled{background:var(--dim);color:var(--muted);box-shadow:none}
.ctrl-send svg{width:12px;height:12px}

.ctrl-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;
}
.ctrl-label{
  font-size:8px;font-weight:800;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:3px;
}
.ctrl-select{
  border-radius:4px;border:1px solid var(--border2);background:var(--bg);color:#fff;
  padding:3px 16px 3px 6px;font-size:9px;font-weight:800;appearance:none;
}
.ctrl-chk{width:14px;height:14px;accent-color:var(--accent)}

/* Pop-up Otimizado */
.leaflet-popup-content-wrapper{
  background:rgba(11,17,36,0.98) !important;
  color:#fff !important;
  border:1px solid var(--border2) !important;
  border-radius:var(--r-sm) !important;
  box-shadow:0 8px 32px rgba(0,0,0,.8) !important;
  backdrop-filter:blur(12px);
  z-index:9999999 !important;
}
.leaflet-popup-tip{background:rgba(11,17,36,0.98) !important;}
.leaflet-popup{z-index:9999999 !important;}

.toast{
  position:fixed;bottom:calc(12px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(10px);
  border-radius:var(--r-xs);border:1px solid var(--border2);
  background:var(--surface);padding:8px 14px;font-size:8.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;z-index:99999;opacity:0;transition:all .15s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--accent);border-color:rgba(59,130,246,.4);box-shadow:0 0 10px var(--accent-glow)}
.toast.err{color:#fecaca;border-color:rgba(239,68,68,.4)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-title">Apoio Técnico</div>
    <div style="font-size:9px;font-weight:900;color:var(--accent);" id="topKmLive">—</div>
  </div>
</header>

<div class="wrap">

  <div class="section-block">
    <div class="menu-pills-grid">
      <button class="menu-pill" id="pillId" onclick="switchPane('id')">Pesquisa ID/Placa</button>
      <button class="menu-pill" id="pillKm" onclick="switchPane('km')">Pesquisa KM</button>
      <button class="menu-pill" id="pillCoord" onclick="switchPane('coord')">Coordenada</button>
      <button class="menu-pill" id="pillMap" onclick="switchPane('map')">Mapa</button>
    </div>

    <!-- PAINEL: ID / PLAQUETA / ENDEREÇO -->
    <div class="collapsible-pane" id="paneId">
      <div class="card card-accent">
        <div class="search-row">
          <div class="search-wrap">
            <input class="search-input" id="inputId" placeholder="BUSCAR ID, PLAQUETA OU ENDEREÇO" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchId()">
          </div>
          <button class="btn-icon go" onclick="searchId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
          <button class="btn-icon clr" onclick="clearId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="searchMsg" class="search-msg" style="display:none"></div>
        <div id="searchResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: KM -->
    <div class="collapsible-pane" id="paneKm">
      <div class="card card-accent">
        <div class="search-row">
          <div class="search-wrap">
            <input class="search-input" id="inputKm" placeholder="KM (EX: 115)" inputmode="decimal" pattern="[0-9]*" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchKm()">
          </div>
          <button class="btn-icon go" onclick="searchKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
          <button class="btn-icon clr" onclick="clearKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="searchKmMsg" class="search-msg" style="display:none"></div>
        <div id="searchKmModal" style="display:none"></div>
        <div id="searchKmResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: COORDENADA -->
    <div class="collapsible-pane" id="paneCoord">
      <div class="card card-accent">
        <div style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">
          <span>Coordenada Manual</span>
        </div>
        <div class="coord-container">
          <div class="coord-inputs">
            <input class="coord-input" id="inputLat" placeholder="latitude" autocomplete="off" spellcheck="false">
            <input class="coord-input" id="inputLon" placeholder="longitude" autocomplete="off" spellcheck="false">
          </div>
          <div style="display:flex;gap:4px;">
            <button class="btn-icon go" style="flex:1;height:32px;border-radius:var(--r-xs);font-size:8.5px;" onclick="searchManualCoord()">Calcular</button>
            <button class="btn-icon clr" onclick="clearCoordFields()" style="width:32px;height:32px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
        <div id="searchCoordResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: MAPA -->
    <div class="collapsible-pane" id="paneMap">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--accent)">Mapa Interativo</span>
          <button class="ctrl-select" style="padding:3px 8px;font-size:7.5px;cursor:pointer;" onclick="useCurrentGps()">GPS Atual</button>
        </div>
        <div class="map-box" id="mapBox">
          <div class="map-ctrls">
            <button class="map-btn active" id="btnLayerSat" onclick="setMapLayer('sat')">Sat</button>
            <button class="map-btn" id="btnLayerNorm" onclick="setMapLayer('norm')">Norm</button>
            <button class="map-btn" onclick="toggleFullscreen()">Full</button>
          </div>
          <div id="leafletMap" style="width:100%;height:100%;"></div>
        </div>
      </div>
    </div>
