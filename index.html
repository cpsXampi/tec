<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KM Report - OneDrive</title>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body{
    font-family:Arial;
    max-width:700px;
    margin:auto;
    padding:20px;
}
button{
    padding:12px;
    margin:5px;
}
#userInfo{
    background:#f2f2f2;
    padding:10px;
    margin-top:10px;
}
</style>
</head>
<body>

<h1>KM Report Cloud</h1>

<button onclick="login()">Entrar</button>

<div id="userInfo"></div>

<hr>

<input type="file" id="arquivo">

<button onclick="enviarArquivo()">
Enviar para meu OneDrive
</button>

<script>

const OWNER_FOLDER = "KM_REPORT";

const allowedUsers = [
    "funcionario1@outlook.com",
    "funcionario2@outlook.com"
];

const msalConfig = {

    auth:{
        clientId:"SEU_CLIENT_ID",
        authority:"https://login.microsoftonline.com/common",
        redirectUri:window.location.origin
    }

};

const msalInstance =
new msal.PublicClientApplication(msalConfig);

let account=null;

async function login(){

    try{

        const result =
        await msalInstance.loginPopup({

            scopes:[
                "User.Read",
                "Files.ReadWrite"
            ]

        });

        account=result.account;

        const email =
        account.username.toLowerCase();

        if(!allowedUsers.includes(email)){

            alert("Usuário não autorizado");

            await msalInstance.logoutPopup();

            return;
        }

        document
        .getElementById("userInfo")
        .innerHTML=`
            Usuário: ${email}
        `;

    }

    catch(err){

        console.error(err);

    }

}

async function getToken(){

    return await msalInstance.acquireTokenSilent({

        account,
        scopes:[
            "Files.ReadWrite"
        ]

    });

}

async function criarPasta(){

    const token =
    await getToken();

    await fetch(
    `https://graph.microsoft.com/v1.0/me/drive/root/children`,
    {

        method:"POST",

        headers:{
            "Authorization":
                "Bearer " + token.accessToken,

            "Content-Type":
                "application/json"
        },

        body:JSON.stringify({

            name:OWNER_FOLDER,
            folder:{},

            "@microsoft.graph.conflictBehavior":"rename"

        })

    });

}

async function enviarArquivo(){

    if(!account){

        alert("Faça login");

        return;

    }

    const file =
    document.getElementById("arquivo")
    .files[0];

    if(!file){

        alert("Selecione um arquivo");

        return;

    }

    const token =
    await getToken();

    await criarPasta();

    const uploadUrl =
    `https://graph.microsoft.com/v1.0/me/drive/root:/${OWNER_FOLDER}/${file.name}:/content`;

    const response =
    await fetch(uploadUrl,{

        method:"PUT",

        headers:{
            "Authorization":
            "Bearer " + token.accessToken
        },

        body:file

    });

    if(response.ok){

        alert("Arquivo enviado com sucesso");

    }else{

        alert("Erro ao enviar");

    }

}

</script>

</body>
</html>
