        <span class="mc-b"><h3>Foto e Vídeo</h3><p>Capture fotos e vídeos com KM, GPS e etiqueta</p></span>

<!-- FOTO E VÍDEO -->
<div id="mod-foto-unica" class="module"

>   <video id="vidUnica" autoplay playsinline muted></video>

>     <span style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:rgba(220,252,231,.55)">KM atual</span>
    <p style="font-size:26px;font-weight:900;line-height:1.1;margin-top:2px;color:#fff" id="kmTxtUnica">KM ---</p>
  </div>
  
  <!-- BOTÃO VOLTAR -->
  <div style="position:absolute;top:calc(18px + var(--safe-t));right:14px;z-index:100;"

>     <button onclick="openMod('menu')" style="height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:900;text-transform:uppercase;backdrop-filter:blur(10px)">Voltar</button>
  </div>

  <div id="settingsUnica"

>     <div class="settings-content"

>       <button class="settings-close" onclick="toggleSetUnica()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Fechar</button>
      <h2>Configurações</h2>
      <div class="s-group"><label class="s-lbl">Câmera ativa</label><select class="s-inp" id="camSelUnica" onchange="switchCamUnica(this.value)"></select><p id="camStatusUnica" class="s-note">A prévia ao fundo mostra a câmera selecionada.</p></div>
      <div class="s-group"><label class="s-lbl">Etiqueta <span style="text-transform:none;font-weight:500">(opcional)</span></label><input class="s-inp" id="fotoLabelUnica" type="text" maxlength="80" placeholder="Ex: Vistoria, Manutenção..."><p class="s-note">Se ficar vazia, nenhuma etiqueta será gravada.</p></div>
    </div>
  </div>

  <!-- CONTROLES INFERIORES -->
  <div style="position:absolute;inset:auto 0 0 0;padding:0 18px calc(24px + var(--safe-b));display:flex;gap:16px;align-items:center;justify-content:center;z-index:200;background:linear-gradient(to top,rgba(0,0,0,.82),transparent)"

>     <!-- Configurações -->
    <button class="icon-settings" aria-label="Abrir configurações" onclick="toggleSetUnica()" style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;flex-shrink:0;"

>       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" y="17" r="2"/></svg>
    </button>

    <!-- Botão Disparar Foto -->
    <button onclick="takeSinglePhoto()" style="width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,0.2);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:transform 0.1s ease"

>       <div style="width:56px;height:56px;border-radius:50%;background:#fff;"></div>
    </button>

    <!-- Botão Gravar Vídeo -->
    <button id="btnRecVideoUnica" onclick="toggleVideoRecording()" style="width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:all 0.2s"

>       <svg id="iconVideoUnica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    </button>

  <canvas id="cUnica"></canvas>
