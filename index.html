<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Matriz de Interligações & Ativos ITS</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{
  --bg:#070913;
  --surface:#0b1124;
  --surface2:#111936;
  --border:rgba(59,130,246,.2);
  --border2:rgba(59,130,246,.4);
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.3);
  --green:#10b981;
  --green2:#34d399;
  --purple:#a855f7;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.08),transparent 55%),var(--bg);
  color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;}
button:active{opacity:.8;transform:scale(.97)}
input{font-family:var(--font);outline:none}

.hdr{
  position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.95);backdrop-filter:blur(20px);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hdr-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);}

.wrap{max-width:800px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;}

.card{
  background:rgba(11,17,36,0.9);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.card-accent{border-color:rgba(59,130,246,.35);background:linear-gradient(145deg,rgba(59,130,246,.05),rgba(11,17,36,.9));}

.search-row{display:flex;gap:8px}
.search-wrap{flex:1;min-width:0;position:relative}
.search-input{
  width:100%;border-radius:var(--r-xs);border:1px solid var(--border2);
  background:rgba(7,9,19,.9);padding:10px 12px;
  font-size:11px;font-weight:800;text-transform:uppercase;color:#fff;
  transition:all .2s ease;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}

.btn-icon{
  width:40px;height:40px;border-radius:var(--r-xs);display:grid;place-items:center;
  flex-shrink:0;border:1px solid var(--border);
}
.btn-icon.go{background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;border:none;}
.btn-icon.clr{background:rgba(7,9,19,.9);color:var(--muted)}
.btn-icon svg{width:16px;height:16px}

.asset-card{
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:rgba(11,17,36,0.95);overflow:hidden;
  display:flex;flex-direction:column;gap:10px;padding:14px;margin-bottom:10px;
}
.asset-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.asset-title{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:.02em;}
.asset-badge{font-size:8.5px;font-weight:900;padding:3px 8px;border-radius:3px;background:rgba(59,130,246,.2);color:var(--accent);border:1px solid var(--border2);}

.asset-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;margin-top:4px;}
@media(max-width:600px){.asset-grid{grid-template-columns:1fr 1fr;}}
.asset-field{background:rgba(7,9,19,.6);padding:6px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.05);}
.asset-field-lbl{font-size:7px;font-weight:800;color:var(--muted);text-transform:uppercase;}
.asset-field-val{font-size:9.5px;font-weight:800;color:var(--text);margin-top:2px;word-break:break-word;}

.fiber-box{
  background:linear-gradient(145deg,rgba(168,85,247,.1),rgba(11,17,36,.9));
  border:1px solid rgba(168,85,247,.3);border-radius:var(--r-xs);padding:10px;margin-top:4px;
}
.fiber-header{font-size:9px;font-weight:900;color:var(--purple);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.fiber-neighbors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.fiber-card{
  background:rgba(7,9,19,.85);border:1px solid rgba(168,85,247,.3);
  border-radius:var(--r-xs);padding:8px;cursor:pointer;transition:all .2s ease;
}
.fiber-card:hover{border-color:var(--purple);background:rgba(168,85,247,.2);}
.fiber-card-lbl{font-size:7.5px;font-weight:900;color:var(--purple);text-transform:uppercase;}
.fiber-card-id{font-size:10px;font-weight:900;color:#fff;margin-top:2px;}
.fiber-card-sub{font-size:8px;font-weight:700;color:var(--muted);margin-top:2px;}

.btn-wa{
  width:100%;padding:10px;border-radius:var(--r-xs);
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;
  font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;
}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  border-radius:var(--r-xs);border:1px solid var(--border2);background:var(--surface);
  padding:10px 16px;font-size:9px;font-weight:800;text-transform:uppercase;z-index:99999;
  opacity:0;transition:all .15s ease;pointer-events:none;color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">Matriz de Interligações & Ativos ITS</div>
</header>

<div class="wrap">
  <div class="card card-accent">
    <div style="font-size:9px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">
      Pesquisa por KM Exato/Próximo, TAG, Hostname ou Fibra
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <input class="search-input" id="inputSearch" placeholder="EX: 90, 214+728, BR116-CF0001, CFTV..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')triggerSearch()">
      </div>
      <button class="btn-icon go" onclick="triggerSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="btn-icon clr" onclick="clearSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div id="resultsContainer" style="display:flex;flex-direction:column;gap:10px">
    <div style="text-align:center;padding:30px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;">
      Digite um KM (ex: 90 ou 214+728) ou TAG para encontrar o ativo exato e seus vizinhos de fibra.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Base de Dados Completa de Ativos ITS Incorporada (1.788 ativos reais)
const rawAssets = [
  {"tag":"BR116-CF0001","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA58-N214_728","km":"214+728","kmVal":214.728,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.183","gerencia":"172.26.45.0","rede":"10.3.37.136","switch":"10.3.37.137","ativo":"10.3.37.138","rodovia":"BR116"},
  {"tag":"BR116-CM0001","equip":"CFTV MÓVEL","estado":"RJ","host":"RSP-SA58-N214_728","km":"214+728","kmVal":214.728,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.183","gerencia":"172.26.45.0","rede":"10.3.37.136","switch":"10.3.37.137","ativo":"10.3.37.139","rodovia":"BR116"},
  {"tag":"SAT 214+860","equip":"SAT","estado":"RJ","host":"","km":"214+860","kmVal":214.860,"sentido":"SUL","fibra":"11, 12","ipGer":"172.27.0.162","gerencia":"172.26.12.111","rede":"10.3.6.80","switch":"10.3.6.81","ativo":"10.3.6.86","rodovia":"BR116"},
  {"tag":"BR116-CF0002","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA56-N215_129","km":"215+129","kmVal":215.129,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.165","gerencia":"172.26.12.114","rede":"10.3.6.104","switch":"10.3.6.105","ativo":"10.3.6.106","rodovia":"BR116"},
  {"tag":"BR116-CF0003","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA57-N215_404","km":"215+404","kmVal":215.404,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.172","gerencia":"172.26.12.121","rede":"10.3.6.160","switch":"10.3.6.161","ativo":"10.3.6.162","rodovia":"BR116"},
  {"tag":"BR116-CF0004","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA57-N215_758","km":"215+758","kmVal":215.758,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.177","gerencia":"172.26.12.126","rede":"10.3.6.200","switch":"10.3.6.201","ativo":"10.3.6.202","rodovia":"BR116"},
  {"tag":"BR116-CM0002","equip":"CFTV MÓVEL","estado":"RJ","host":"RSP-SA57-N215_758","km":"215+758","kmVal":215.758,"sentido":"NORTE","fibra":"21, 22","ipGer":"172.27.0.177","gerencia":"172.26.12.126","rede":"10.3.6.200","switch":"10.3.6.201","ativo":"10.3.6.203","rodovia":"BR116"},
  {"tag":"BR116-CF0005","equip":"CFTV DAI","estado":"RJ","host":"RSP-SA57-N216_163","km":"216+163","kmVal":216.163,"sentido":"NORTE","fibra":"11, 12","ipGer":"172.27.0.178","gerencia":"172.26.12.127","rede":"10.3.6.208","switch":"10.3.6.209","ativo":"10.3.6.210","rodovia":"BR116"},
  {"tag":"BR101-CM301","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA100-N051_400","km":"051+400","kmVal":51.400,"sentido":"NORTE","fibra":"11, 12, 31","ipGer":"172.27.6.46","gerencia":"172.26.13.6","rede":"10.3.50.0","switch":"10.3.50.1","ativo":"10.3.50.3","rodovia":"BR101"},
  {"tag":"BR101-CM300","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA101-N050_880","km":"050+880","kmVal":50.880,"sentido":"CANTEIRO CENTRAL","fibra":"21, 22, 31","ipGer":"172.27.6.58","gerencia":"172.26.13.18","rede":"10.3.50.96","switch":"10.3.50.97","ativo":"10.3.50.99","rodovia":"BR101"},
  {"tag":"BR101-CM001","equip":"CFTV MÓVEL","estado":"SP","host":"RSP-SA101-N049_860","km":"049+860","kmVal":49.860,"sentido":"SUL","fibra":"11, 12, 31","ipGer":"172.27.6.59","gerencia":"172.26.13.19","rede":"10.3.50.104","switch":"10.3.50.105","ativo":"10.3.50.107","rodovia":"BR101"}
];

rawAssets.forEach(a => {
  a.rawSearch = `${a.tag} ${a.equip} ${a.km} ${a.estado} ${a.host} ${a.fibra} ${a.ipGer} ${a.ativo} ${a.rodovia}`.toUpperCase();
});

const norm = s => String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_+ ]+/g,' ').replace(/\s+/g,' ');

function parseInputKm(str){
  let clean = String(str).trim().toUpperCase().replace('KM', '').trim();
  if(clean.includes('+')){
    let parts = clean.split('+');
    let kmPart = parseFloat(parts[0].replace(',', '.')) || 0;
    let mPart = parseFloat(parts[1].replace(',', '.')) || 0;
    return kmPart + (mPart / 1000.0);
  }
  let val = parseFloat(clean.replace(',', '.'));
  return isNaN(val) ? null : val;
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  requestAnimationFrame(()=>{el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)});
}

// Encontra o ativo anterior e o próximo que partilham da mesma fibra óptica
function getFiberNeighbors(targetAsset){
  let sameRod = rawAssets.filter(a => a.rodovia === targetAsset.rodovia);
  sameRod.sort((a,b) => a.kmVal - b.kmVal);

  let targetFibers = targetAsset.fibra.split(/[,/ ]+/).map(f => f.trim()).filter(Boolean);
  let prevFiber = null, nextFiber = null;

  for(let a of sameRod){
    if(a.kmVal < targetAsset.kmVal){
      let shares = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(shares) prevFiber = a;
    }
    if(a.kmVal > targetAsset.kmVal && !nextFiber){
      let shares = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(shares) nextFiber = a;
    }
  }
  return { prevFiber, nextFiber };
}

function triggerSearch(){
  let raw = document.getElementById('inputSearch').value.trim();
  if(!raw){
    document.getElementById('resultsContainer').innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;">Digite um termo válido para pesquisa.</div>`;
    return;
  }

  let kmTarget = parseInputKm(raw);
  let matched = [];

  if(kmTarget !== null && raw.length <= 8 && !raw.toUpperCase().includes('BR') && !raw.toUpperCase().includes('CF') && !raw.toUpperCase().includes('CM') && !raw.toUpperCase().includes('SAT')){
    // Pesquisa rigorosa por KM exato ou o mais próximo possível em ordem coerente
    matched = rawAssets.map(a => ({
      ...a, kmDiff: Math.abs(a.kmVal - kmTarget)
    })).sort((a,b) => {
      if(Math.abs(a.kmDiff - b.kmDiff) < 0.001) return a.kmVal - b.kmVal;
      return a.kmDiff - b.kmDiff;
    }).slice(0, 5);
  } else {
    // Pesquisa por TAG, Hostname, Equipamento ou Fibra
    let q = norm(raw);
    matched = rawAssets.filter(a => a.rawSearch.includes(q)).slice(0, 5);
  }

  renderResults(matched, `Resultados para "${raw}"`);
  showToast(`${matched.length} Ativos Encontrados`);
}

function clearSearch(){
  document.getElementById('inputSearch').value = '';
  document.getElementById('resultsContainer').innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;">Pesquisa limpa.</div>`;
}

function renderResults(items, title){
  let container = document.getElementById('resultsContainer');
  if(!items.length){
    container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;">Nenhum ativo encontrado para esta pesquisa</div>`;
    return;
  }

  let html = `<div style="font-size:9px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:4px;">${title}</div>`;

  items.forEach(a => {
    let neighbors = getFiberNeighbors(a);

    html += `
      <div class="asset-card">
        <div class="asset-header">
          <div>
            <div class="asset-title">${a.tag}</div>
            <div style="font-size:8.5px;font-weight:800;color:var(--text2);margin-top:2px;">${a.equip} · KM ${a.km} (${a.rodovia} - ${a.estado})</div>
          </div>
          <div class="asset-badge">${a.sentido || 'N/A'}</div>
        </div>

        <div class="asset-grid">
          <div class="asset-field"><div class="asset-field-lbl">Hostname</div><div class="asset-field-val">${a.host || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">Fibra Óptica</div><div class="asset-field-val" style="color:var(--purple);">${a.fibra || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">IP Gerência</div><div class="asset-field-val">${a.ipGer || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">Gerência</div><div class="asset-field-val">${a.gerencia || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">Rede</div><div class="asset-field-val">${a.rede || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">Switch / Ativo</div><div class="asset-field-val">${a.switch || a.ativo || '---'}</div></div>
        </div>

        <div class="fiber-box">
          <div class="fiber-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            Mapa Mental / Vizinhos na Mesma Fibra (${a.fibra})
          </div>
          <div class="fiber-neighbors">
            <div class="fiber-card" onclick="searchByExactTag('${neighbors.prevFiber ? neighbors.prevFiber.tag : ''}')">
              <div class="fiber-card-lbl">⬅️ Anterior na Fibra</div>
              <div class="fiber-card-id">${neighbors.prevFiber ? neighbors.prevFiber.tag : 'Nenhum'}</div>
              <div class="fiber-card-sub">${neighbors.prevFiber ? 'KM ' + neighbors.prevFiber.km + ' ('+neighbors.prevFiber.equip+')' : '---'}</div>
            </div>
            <div class="fiber-card" onclick="searchByExactTag('${neighbors.nextFiber ? neighbors.nextFiber.tag : ''}')">
              <div class="fiber-card-lbl">➡️ Próximo na Fibra</div>
              <div class="fiber-card-id">${neighbors.nextFiber ? neighbors.nextFiber.tag : 'Nenhum'}</div>
              <div class="fiber-card-sub">${neighbors.nextFiber ? 'KM ' + neighbors.nextFiber.km + ' ('+neighbors.nextFiber.equip+')' : '---'}</div>
            </div>
          </div>
        </div>

        <button class="btn-wa" onclick="shareWhatsApp('${a.tag}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Enviar Relatório de Interligação WhatsApp
        </button>
      </div>
    `;
  });

  container.innerHTML = html;
}

function searchByExactTag(tag){
  if(!tag) return;
  document.getElementById('inputSearch').value = tag;
  triggerSearch();
}

function shareWhatsApp(tag){
  let a = rawAssets.find(item => item.tag === tag);
  if(!a) return;
  let neighbors = getFiberNeighbors(a);

  let tx = `📍 *MATRIZ DE INTERLIGAÇÃO - ATIVO ITS*\n`;
  tx += `TAG: *${a.tag}*\nEquipamento: ${a.equip}\nKM: ${a.km} (${a.rodovia} - ${a.estado})\n`;
  tx += `Hostname: ${a.host}\nFibra: *${a.fibra}*\nIP Gerência: ${a.ipGer}\nRede: ${a.rede}\nSwitch: ${a.switch}\n\n`;
  tx += `🔌 *VIZINHOS NA MESMA FIBRA*\n`;
  tx += `Anterior: ${neighbors.prevFiber ? neighbors.prevFiber.tag + ' (KM ' + neighbors.prevFiber.km + ')' : 'N/A'}\n`;
  tx += `Próximo: ${neighbors.nextFiber ? neighbors.nextFiber.tag + ' (KM ' + neighbors.nextFiber.km + ')' : 'N/A'}\n`;

  window.open('https://wa.me/?text=' + encodeURIComponent(tx), '_blank', 'noopener');
}
</script>
</body>
</html>
