<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <title>KM Report Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #07090c;
      --s1: #10141a;
      --s2: #171c24;
      --line: rgba(255,255,255,.1);
      --acc: #ffd600;
      --ok: #34d399;
      --bad: #ef4444;
      --tx: #f2f2f4;
      --mu: #8b8f98;
      --sb: max(env(safe-area-inset-bottom), 16px);
      --st: env(safe-area-inset-top, 0px);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    button,input,select{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

    .screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
    #start{align-items:center;justify-content:center;padding:calc(24px + var(--st)) 20px var(--sb);overflow-y:auto}
    .card{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
    .card h1{font-size:26px;letter-spacing:-.02em}.card p.sub{color:var(--mu);font-size:14px;line-height:1.5;margin-top:8px}
    .fld{margin-top:20px}.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
    .inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px}
    .btn{width:100%;min-height:50px;border-radius:14px;font-weight:800;font-size:15px;margin-top:12px;background:var(--s2);border:1px solid var(--line)}
    .btn.pri{background:var(--acc);color:#000;border-color:var(--acc)}
    .btn:active{transform:scale(.98)}
    .st{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu);margin-top:14px}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--dim,#555);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}

    #cam{flex-direction:column;background:#000}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hud{position:absolute;z-index:5;left:12px;top:calc(14px + var(--st));background:rgba(4,90,64,.8);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:8px 16px;max-width:72vw;transition:opacity .2s ease}
    .hud-line{display:flex;flex-direction:column;gap:2px}
    .hud small{display:block;font-size:11px;color:#bbf7d0}.hud b{font-size:26px;line-height:1.1}
    .hud .acc{font-size:11px;color:#bbf7d0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hud[hidden], .hud-line[hidden], .hud .acc[hidden]{display:none !important}

    .chip{position:absolute;z-index:5;top:calc(14px + var(--st));right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .pill{background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}
    .pill.rec{display:none;color:#fff;align-items:center;gap:7px}.pill.rec.on{display:flex}
    .pill.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:b 1s infinite}
    @keyframes b{50%{opacity:.15}}
    .lbl{width:170px;background:rgba(0,0,0,.65);border:1px solid rgba(255,214,0,.4);border-radius:12px;padding:8px 12px;font-size:13px}
    .bar{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:30px 16px var(--sb);background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-direction:column;gap:14px;align-items:center}
    body.clean .bar,body.clean .lbl{opacity:0;pointer-events:none}
    .modes{display:flex;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:22px;padding:3px}
    .modes button{padding:8px 16px;border-radius:18px;font-size:13px;font-weight:700;color:var(--mu)}
    .modes button[aria-pressed=true]{background:var(--acc);color:#000}
    .row{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
    .rb{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
    .rb svg{width:22px;height:22px}
    #shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
    #shut i{width:58px;height:58px;border-radius:50%;background:#fff;transition:all .15s}
    #shut.rec i{background:var(--bad);border-radius:14px;width:34px;height:34px}
    #snap{visibility:hidden}#snap.on{visibility:visible}

    #set{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
    #set.on{display:flex}#set .card{max-height:88vh;overflow-y:auto}
    .opts{display:grid;gap:8px;margin-top:10px}
    .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
    .opt input{width:18px;height:18px;accent-color:var(--acc)}

    #toast{position:fixed;z-index:30;left:50%;top:calc(70px + var(--st));transform:translate(-50%,-10px);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;transition:all .2s ease;pointer-events:none}
    #toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{color:#fca5a5;border-color:rgba(239,68,68,.4)}

    #map{position:absolute;z-index:4;left:12px;top:calc(150px + var(--st));width:118px;height:118px;border-radius:14px;border:1px solid var(--line);overflow:hidden;pointer-events:none;transition:opacity .2s ease}
    body.clean #map{opacity:0}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="start" class="screen on">
    <div class="card">
      <h1>KM Report Pro</h1>
      <p class="sub">Fotos, vídeos e relatórios em PDF com KM, data e GPS gravados na imagem.</p>
      <div class="fld"><label for="label">Etiqueta (opcional)</label><input id="label" class="inp" maxlength="80" placeholder="Ex.: Vistoria, Manutenção" autocomplete="off"></div>
      <button class="btn" id="pick">Escolher pasta de destino</button>
      <p class="st"><span class="dot" id="dDir"></span><span id="tDir">Sem pasta: os arquivos serão baixados.</span></p>
      <p class="st"><span class="dot" id="dKm"></span><span id="tKm">Carregando tabela de KM…</span></p>
      <button class="btn" id="csv" style="display:none">Carregar tabela de KM (.csv)</button>
      <input type="file" id="csvf" accept=".csv,text/csv" hidden>
      <button class="btn pri" id="go">Abrir câmera</button>
    </div>
  </main>

  <section id="cam" class="screen">
    <video id="v" autoplay playsinline muted></video>
    <div class="hud" id="hud">
      <div class="hud-line" id="rowKm"><small>KM atual</small><b id="km">KM ---</b></div>
      <div class="acc" id="gps">Aguardando GPS…</div>
      <div class="acc" id="spd"></div>
      <div class="acc" id="addr"></div>
      <div class="acc" id="ctx"></div>
    </div>
    <div id="map"></div>
    <div class="chip">
      <div class="pill rec" id="rec">Gravando</div>
      <input id="lbl" class="lbl" placeholder="Etiqueta" maxlength="80">
    </div>
    <div class="bar">
      <div class="modes" role="group" aria-label="Modo">
        <button data-m="foto" aria-pressed="true">Foto</button>
        <button data-m="video" aria-pressed="false">Vídeo</button>
        <button data-m="pdf" aria-pressed="false">Relatório PDF</button>
      </div>
      <div class="row">
        <button class="rb" id="gear" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
            <circle cx="16" cy="7" r="2.5"/>
            <circle cx="7" cy="17" r="2.5"/>
          </svg>
        </button>
        <button id="shut" aria-label="Capturar"><i></i></button>
        <button class="rb" id="snap" aria-label="Foto avulsa em JPG">JPG</button>
      </div>
      <button class="pill" id="back">Voltar</button>
    </div>
  </section>

  <div id="set">
    <div class="card">
      <h1 style="font-size:20px">Ajustes</h1>
      <p class="sub">Selecione quais dados aparecem no HUD. Por padrão, o KM fica ativo e os demais são opcionais.</p>
      <div class="opts">
        <label class="opt"><span>KM atual</span><input type="checkbox" data-field="km" checked></label>
        <label class="opt"><span>GPS</span><input type="checkbox" data-field="gps"></label>
        <label class="opt"><span>Velocidade</span><input type="checkbox" data-field="speed"></label>
        <label class="opt"><span>Endereço</span><input type="checkbox" data-field="address"></label>
        <label class="opt"><span>Contexto</span><input type="checkbox" data-field="context"></label>
        <label class="opt"><span>Mapa</span><input type="checkbox" data-field="map"></label>
      </div>
      <button class="btn pri" id="closeSet">Salvar</button>
    </div>
  </div>

  <div id="toast" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'km-report-pro-settings-v1';
    const DEFAULT_FIELDS = { km: true, gps: false, speed: false, address: false, context: false, map: false };

    const hud = document.getElementById('hud');
    const kmEl = document.getElementById('km');
    const gpsEl = document.getElementById('gps');
    const spdEl = document.getElementById('spd');
    const addrEl = document.getElementById('addr');
    const ctxEl = document.getElementById('ctx');
    const rowKmEl = document.getElementById('rowKm');
    const mapWrap = document.getElementById('map');
    const settingsPanel = document.getElementById('set');
    const toast = document.getElementById('toast');

    let kmTable = [];
    let map = null;
    let marker = null;
    let currentPosition = null;
    let lastAddress = '';
    let watchId = null;
    let lastCsvUrl = null;

    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.classList.toggle('err', isError);
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return { ...DEFAULT_FIELDS, ...saved };
      } catch (e) {
        return { ...DEFAULT_FIELDS };
      }
    }

    function saveSettings(fields) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fields));
    }

    function applySettings(fields) {
      const checkboxes = document.querySelectorAll('[data-field]');
      checkboxes.forEach(cb => {
        const key = cb.dataset.field;
        cb.checked = !!fields[key];
      });

      const visible = Object.entries(fields).filter(([k, v]) => v && k !== 'map').map(([k]) => k)
      const hasAny = visible.length > 0;

      rowKmEl.hidden = !fields.km;
      gpsEl.hidden = !fields.gps;
      spdEl.hidden = !fields.speed;
      addrEl.hidden = !fields.address;
      ctxEl.hidden = !fields.context;

      if (fields.map && mapWrap) {
        mapWrap.style.display = 'block';
      } else if (mapWrap) {
        mapWrap.style.display = 'none';
      }

      if (!hasAny && !fields.map) {
        hud.hidden = true;
      } else {
        hud.hidden = false;
      }

      if (fields.map) {
        if (!map) {
          initMap();
        }
      }
    }

    function setFieldDisplay(field, display) {
      const target = {
        km: rowKmEl,
        gps: gpsEl,
        speed: spdEl,
        address: addrEl,
        context: ctxEl,
        map: mapWrap
      }[field];
      if (!target) return;
      target.hidden = !display;
    }

    function initMap() {
      if (!window.L) return;
      if (!map) {
        map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);
        marker = L.circleMarker([0,0], { radius: 8, color: '#ffd600', fillColor: '#ffd600', fillOpacity: 1 }).addTo(map);
        map.setView([0, 0], 2);
      }
    }

    function setMapCenter(lat, lon) {
      if (!map || !marker) return;
      map.setView([lat, lon], 15, { animate: true, duration: 0.8 });
      marker.setLatLng([lat, lon]);
    }

    function normalizeHeader(value) {
      return String(value || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
    }

    function parseNumber(value) {
      if (value === null || value === undefined) return null;
      const text = String(value).trim();
      if (!text) return null;
      const clean = text.replace(/\./g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
      const num = Number(clean);
      return Number.isFinite(num) ? num : null;
    }

    function parseCsvTable(text) {
      if (!text || !text.trim()) return [];
      const textNoBom = text.replace(/^\uFEFF/, '');
      const lines = textNoBom.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (lines.length < 2) return [];
      const delimiter = lines[0].includes(';') ? ';' : ',';
      const headers = lines[0].split(delimiter).map(normalizeHeader);
      const kmIndex = headers.findIndex(h => ['km','kilometragem','odometro','odometrokm','kmatual'].includes(h));
      const latIndex = headers.findIndex(h => ['lat','latitude','latitud'].includes(h));
      const lonIndex = headers.findIndex(h => ['lon','lng','long','longitude','longitud'].includes(h));
      if (kmIndex < 0 || latIndex < 0 || lonIndex < 0) return [];

      const rows = [];
      lines.slice(1).forEach(line => {
        const cols = line.split(delimiter).map(v => v.trim());
        if (cols.length <= Math.max(kmIndex, latIndex, lonIndex)) return;
        const km = parseNumber(cols[kmIndex]);
        const lat = parseNumber(cols[latIndex]);
        const lon = parseNumber(cols[lonIndex]);
        if (km === null || lat === null || lon === null) return;
        rows.push({ km, lat, lon });
      });
      return rows.sort((a, b) => a.km - b.km);
    }

    function estimateKmFromPosition(lat, lon) {
      if (!Array.isArray(kmTable) || !kmTable.length) return null;
      let best = null;
      let bestDist = Infinity;
      for (const row of kmTable) {
        const d = Math.hypot(row.lat - lat, row.lon - lon) * 111000;
        if (d < bestDist) { bestDist = d; best = row; }
      }
      return best && bestDist < 5000 ? best.km : null;
    }

    function getKmCsvUrl() {
      const candidates = [
        './SNVBR116SPRJ.csv',
        'SNVBR116SPRJ.csv',
        'https://raw.githubusercontent.com/cpsXampi/tec/main/SNVBR116SPRJ.csv',
        'https://github.com/cpsXampi/tec/raw/main/SNVBR116SPRJ.csv'
      ];
      return candidates;
    }

    async function loadKmCsv() {
      const dots = document.getElementById('dKm');
      const textEl = document.getElementById('tKm');
      dots.classList.remove('ok','bad');
      textEl.textContent = 'Carregando tabela de KM…';

      let lastError = null;
      for (const url of getKmCsvUrl()) {
        try {
          const response = await fetch(url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const text = await response.text();
          const rows = parseCsvTable(text);
          if (!rows.length) throw new Error('CSV sem colunas válidas');
          kmTable = rows;
          lastCsvUrl = url;
          dots.classList.add('ok');
          textEl.textContent = 'Tabela de KM carregada com sucesso.';
          showToast('Tabela de KM carregada');
          return true;
        } catch (err) {
          lastError = err;
        }
      }

      dots.classList.add('bad');
      textEl.textContent = 'Não foi possível carregar a tabela de KM.';
      showToast('Erro ao carregar CSV do KM', true);
      console.error('Erro ao carregar KM CSV:', lastError);
      return false;
    }

    function formatKm(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'KM ---';
      return `KM ${Number(value).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}`;
    }

    function formatSpeed(speedMps) {
      if (speedMps === null || speedMps === undefined || Number.isNaN(Number(speedMps))) return '';
      const kmh = speedMps * 3.6;
      return `${kmh.toFixed(0)} km/h`;
    }

    function refreshKmFromPosition(lat, lon) {
      if (kmTable.length) {
        const nearest = estimateKmFromPosition(lat, lon);
        if (nearest !== null) {
          kmEl.textContent = formatKm(nearest);
          return;
        }
      }
      kmEl.textContent = 'KM ---';
    }

    async function reverseGeocode(lat, lon) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`, {
          headers: { 'Accept-Language': 'pt-BR' }
        });
        if (!response.ok) return '';
        const json = await response.json();
        return json.display_name || '';
      } catch (e) {
        return '';
      }
    }

    function updateHudByPosition(position) {
      currentPosition = position;
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const speed = position.coords.speed;
      gpsEl.textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      if (speed !== null) spdEl.textContent = formatSpeed(speed);
      refreshKmFromPosition(lat, lon);
      setMapCenter(lat, lon);
      if (window.L && map) {
        map.invalidateSize();
      }

      if (lastAddress === '') {
        reverseGeocode(lat, lon).then(address => {
          if (address) {
            lastAddress = address;
            addrEl.textContent = address;
          }
        });
      }
    }

    function setupGeolocation() {
      if (!navigator.geolocation) {
        gpsEl.textContent = 'GPS não suportado';
        return;
      }

      const onSuccess = (position) => {
        updateHudByPosition(position);
      };

      const onError = () => {
        gpsEl.textContent = 'GPS indisponível';
      };

      if (watchId) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const settings = loadSettings();
      applySettings(settings);

      const allToggles = document.querySelectorAll('[data-field]');
      allToggles.forEach(cb => {
        cb.addEventListener('change', () => {
          const fields = loadSettings();
          fields[cb.dataset.field] = !!cb.checked;
          saveSettings(fields);
          applySettings(fields);
        });
      });

      document.getElementById('closeSet').addEventListener('click', () => {
        const fields = {};
        document.querySelectorAll('[data-field]').forEach(cb => fields[cb.dataset.field] = !!cb.checked);
        saveSettings(fields);
        applySettings(fields);
        settingsPanel.classList.remove('on');
      });

      document.getElementById('gear').addEventListener('click', () => {
        settingsPanel.classList.add('on');
      });

      document.getElementById('set').addEventListener('click', (event) => {
        if (event.target === settingsPanel) settingsPanel.classList.remove('on');
      });

      document.getElementById('back').addEventListener('click', () => {
        document.getElementById('cam').classList.remove('on');
        document.getElementById('start').classList.add('on');
        if (v && v.srcObject) {
          v.srcObject.getTracks().forEach(track => track.stop());
          v.srcObject = null;
        }
      });

      document.getElementById('go').addEventListener('click', async () => {
        const startScreen = document.getElementById('start');
        const camScreen = document.getElementById('cam');
        startScreen.classList.remove('on');
        camScreen.classList.add('on');

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          const v = document.getElementById('v');
          v.srcObject = stream;
          await v.play();
        } catch (e) {
          showToast('Câmera não disponível', true);
          console.error(e);
        }

        setupGeolocation();
        await loadKmCsv();
      });

      document.getElementById('pick').addEventListener('click', async () => {
        const applyDir = (dirHandle) => {
          if (!dirHandle) return;
          window.__destDir = dirHandle;
          document.getElementById('dDir').classList.add('ok');
          document.getElementById('tDir').textContent = 'Pasta de destino selecionada.';
        };

        if ('showDirectoryPicker' in window) {
          try {
            const dir = await window.showDirectoryPicker();
            applyDir(dir);
          } catch (e) {
            document.getElementById('dDir').classList.add('bad');
            document.getElementById('tDir').textContent = 'Seleção cancelada. Os arquivos serão baixados.';
          }
        } else {
          document.getElementById('dDir').classList.add('bad');
          document.getElementById('tDir').textContent = 'Navegador sem suporte à pasta. Os arquivos serão baixados.';
        }
      });

      const modeButtons = document.querySelectorAll('[data-m]');
      modeButtons.forEach(button => {
        button.addEventListener('click', () => {
          modeButtons.forEach(btn => btn.setAttribute('aria-pressed', String(btn === button)));
        });
      });

      document.getElementById('csv').addEventListener('click', () => {
        document.getElementById('csvf').click();
      });

      document.getElementById('csvf').addEventListener('change', async (event) => {
        const [file] = event.target.files;
        if (!file) return;
        try {
          const text = await file.text();
          const rows = parseCsvTable(text);
          if (!rows.length) {
            showToast('CSV sem campos válidos.', true);
            return;
          }
          kmTable = rows;
          document.getElementById('dKm').classList.add('ok');
          document.getElementById('tKm').textContent = `Tabela carregada: ${file.name}`;
          showToast('Tabela de KM carregada pelo arquivo local');
        } catch (e) {
          showToast('Não foi possível ler o CSV.', true);
        }
      });

      const v = document.getElementById('v');
      document.getElementById('shut').addEventListener('click', () => {
        const mode = document.querySelector('[data-m][aria-pressed="true"]')?.dataset.m || 'foto';
        if (mode === 'video') {
          document.getElementById('rec').classList.toggle('on');
          document.getElementById('shut').classList.toggle('rec');
          return;
        }

        if (mode === 'pdf') {
          const doc = new window.jspdf.jsPDF();
          doc.setFillColor(7, 9, 12);
          doc.rect(0, 0, 210, 297, 'F');
          doc.setTextColor(255,255,255);
          doc.setFontSize(24);
          doc.text('KM Report Pro', 14, 22);
          doc.setFontSize(12);
          doc.text('KM: ' + (kmEl.textContent || 'KM ---'), 14, 42);
          doc.text('GPS: ' + (gpsEl.textContent || 'Aguardando GPS…'), 14, 56);
          doc.text('Endereço: ' + (addrEl.textContent || '—'), 14, 70);
          doc.text('Velocidade: ' + (spdEl.textContent || '—'), 14, 84);
          doc.text('Contexto: ' + (ctxEl.textContent || '—'), 14, 98);
          doc.save('relatorio-km.pdf');
          showToast('PDF gerado');
          return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth || 1280;
        canvas.height = v.videoHeight || 720;
        const context = canvas.getContext('2d');
        context.drawImage(v, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = 'foto-'+Date.now()+'.jpg';
        link.click();
        showToast('Foto salva');
      });

      document.getElementById('snap').addEventListener('click', () => {
        const v = document.getElementById('v');
        if (!v || !v.videoWidth) return;
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        const url = canvas.toDataURL('image/jpeg', 0.9);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'km-jpg-' + Date.now() + '.jpg';
        a.click();
      });

      if (window.location.protocol === 'file:') {
        document.getElementById('dKm').classList.add('bad');
        document.getElementById('tKm').textContent = 'Arquivo aberto localmente. Use um servidor para carregar a tabela automaticamente.';
      }
    });
  </script>
</body>
</html>
