<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>KM Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --bg:#05080c;
  --bg2:#0d1117;
  --panel:#101821;
  --panel-2:#151e2a;
  --line:rgba(255,255,255,.12);
  --line-strong:rgba(255,214,0,.38);
  --acc:#ffd54a;
  --acc-2:#f5b700;
  --ok:#3ddc97;
  --bad:#ef4444;
  --tx:#f5f7fb;
  --muted:#a5afbd;
  --shadow:0 18px 40px rgba(0,0,0,.34);
  --sb:max(env(safe-area-inset-bottom),16px);
  --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(circle at top, #0f1724 0%, #070a0f 42%, #05080c 100%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
#start{align-items:center;justify-content:center;padding:calc(24px + var(--st)) 20px var(--sb);overflow-y:auto}
.card{width:100%;max-width:420px;background:linear-gradient(180deg, rgba(16,24,33,.96), rgba(11,16,23,.96));border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:var(--shadow)}
.card h1{font-size:26px;letter-spacing:-.02em}.card p.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px}
.fld{margin-top:20px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:rgba(6,10,14,.9);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px}
.btn{width:100%;min-height:50px;border-radius:14px;font-weight:800;font-size:15px;margin-top:12px;background:linear-gradient(180deg, rgba(30,38,48,.96), rgba(17,22,29,.96));border:1px solid var(--line)}
.btn.pri{background:linear-gradient(180deg, #ffd54a, #f4bd00);color:#111;border-color:rgba(255,214,0,.38)}
.btn:active{transform:scale(.98)}
.st{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#515b69;flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--tx)}
.check input{accent-color:var(--acc);width:16px;height:16px}
#cam{flex-direction:column;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:absolute;z-index:5;left:18px;top:calc(18px + var(--st));max-width:min(82vw,340px)}
.hud .panel{background:linear-gradient(180deg, rgba(7,13,18,.72), rgba(7,13,18,.42));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 14px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.hud small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b7efcd}.hud b{display:block;margin-top:4px;font-size:30px;line-height:1.1;color:#fff}
.hud .acc{font-size:11px;color:#dceaf8;margin-top:5px;opacity:.94}
.chip{position:absolute;z-index:5;top:calc(18px + var(--st));right:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}
.pill.rec{display:none;color:#fff;align-items:center;gap:7px}.pill.rec.on{display:flex}
.pill.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:b 1s infinite}@keyframes b{50%{opacity:.15}}
.lbl{width:170px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,214,0,.4);border-radius:12px;padding:8px 12px;font-size:13px}
.bar{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:30px 16px var(--sb);background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.8));display:flex;flex-direction:column;gap:14px;align-items:center}
body.clean .bar,body.clean .lbl{opacity:0;pointer-events:none}
.modes{display:flex;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:22px;padding:3px}
.modes button{padding:8px 16px;border-radius:18px;font-size:13px;font-weight:700;color:var(--muted)}
.modes button[aria-pressed=true]{background:linear-gradient(180deg, var(--acc), var(--acc-2));color:#101010}
.row{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
.rb{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.rb svg{width:22px;height:22px}
#shut{width:78px;height:78px;border-radius:50%;border:4px solid rgba(255,255,255,.9);display:grid;place-items:center;background:rgba(22,24,29,.34)}
#shut i{width:58px;height:58px;border-radius:50%;background:#fff;transition:all .15s}
#shut.rec i{background:var(--bad);border-radius:14px;width:34px;height:34px}
#snap{visibility:hidden}#snap.on{visibility:visible}
#set{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
#set.on{display:flex}#set .card{max-height:88vh;overflow-y:auto;max-width:520px}
#toast{position:fixed;z-index:30;left:50%;top:calc(70px + var(--st));transform:translate(-50%,-10px);background:rgba(16,24,33,.96);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{color:#fca5a5;border-color:rgba(239,68,68,.4)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="start" class="screen on">
  <div class="card">
    <h1>KM Report</h1>
    <p class="sub">Fotos, vídeos e relatórios em PDF com KM, data, GPS, endereço, clima e marca d'água configuráveis.</p>
    <div class="fld"><label for="label">Etiqueta (opcional)</label><input id="label" class="inp" maxlength="80" placeholder="Ex.: Vistoria, Manutenção" autocomplete="off"></div>
    <div class="fld"><label for="company">Cliente / local (opcional)</label><input id="company" class="inp" maxlength="80" placeholder="Ex.: Empresa ABC, Rodovia SP-123" autocomplete="off"></div>
    <button class="btn" id="pick">Escolher pasta de destino</button>
    <p class="st"><span class="dot" id="dDir"></span><span id="tDir">Sem pasta: os arquivos serão baixados.</span></p>
    <p class="st"><span class="dot" id="dKm"></span><span id="tKm">Carregando tabela de KM…</span></p>
    <button class="btn" id="csv" style="display:none">Carregar tabela de KM (.csv)</button>
    <input type="file" id="csvf" accept=".csv,text/csv" hidden>
    <button class="btn pri" id="go">Abrir câmera</button>
  </div>
</main>

<section id="cam" class="screen">
  <video id="v" autoplay playsinline muted></video>
  <div class="hud">
    <div class="panel">
      <small>KM atual</small>
      <b id="km">KM ---</b>
      <div class="acc" id="gps">Aguardando GPS…</div>
      <div class="acc" id="addr">Aguardando endereço…</div>
      <div class="acc" id="weather">Aguardando clima…</div>
    </div>
  </div>
  <div class="chip">
    <div class="pill rec" id="rec">Gravando</div>
    <input id="lbl" class="lbl" placeholder="Etiqueta" maxlength="80">
  </div>
  <div class="bar">
    <div class="modes" role="group" aria-label="Modo">
      <button data-m="foto" aria-pressed="true">Foto</button>
      <button data-m="video" aria-pressed="false">Vídeo</button>
      <button data-m="pdf" aria-pressed="false">Relatório PDF</button>
    </div>
    <div class="row">
      <button class="rb" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="15" cy="7" r="3"/><circle cx="7" cy="17" r="3"/></svg></button>
      <button id="shut" aria-label="Capturar"><i></i></button>
      <button class="rb" id="snap" aria-label="Foto avulsa em JPG">JPG</button>
    </div>
    <button class="pill" id="back">Voltar</button>
  </div>
</section>

<div id="set">
  <div class="card">
    <h1 style="font-size:20px">Ajustes</h1>
    <div class="fld"><label for="camSel">Câmera</label><select id="camSel" class="inp"></select></div>
    <div class="fld"><label for="int">Intervalo entre fotos do relatório (ms)</label><input id="int" class="inp" type="number" min="100" step="50" value="200"></div>
    <div class="fld"><label for="lote">Fotos por PDF</label><input id="lote" class="inp" type="number" min="1" max="500" value="150"></div>
    <div class="fld"><label>Elementos visíveis na tela</label><div class="check-grid"><label class="check"><input type="checkbox" id="showKm" checked> KM</label><label class="check"><input type="checkbox" id="showGps" checked> GPS</label><label class="check"><input type="checkbox" id="showDate" checked> Data/Hora</label><label class="check"><input type="checkbox" id="showLabel" checked> Etiqueta</label><label class="check"><input type="checkbox" id="showAddress" checked> Endereço</label><label class="check"><input type="checkbox" id="showWeather" checked> Clima</label><label class="check"><input type="checkbox" id="showCompanyInfo" checked> Cliente / local</label></div></div>
    <div class="fld"><label>Onde aplicar as marcas</label><div class="check-grid"><label class="check"><input type="checkbox" id="photoOverlay" checked> Fotos</label><label class="check"><input type="checkbox" id="videoOverlay" checked> Vídeos</label><label class="check"><input type="checkbox" id="pdfOverlay" checked> PDF</label></div></div>
    <button class="btn pri" id="closeSet">Fechar</button>
  </div>
</div>
<div id="toast" role="status"></div>
<canvas id="c" hidden></canvas>

<script>
const $=id=>document.getElementById(id);
const defaultCfg={label:'',company:'',int:200,lote:150,showKm:true,showGps:true,showDate:true,showLabel:true,showAddress:true,showWeather:true,showCompanyInfo:true,photoOverlay:true,videoOverlay:true,pdfOverlay:true};
const S={db:[],km:'---',lat:0,lon:0,acc:null,dir:null,stream:null,mode:'foto',cap:false,rec:null,chunks:[],buf:[],batch:1,queue:[],busy:false,saved:0,timer:null,lock:null,tt:0,addr:'',weather:'',lastAddrFetch:0,lastWeatherFetch:0};
const cv=$('c'),cx=cv.getContext('2d',{alpha:false});
const cfg=Object.assign({},defaultCfg,JSON.parse(localStorage.getItem('kmr')||'{}'));
['label','company','int','lote'].forEach(k=>{if(cfg[k]!==undefined&&cfg[k]!==null)$(k).value=cfg[k];});
Object.keys(defaultCfg).forEach(k=>{if((k.startsWith('show')||k.endsWith('Overlay'))){const el=$(k);if(el&&cfg[k]!==undefined)el.checked=!!cfg[k];}});
function persist(){try{localStorage.setItem('kmr', JSON.stringify({label:$('label').value,company:$('company').value,int:$('int').value,lote:$('lote').value,showKm:$('showKm').checked,showGps:$('showGps').checked,showDate:$('showDate').checked,showLabel:$('showLabel').checked,showAddress:$('showAddress').checked,showWeather:$('showWeather').checked,showCompanyInfo:$('showCompanyInfo').checked,photoOverlay:$('photoOverlay').checked,videoOverlay:$('videoOverlay').checked,pdfOverlay:$('pdfOverlay').checked}))}catch(e){}}
['label','company','int','lote'].forEach(k=>$(k).addEventListener('input',persist));
['showKm','showGps','showDate','showLabel','showAddress','showWeather','showCompanyInfo','photoOverlay','videoOverlay','pdfOverlay'].forEach(k=>$(k).addEventListener('change',persist));
$('lbl').value=$('label').value;$('lbl').oninput=e=>{$('label').value=e.target.value;persist()};
function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');t.classList.add('show');if(err)t.classList.add('err');clearTimeout(S.tt);S.tt=setTimeout(()=>t.className='',3000);}
const pad=n=>String(n).padStart(2,'0');
const stamp=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
const safe=s=>String(s ?? '').replace(/[\\/\\:*?\"<>|,]/g,'_').trim();
const num=v=>{const s=String(v??'').trim();return /,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
const col=(h,c)=>{const m=h.map(s=>s.trim().toLowerCase());for(const x of c){const i=m.indexOf(x);if(i>=0)return i}return -1};
function parseCsv(t){if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);const L=t.split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];const sep=L[0].includes(';')?';':',';const h=L.shift().split(sep);const a=col(h,['km']),b=col(h,['lat','latitude']),c=col(h,['lon','long','longitude']);return L.map(l=>{const r=l.split(sep);return{km:num(r[a]),lat:num(r[b]),lon:num(r[c])}}).filter(p=>[p.km,p.lat,p.lon].every(Number.isFinite));}
function kmStatus(){const ok=S.db.length>0;$('dKm').className='dot '+(ok?'ok':'bad');$('tKm').textContent=ok?`Tabela de KM: ${S.db.length.toLocaleString('pt-BR')} pontos.`:'Tabela de KM não encontrada. Use .csv manualmente.';}
fetch('SNVBR116SPRJ.csv?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{S.db=parseCsv(t)}).catch(()=>{}).finally(kmStatus);
$('csv').onclick=()=>$('csvf').click();
$('csvf').onchange=async e=>{const f=e.target.files[0];if(f){S.db=parseCsv(await f.text());kmStatus();}};
function nearest(la,lo){const k=Math.cos(la*Math.PI/180);let best=null,m=1e9;for(const p of S.db){const d=(p.lat-la)**2+((p.lon-lo)*k)**2;if(d<m){m=d;best=p}}return best&&{km:best.km,dist:Math.sqrt(m)*111320};}
function updateKmLabel(){if(S.db.length){const n=nearest(S.lat,S.lon);if(n){S.km=(Math.round(n.km*100)/100).toFixed(2).replace('.',',');$('km').textContent='KM '+S.km;$('gps').textContent=`GPS ±${Math.round(S.acc||0)} m`+(n.dist>500?' · longe da rodovia':'');}else{$('km').textContent='KM ---';$('gps').textContent=`GPS ±${Math.round(S.acc||0)} m`;}}else{$('km').textContent='KM ---';}}
async function fetchAddress(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;try{const resp=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=pt-BR`,{headers:{'Accept-Language':'pt-BR'}});if(!resp.ok)throw new Error('Nominatim falhou');const data=await resp.json();const a=data.address||{};const list=[a.road,a.neighbourhood,a.suburb,a.city||a.town||a.village,a.state,a.country].filter(Boolean);S.addr=list.slice(0,4).join(', ')||'Coordenadas disponíveis';}catch(e){S.addr='Endereço indisponível';}}
async function fetchWeather(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;try{const resp=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto&forecast_days=1`);if(!resp.ok)throw new Error('Open-Meteo falhou');const data=await resp.json();const w=data.current;const map={0:'Limpo',1:'Parcialmente nublado',2:'Nublado',3:'Encoberto',45:'Nevoeiro',48:'Nevoeiro com gelo',51:'Garoa leve',53:'Garoa',55:'Garoa forte',56:'Gelo leve',57:'Gelo forte',61:'Chuva fraca',63:'Chuva',65:'Chuva forte',66:'Chuva gelada',67:'Chuva gelada forte',71:'Neve leve',73:'Neve',75:'Neve forte',77:'Granizo',80:'Pancadas leves',81:'Pancadas',82:'Pancadas fortes',85:'Neve leve',86:'Neve forte',95:'Trovoada',96:'Trovoada com granizo',99:'Trovoada severa'};const temp=w?.temperature_2m ?? '--';const hum=w?.relative_humidity_2m ?? '--';const wind=w?.wind_speed_10m ?? '--';S.weather=`${map[w?.weather_code] || 'Clima'} · ${temp}°C · ${wind} km/h · ${hum}%`;}catch(e){S.weather='Clima indisponível';}}
function refreshMetaText(){const showKm=$('showKm').checked;const showGps=$('showGps').checked;const showAddress=$('showAddress').checked;const showWeather=$('showWeather').checked;const kmText=showKm&&S.km!=='---'?'KM '+S.km:'KM oculto';if(showKm){$('km').textContent=kmText==='KM oculto'?'KM ---':kmText;}$('gps').textContent = showGps ? (`GPS ±${Math.round(S.acc||0)} m`) : 'GPS oculto';$('addr').textContent = showAddress ? (S.addr || 'Aguardando endereço…') : 'Endereço oculto';$('weather').textContent = showWeather ? (S.weather || 'Aguardando clima…') : 'Clima oculto';if(!showGps&&!showAddress&&!showWeather){$('gps').textContent='Metadados ocultos';}}
if('geolocation' in navigator){navigator.geolocation.watchPosition(async p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;S.acc=p.coords.accuracy;updateKmLabel();refreshMetaText();const now=Date.now();if(now-S.lastAddrFetch>20000){S.lastAddrFetch=now;await fetchAddress(S.lat,S.lon);}if(now-S.lastWeatherFetch>60000){S.lastWeatherFetch=now;await fetchWeather(S.lat,S.lon);}refreshMetaText();},()=>{$('gps').textContent='GPS indisponível';S.addr='Endereço indisponível';S.weather='Clima indisponível';refreshMetaText();},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});}else{$('gps').textContent='GPS indisponível';}
if(!('showDirectoryPicker' in window))$('pick').style.display='none';
$('pick').onclick=async()=>{try{const d=await showDirectoryPicker({mode:'readwrite'});if(await d.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Permissão negada');S.dir=d;$('dDir').className='dot ok';$('tDir').textContent='Pasta: '+d.name;}catch(e){if(e.name!=='AbortError')toast(e.message,1)}};
async function save(blob,name){name=safe(name);if(S.dir){try{const w=await(await S.dir.getFileHandle(name,{create:true})).createWritable();await w.write(blob);await w.close();toast('Salvo: '+name);return true}catch(e){console.error(e);toast('Falha na pasta, baixando arquivo',1)}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Baixado: '+name);return true;}
async function openCam(id){S.stream?.getTracks().forEach(t=>t.stop());S.stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id}}:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});$('v').srcObject=S.stream;const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const cur=S.stream.getVideoTracks()[0].getSettings().deviceId;$('camSel').innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label||'Câmera '+(i+1)}</option>`).join('');}
$('camSel').onchange=e=>openCam(e.target.value).catch(()=>toast('Erro ao trocar câmera',1));
$('go').onclick=async()=>{try{await openCam();$('lbl').value=$('label').value;$('start').classList.remove('on');$('cam').classList.add('on');document.documentElement.requestFullscreen?.().catch(()=>{});pinchZoom();}catch(e){toast('Não foi possível acessar a câmera: '+e.message,1)}};
function pinchZoom(){const v=$('v');let d0=0,z0=1;v.ontouchstart=e=>{if(e.touches.length===2){d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);z0=S.stream.getVideoTracks()[0].getSettings().zoom||1}};v.ontouchmove=e=>{const t=S.stream.getVideoTracks()[0],c=t.getCapabilities?.()||{};if(e.touches.length===2&&d0&&c.zoom){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);t.applyConstraints({advanced:[{zoom:Math.min(c.zoom.max,Math.max(c.zoom.min,z0*d/d0))}]}).catch(()=>{})}}}
$('gear').onclick=()=>$('set').classList.add('on');
$('closeSet').onclick=()=>$('set').classList.remove('on');
$('back').onclick=()=>{if(S.cap||S.rec||S.busy||S.queue.length)return toast('Finalize a captura antes de voltar',1);S.stream?.getTracks().forEach(t=>t.stop());$('cam').classList.remove('on');$('start').classList.add('on');document.fullscreenElement&&document.exitFullscreen();};
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{if(S.cap||S.rec)return toast('Finalize a captura antes de trocar o modo',1);S.mode=b.dataset.m;document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
function drawPanel(x,y,w,h,r,fill,stroke){cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.quadraticCurveTo(x+w,y,x+w,y+r);cx.lineTo(x+w,y+h-r);cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);cx.quadraticCurveTo(x,y+h,x,y+h-r);cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);cx.closePath();cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke();}}
function clampText(t,max){return t.length>max?t.slice(0,max-1)+'…':t;}
function frame(){const v=$('v');if(!v.videoWidth)return null;const w=cv.width=v.videoWidth,h=cv.height=v.videoHeight;cx.clearRect(0,0,w,h);cx.drawImage(v,0,0,w,h);const showKm=$('showKm').checked,showGps=$('showGps').checked,showDate=$('showDate').checked,showLabel=$('showLabel').checked,showAddress=$('showAddress').checked,showWeather=$('showWeather').checked,showCompanyInfo=$('showCompanyInfo').checked;const labelText=$('label').value.trim(),companyText=$('company').value.trim();
  const pX=18,pY=18,pW=Math.min(260,w*0.46),pH=92;if(showKm){drawPanel(pX,pY,pW,pH,18,'rgba(7,12,18,.58)','rgba(255,255,255,.12)');cx.fillStyle='rgba(181,250,210,.82)';cx.font='700 11px Arial';cx.textAlign='left';cx.textBaseline='middle';cx.fillText('KM ATUAL',pX+18,pY+18);cx.fillStyle='#ffd54a';cx.font=`700 ${Math.min(38,h*0.045)}px Arial`;cx.fillText(S.km==='---'?'---':S.km,pX+18,pY+54);}
  const tagLines=[];if(showLabel&&labelText)tagLines.push(labelText);if(showCompanyInfo&&companyText)tagLines.push(companyText);if(tagLines.length){const boxW=Math.min(330,w*0.52),boxH=Math.min(90, 20 + tagLines.length*18 + 12);const boxX=w-boxW-18,boxY=18;drawPanel(boxX,boxY,boxW,boxH,16,'rgba(9,13,18,.62)','rgba(255,214,0,.28)');cx.fillStyle='rgba(255,255,255,.9)';cx.font='700 12px Arial';cx.textAlign='right';cx.textBaseline='middle';tagLines.forEach((line,i)=>{const txt=clampText(line,39);cx.fillText(txt,boxX+boxW-12,boxY+22+i*18);});}
  const info=[];if(showDate)info.push(`Data: ${new Date().toLocaleString('pt-BR')}`);if(showGps)info.push(Number.isFinite(S.lat)&&Number.isFinite(S.lon)?`GPS: ${S.lat.toFixed(6)}, ${S.lon.toFixed(6)}`:'GPS: ---');if(showAddress&&S.addr)info.push(S.addr);if(showWeather&&S.weather)info.push(S.weather);
  if(info.length){const infoX=18,infoY=h-126,infoW=Math.min(w-36, 720),infoH=Math.min(110, 18 + info.length*18 + 12);drawPanel(infoX,infoY,infoW,infoH,18,'rgba(8,12,17,.52)','rgba(255,255,255,.12)');cx.fillStyle='rgba(255,255,255,.92)';cx.font='600 12px Arial';cx.textAlign='left';cx.textBaseline='middle';info.forEach((line,i)=>{const txt=clampText(line,120);cx.fillText(txt,infoX+14,infoY+18+i*18);});}
  return cv;
}
const toBlob=(q)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));
$('shut').onclick=()=>{navigator.vibrate?.(20);({foto:photo,video:toggleVideo,pdf:togglePdf})[S.mode]()};
async function photo(){if(!frame())return;const b=await toBlob(.9);const label=$('label').value.trim()||'Sem_Etiqueta';save(b,`FOTO_${safe(label)}_KM_${S.km}_${stamp()}.jpg`);}
$('snap').onclick=e=>{e.stopPropagation();if(!frame())return;const label=$('label').value.trim()||'Sem_Etiqueta';toBlob(.9).then(b=>save(b,`FOTO_EXTRA_${safe(label)}_KM_${S.km}_${stamp()}.jpg`));};
let vidLoop=0;
function toggleVideo(){if(S.rec){S.rec.stop();return}if(!frame())return;const cs=cv.captureStream(30),mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';let r;try{r=new MediaRecorder(cs,{mimeType:mt||undefined,videoBitsPerSecond:8e6})}catch(e){return toast('Gravação não suportada neste navegador',1)}const ini=stamp(),km0=S.km,ch=[];r.ondataavailable=e=>e.data.size&&ch.push(e.data);r.onstop=async()=>{cancelAnimationFrame(vidLoop);S.rec=null;setRec(false);await save(new Blob(ch,{type:r.mimeType||'video/webm'}),`VIDEO_${safe($('label').value || 'Sem_Etiqueta')}_KM_${km0}_${ini}_a_${stamp()}.webm`)};r.start(1000);S.rec=r;setRec(true,'Gravando vídeo');(function d(){frame();vidLoop=requestAnimationFrame(d)})();}
function setRec(on,t){$('rec').classList.toggle('on',on);if(t)$('rec').textContent=t;$('shut').classList.toggle('rec',on);$('snap').classList.toggle('on',on&&S.mode==='pdf');document.body.classList.toggle('clean',on&&S.mode==='pdf');if(on)navigator.wakeLock?.request('screen').then(l=>S.lock=l).catch(()=>{});else{S.lock?.release();S.lock=null}}
const lim=()=>Math.max(parseInt($('lote').value)||150,1);const upd=()=>{if(S.cap)$('rec').textContent=`Lote ${S.batch} · ${S.buf.length}/${lim()}`};
function togglePdf(){S.cap?stopPdf():startPdf()}
function startPdf(){if(!window.jspdf)return toast('jsPDF ainda carregando, tente de novo',1);S.cap=true;S.buf=[];S.queue=[];S.batch=1;S.saved=0;setRec(true);upd();loop();}
function loop(){if(!S.cap)return;const t=performance.now();if(frame())toBlob(.82).then(async b=>{if(!S.cap&&!b)return;S.buf.push({u8:new Uint8Array(await b.arrayBuffer()),km:S.km});if(S.buf.length>=lim())rotate(false);upd();});S.timer=setTimeout(loop,Math.max(0,Math.max(parseInt($('int').value)||200,100)-(performance.now()-t)));}
function rotate(final){if(!S.buf.length)return;S.queue.push({p:S.buf,n:S.batch});S.buf=[];S.batch++;runQueue();}
async function stopPdf(){S.cap=false;clearTimeout(S.timer);$('shut').disabled=true;toast('Salvando lotes pendentes…');rotate(true);await runQueue();while(S.busy||S.queue.length)await new Promise(r=>setTimeout(r,100));setRec(false);$('shut').disabled=false;toast(`Sessão finalizada: ${S.saved} PDF(s)`);}
async function runQueue(){if(S.busy)return;S.busy=true;try{while(S.queue.length){await makePdf(S.queue.shift());S.saved++;await new Promise(r=>setTimeout(r,0))}}catch(e){console.error(e);toast('Falha ao gerar PDF',1)}finally{S.busy=false}}
async function makePdf({p,n}){const {jsPDF}=window.jspdf;const sz=u=>{const i=new jsPDF().getImageProperties(u);return[i.width,i.height]};let [w,h]=sz(p[0].u8);const d=new jsPDF({orientation:w>=h?'landscape':'portrait',unit:'px',format:[w,h],compress:true,hotfixes:['px_scaling']});p.forEach((it,i)=>{if(i)d.addPage([w,h],w>=h?'landscape':'portrait');d.addImage(it.u8,'JPEG',0,0,w,h,undefined,'FAST');it.u8=null});await save(d.output('blob'),`Relatorio_Lote_${n}_KM_${p[0].km}_a_${p[p.length-1].km}.pdf`);}
$('cam').addEventListener('click',e=>{if(S.cap&&!e.target.closest('button,input,select'))document.body.classList.toggle('clean')});
window.addEventListener('beforeunload',e=>{if(S.cap||S.rec||S.busy||S.queue.length){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(S.cap||S.rec))navigator.wakeLock?.request('screen').then(l=>S.lock=l).catch(()=>{})});
refreshMetaText();
</script>
