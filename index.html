<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KMReport RioSP — Status de Conectividade & Ping</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#06070a;--bg2:#0a0d11;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.16);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-sm:12px;--r-md:16px;--r-xl:24px;
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);--shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:9px}

#gateFolder{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{max-width:420px;width:100%;border-radius:24px;border:1px solid var(--border2);background:var(--surface);padding:32px 24px;text-align:center;box-shadow:var(--shadow-xl)}

header{position:fixed;top:0;left:0;right:0;height:calc(60px + var(--safe-t));padding-top:var(--safe-t);background:rgba(6,7,10,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);z-index:500;display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;display:grid;place-items:center;font-weight:900}
.brand-title{font-size:15px;font-weight:900;letter-spacing:-.02em}

main{position:fixed;inset:calc(60px + var(--safe-t)) 0 0 0;overflow-y:auto;padding:16px 16px calc(24px + var(--safe-b))}
.container{max-width:950px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.card{background:linear-gradient(145deg,#121720,#0b0e14);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg)}
.btn-primary{width:100%;padding:14px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(255,214,0,.25)}
.btn-sec{padding:10px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,.06);border:1px solid var(--border2);color:#fff;font-size:11px;font-weight:800;text-transform:uppercase}
.btn-sec.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* INDICADORES DE STATUS / PING */
.status-indicator{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;padding:4px 10px;border-radius:20px;border:1px solid}
.status-ok{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.4)}
.status-fail{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.4)}
.status-unknown{background:rgba(161,161,170,.15);color:#a1a1aa;border-color:rgba(161,161,170,.4)}
.dot-unknown{background:#a1a1aa}
.dot{width:8px;height:8px;border-radius:50%}
.dot-ok{background:#34d399;box-shadow:0 0 8px #34d399}
.dot-fail{background:#ef4444;box-shadow:0 0 8px #ef4444}

#modalFoto{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);display:none;flex-direction:column;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow-y:auto}
#modalFoto.active{display:flex}
.preview-box{width:100%;height:280px;border-radius:16px;background:#000;position:relative;overflow:hidden;border:1px solid var(--border2)}
#cameraVid{width:100%;height:100%;object-fit:cover}

.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(16px);border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);padding:12px 20px;font-size:11px;font-weight:800;text-transform:uppercase;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);z-index:99998;opacity:0;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="gateFolder">
  <div class="gate-box">
    <div style="width:64px;height:64px;border-radius:18px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.3);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px">
      <i data-lucide="folder-open" style="width:32px;height:32px"></i>
    </div>
    <h1 style="font-size:20px;font-weight:900">KMReport Ping Monitor</h1>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">Selecione a pasta para relatórios e monitoramento de conectividade em tempo real.</p>
    <button class="btn-primary" onclick="initFolderPermission()" style="margin-top:20px">Selecionar Pasta & Iniciar</button>
  </div>
</div>

<header>
  <div class="brand">
    <div class="brand-icon"><i data-lucide="wifi"></i></div>
    <div>
      <h1 class="brand-title">KMReport Monitor Ping</h1>
      <p style="font-size:9px;color:var(--text3)" id="folderStatusHdr">Pasta não selecionada</p>
    </div>
  </div>
  <div style="display:flex;gap:6px">
    <button id="modeGpsBtn" class="btn-sec active" onclick="setMode('gps')">GPS</button>
    <button id="modeManBtn" class="btn-sec" onclick="setMode('manual')">Manual</button>
  </div>
</header>

<main style="display:none" id="mainAppContent">
  <div class="container">
    
    <!-- SELETOR DE ATIVO -->
    <div class="card">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)" id="statusModeLbl">Modo GPS Ativo</span>
          <span id="kmRealTime" style="font-size:11px;font-weight:900;color:var(--accent)">KM ---</span>
        </div>

        <select id="topoSelect" onchange="onAssetSelected(this.value)" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:#fff;padding:12px;border-radius:var(--r-sm);font-size:13px;font-weight:700">
          <option value="">Carregando ativos...</option>
        </select>
      </div>
    </div>

    <!-- PAINEL CENTRAL DE STATUS E PING EM SEGUNDO PLANO -->
    <div id="topoVisualCard">
      <div class="card" style="text-align:center;padding:40px;color:var(--muted)">
        <p style="font-size:13px;font-weight:800">Aguardando coordenadas de GPS ou seleção de ativo...</p>
      </div>
    </div>

  </div>
</main>

<!-- MODAL CÂMERA E RELATÓRIO PDF -->
<div id="modalFoto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:16px;font-weight:900">Registro & Documentação com Status</h2>
    <button class="btn-sec" onclick="closeFotoModal()">Fechar</button>
  </div>

  <div class="preview-box">
    <video id="cameraVid" autoplay playsinline muted></video>
    <canvas id="photoCanvas" style="display:none"></canvas>
  </div>

  <div style="margin-top:16px;display:flex;gap:12px">
    <button class="btn-primary" onclick="capturePhoto()"><i data-lucide="camera"></i> Capturar Foto com Marca d'Água</button>
  </div>

  <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
    <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)">Observações Técnicas / Status de Conexão</label>
    <textarea id="obsTecnicas" rows="3" placeholder="Insira dados sobre a perda de pacote ou estabilidade do switch..." style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px;color:#fff;font-size:12px"></textarea>
    
    <button class="btn-primary" onclick="generateAndSaveReport()" style="background:linear-gradient(135deg,#34d399,#047857);color:#fff"><i data-lucide="file-check"></i> Salvar Relatório PDF na Pasta</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let kmDB = [];
let ativosDatabase = [];
let currentMode = 'gps';
let currentKmNum = null;
let currentKmStr = "---";
let selectedAsset = null;
let capturedImageBase64 = null;
let cameraStream = null;
let dirHandle = null;
let pingInterval = null;

const parsePt = v => { const s = String(v ?? '').trim(); return /,\d+$/.test(s) ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s); };
function findCol(h, cs) { const m = h.map(s => String(s || '').trim().toUpperCase()); for (const c of cs) { const i = m.indexOf(c.toUpperCase()); if (i >= 0) return i; } return -1; }

function parseKmStringToNum(kmStr) {
  if (!kmStr) return 0;
  const s = String(kmStr).trim().toUpperCase().replace('KM', '').trim();
  if (s.includes('+')) {
    const parts = s.split('+');
    return (parseFloat(parts[0]) || 0) + ((parseFloat(parts[1]) || 0) / 1000.0);
  }
  return parseFloat(s.replace(',', '.')) || 0;
}

window.addEventListener('DOMContentLoaded', () => {
  if (window.lucide) lucide.createIcons();
  loadAtivosCSV();
  loadSNVData();
});

async function initFolderPermission() {
  try {
    if (!window.showDirectoryPicker) { alert('Utilize o Chrome ou Edge.'); return; }
    dirHandle = await window.showDirectoryPicker();
    document.getElementById('folderStatusHdr').textContent = 'Pasta Conectada';
    document.getElementById('gateFolder').style.display = 'none';
    document.getElementById('mainAppContent').style.display = 'block';
    showToast('Pasta selecionada!');
  } catch(e) { showToast('Permissão cancelada.'); }
}

async function loadAtivosCSV() {
  try {
    const res = await fetch('ativos 116.csv?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    let text = await res.text();
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    lines.shift(); lines.shift();
    
    const rawData = [];
    for (const line of lines) {
      const cols = line.split(';');
      if (cols.length < 13) continue;
      const tag = (cols[0] || '').trim();
      const kmStr = (cols[3] || '').trim();
      if (!tag || !kmStr || tag === 'TAG') continue;

      rawData.push({
        tag: tag,
        eq: (cols[1] || '').trim(),
        host: (cols[2] || '-').trim(),
        kmStr: kmStr,
        sentido: (cols[4] || '-').trim(),
        fibra: (cols[5] || '').trim(),
        cidade: (cols[6] || '-').trim(),
        anel: (cols[7] || '-').trim(),
        ipGer: (cols[8] || '-').trim(),
        gerencia: (cols[9] || '-').trim(),
        rede: (cols[10] || '-').trim(),
        switchIp: (cols[11] || '-').trim(),
        ativoIp: (cols[12] || '-').trim(),
        statusPing: 'unknown' // 'ok' ou 'fail'
      });
    }

    rawData.forEach(item => { item.kmNum = parseKmStringToNum(item.kmStr); });
    rawData.sort((a,b) => a.kmNum - b.kmNum);
    ativosDatabase = rawData;

    updateAssetDropdown();
    startBackgroundPingLoop();
  } catch(e) { console.error("Erro ao carregar CSV:", e); }
}

async function loadSNVData() {
  try {
    let r = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (!r?.ok) return;
    let t = await r.text();
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const lines = t.split(/\r?\n/).filter(l => l.trim());
    const h = lines.shift().split(';');
    const iKm = findCol(h, ['km']), iLat = findCol(h, ['lat', 'latitude']), iLon = findCol(h, ['lon', 'long', 'longitude']);
    kmDB = lines.map(l => {
      const r = l.split(';');
      return { km: parsePt(r[iKm]), lat: parsePt(r[iLat]), lon: parsePt(r[iLon]) };
    }).filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  } catch (e) {}
}

// PING REAL VIA API INTERNA (gateway). Ajuste PING_API_URL para o endereço do seu serviço.
// Contrato esperado: GET {PING_API_URL}?ip=10.0.0.1 -> {"online": true, "ms": 12}
const PING_API_URL = '/api/ping';
const PING_INTERVAL_MS = 4000;
const PING_TIMEOUT_MS = 3000;
let pingRunning = false;

async function pingHost(ip) {
  if (!ip || ip === '-') return 'unknown';
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), PING_TIMEOUT_MS);
  try {
    const r = await fetch(`${PING_API_URL}?ip=${encodeURIComponent(ip)}`, { cache: 'no-store', signal: ctrl.signal });
    if (!r.ok) return 'unknown';
    const j = await r.json();
    return j.online ? 'ok' : 'fail';
  } catch (e) {
    return 'unknown';
  } finally { clearTimeout(tid); }
}

async function runPingCycle() {
  if (pingRunning || !selectedAsset) return;
  pingRunning = true;
  try {
    const asset = selectedAsset;
    const links = getStrictFiberLinks(asset);
    const targets = [asset, links.prevObj, links.nextObj].filter(Boolean);
    const results = await Promise.all(targets.map(x => pingHost(x.switchIp !== '-' ? x.switchIp : x.ipGer)));
    targets.forEach((x, k) => { x.statusPing = results[k]; });
    if (asset === selectedAsset) updatePingBadgesUI(asset, links);
  } finally { pingRunning = false; }
}

function startBackgroundPingLoop() {
  if (pingInterval) clearInterval(pingInterval);
  pingInterval = setInterval(runPingCycle, PING_INTERVAL_MS);
  runPingCycle();
}

function statusLabel(s, long) {
  if (s === 'ok') return long ? 'ONLINE (PING OK)' : 'ONLINE';
  if (s === 'fail') return long ? 'OFFLINE (FALHA)' : 'OFFLINE';
  return long ? 'SEM DADOS DE PING' : 'SEM DADOS';
}
function statusClasses(s) {
  return s === 'ok' ? ['status-ok','dot-ok'] : s === 'fail' ? ['status-fail','dot-fail'] : ['status-unknown','dot-unknown'];
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeGpsBtn').classList.toggle('active', mode === 'gps');
  document.getElementById('modeManBtn').classList.toggle('active', mode === 'manual');
  document.getElementById('statusModeLbl').textContent = mode === 'gps' ? 'Modo GPS Ativo' : 'Modo Consulta Manual';
  if(mode === 'gps' && currentKmNum !== null) locateNearestAsset();
}

function updateAssetDropdown() {
  const sel = document.getElementById('topoSelect');
  if(!sel || !ativosDatabase.length) return;
  
  sel.innerHTML = '';
  ativosDatabase.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${item.tag} — ${item.eq} (KM ${item.kmStr}) [Fibra ${item.fibra}]`;
    if(selectedAsset && selectedAsset.tag === item.tag) opt.selected = true;
    sel.appendChild(opt);
  });

  if(ativosDatabase.length && !sel.value) {
    sel.value = 0;
    renderTechnicalConsultation(0);
  }
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

let gpsErrorShown = false;
function onGpsError(err) {
  if (gpsErrorShown) return;
  gpsErrorShown = true;
  const msgs = { 1: 'Permissão de GPS negada.', 2: 'Posição GPS indisponível.', 3: 'Tempo esgotado no GPS.' };
  showToast(msgs[err.code] || 'Erro de GPS.');
  setTimeout(() => { gpsErrorShown = false; }, 15000);
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    if (!kmDB.length) return;
    let best = null, minD = Infinity;
    for (const pt of kmDB) {
      const d = haversineKm(pt.lat, pt.lon, p.coords.latitude, p.coords.longitude);
      if (d < minD) { minD = d; best = pt; }
    }
    if (best) {
      currentKmNum = parseFloat(best.km);
      currentKmStr = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
      document.getElementById('kmRealTime').textContent = 'KM ' + currentKmStr;
      if (currentMode === 'gps') locateNearestAsset();
    }
  }, onGpsError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
} else {
  console.warn('Geolocalização não suportada.');
}

function locateNearestAsset() {
  if (currentKmNum === null || !ativosDatabase.length) return;
  let bestIdx = 0, minDiff = Infinity;
  ativosDatabase.forEach((item, idx) => {
    const diff = Math.abs(item.kmNum - currentKmNum);
    if (diff < minDiff) { minDiff = diff; bestIdx = idx; }
  });
  renderTechnicalConsultation(bestIdx);
}

function onAssetSelected(idx) {
  if(idx !== "") renderTechnicalConsultation(parseInt(idx));
}

function getStrictFiberLinks(currentAsset) {
  const sameFiberList = ativosDatabase.filter(item => item.fibra === currentAsset.fibra);
  sameFiberList.sort((a,b) => a.kmNum - b.kmNum);

  const idx = sameFiberList.findIndex(item => item.tag === currentAsset.tag);
  
  let prev = idx > 0 ? sameFiberList[idx - 1] : sameFiberList[sameFiberList.length - 1];
  let next = idx < sameFiberList.length - 1 ? sameFiberList[idx + 1] : sameFiberList[0];

  return {
    prevObj: prev, prevTag: prev.tag, prevKm: prev.kmStr, prevDist: Math.abs(currentAsset.kmNum - prev.kmNum).toFixed(3),
    nextObj: next, nextTag: next.tag, nextKm: next.kmStr, nextDist: Math.abs(next.kmNum - currentAsset.kmNum).toFixed(3)
  };
}

function updatePingBadgesUI(data, links) {
  const items = [
    [data, 'badgePingCurr', 'cardCurrFrame', true, 'rgba(52,211,153,.5)'],
    [links.prevObj, 'badgePingPrev', 'cardPrevFrame', false, 'rgba(245,158,11,.25)'],
    [links.nextObj, 'badgePingNext', 'cardNextFrame', false, 'rgba(59,130,246,.25)']
  ];
  for (const [obj, bId, cId, long, okColor] of items) {
    const b = document.getElementById(bId), c = document.getElementById(cId);
    if (!b || !c || !obj) continue;
    const s = obj.statusPing;
    const [cls, dot] = statusClasses(s);
    b.className = `status-indicator ${cls}`;
    b.innerHTML = `<span class="dot ${dot}"></span> ${statusLabel(s, long)}`;
    c.style.borderColor = s === 'fail' ? 'rgba(239,68,68,.8)' : s === 'ok' ? okColor : 'rgba(161,161,170,.35)';
  }
}

function renderTechnicalConsultation(idx) {
  const data = ativosDatabase[idx];
  if(!data) return;
  selectedAsset = data;
  document.getElementById('topoSelect').value = idx;

  const links = getStrictFiberLinks(data);
  const container = document.getElementById('topoVisualCard');
  const fibrasArr = data.fibra.split(',').map(s => s.trim());
  const fibraTx = fibrasArr[0] || '-';
  const fibraRx = fibrasArr[1] || fibraTx;

  container.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <!-- PAINEL CENTRAL DO ATIVO COM MOLDURA DINÂMICA DE PING -->
      <div id="cardCurrFrame" class="card" style="border-color:rgba(59,130,246,.5);background:linear-gradient(145deg,#182338,#0e1524);text-align:center;padding:24px;transition:all .3s ease">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa">📍 Ativo Atual na Fibra ${data.fibra}</span>
          <div id="badgePingCurr" class="status-indicator status-unknown"><span class="dot dot-unknown"></span> VERIFICANDO...</div>
        </div>

        <h3 style="font-size:clamp(26px,5vw,36px);font-weight:900;font-family:monospace;color:var(--accent);margin:6px 0 2px">${data.tag}</h3>
        <p style="font-size:14px;font-family:monospace;color:#fff;font-weight:800">${data.eq} | KM ${data.kmStr} | Sentido ${data.sentido}</p>
        
        <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.4)">TX: ${fibraTx} / RX: ${fibraRx}</span>
          <span style="font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.4)">IP Switch: ${data.switchIp}</span>
        </div>

        <button class="btn-primary" onclick="openFotoModal()" style="margin-top:18px"><i data-lucide="camera"></i> Registrar Foto & Relatório PDF</button>
      </div>

      <!-- MAPA DE ENLACE COM STATUS DOS VIZINHOS -->
      <div class="card" style="padding:20px;background:linear-gradient(145deg,#0e1218,#07090d);border-color:rgba(59,130,246,.3)">
        <h4 style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#60a5fa;margin-bottom:14px">🔗 Monitoramento de Conectividade do Enlace (Fibra ${data.fibra})</h4>
        
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center">
          
          <!-- ANTERIOR -->
          <div id="cardPrevFrame" style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);padding:14px;border-radius:12px;font-family:monospace;transition:all .3s ease">
            <span style="font-size:9px;color:#f6ad55;font-weight:900">ANTERIOR (${links.prevDist} km)</span>
            <p style="font-size:14px;font-weight:900;color:#fff;margin:4px 0">${links.prevTag}</p>
            <p style="font-size:10px;color:var(--text3)">KM ${links.prevKm}</p>
            <div id="badgePingPrev" class="status-indicator status-unknown" style="margin-top:8px"><span class="dot dot-unknown"></span> VERIFICANDO</div>
          </div>

          <!-- ENLACE -->
          <div style="display:flex;flex-direction:column;align-items:center;color:var(--accent)">
            <span style="font-size:9px;font-weight:900">PING BG</span>
            <i data-lucide="activity" style="width:24px;height:24px"></i>
            <span style="font-size:9px;color:var(--muted)">4s</span>
          </div>

          <!-- POSTERIOR -->
          <div id="cardNextFrame" style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);padding:14px;border-radius:12px;font-family:monospace;transition:all .3s ease">
            <span style="font-size:9px;color:#60a5fa;font-weight:900">POSTERIOR (${links.nextDist} km)</span>
            <p style="font-size:14px;font-weight:900;color:#fff;margin:4px 0">${links.nextTag}</p>
            <p style="font-size:10px;color:var(--text3)">KM ${links.nextKm}</p>
            <div id="badgePingNext" class="status-indicator status-unknown" style="margin-top:8px"><span class="dot dot-unknown"></span> VERIFICANDO</div>
          </div>

        </div>
      </div>

      <!-- DADOS DA PLANILHA -->
      <div class="card" style="padding:20px">
        <h4 style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:14px">📋 Dados Técnicos (ativos 116.csv)</h4>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:12px;font-family:monospace">
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>TAG:</strong><br><span style="color:#ffd600">${data.tag}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Equipamento:</strong><br><span style="color:#fff">${data.eq}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Hostname:</strong><br><span style="color:#60a5fa">${data.host}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>KM / Sentido:</strong><br><span style="color:#fff">KM ${data.kmStr} (${data.sentido})</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>IP Gerência:</strong><br><span style="color:#ffd600">${data.ipGer}</span></div>
          <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px"><strong>Switch:</strong><br><span style="color:#fff">${data.switchIp}</span></div>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
  updatePingBadgesUI(data, links);
  runPingCycle();
}

async function openFotoModal() {
  document.getElementById('modalFoto').classList.add('active');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    document.getElementById('cameraVid').srcObject = cameraStream;
  } catch(e) { showToast('Câmera indisponível.'); }
}

function closeFotoModal() {
  if(cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }
  document.getElementById('modalFoto').classList.remove('active');
}

function capturePhoto() {
  const vid = document.getElementById('cameraVid');
  const canvas = document.getElementById('photoCanvas');
  canvas.width = vid.videoWidth || 1280;
  canvas.height = vid.videoHeight || 720;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 24px monospace';
  ctx.fillText(`KM ${currentKmStr} | ${selectedAsset ? selectedAsset.tag : ''} | Status: ${selectedAsset ? statusLabel(selectedAsset.statusPing, false) : ''}`, 20, canvas.height - 45);
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Data/Hora: ${new Date().toLocaleString('pt-BR')}`, 20, canvas.height - 18);

  capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
  showToast('Foto capturada com status!');
}

function pad2(n) { return String(n).padStart(2, '0'); }
function timestampForFile() {
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
}

async function generateAndSaveReport() {
  if (!selectedAsset) { showToast('Nenhum ativo selecionado'); return; }
  if (!window.jspdf) { showToast('Biblioteca de PDF ainda carregando.'); return; }
  const links = getStrictFiberLinks(selectedAsset);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const PW = 210, PH = 297, M = 14, maxW = PW - 2 * M;

  const paintBg = () => { doc.setFillColor(6, 7, 10); doc.rect(0, 0, PW, PH, 'F'); };
  paintBg();

  doc.setTextColor(255, 214, 0);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.text('Relatório de Conectividade & Ping - BR116', M, 22);

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(11);
  doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, M, 29);
  doc.text(`TAG do Ativo Atual: ${selectedAsset.tag} [Status: ${statusLabel(selectedAsset.statusPing, false)}]`, M, 38);
  doc.text(`Equipamento: ${selectedAsset.eq} (KM ${selectedAsset.kmStr})`, M, 46);
  doc.text(`IP Switch / Gerência: ${selectedAsset.switchIp} / ${selectedAsset.ipGer}`, M, 54);
  doc.text(`Anterior na Fibra: ${links.prevTag} [Status: ${statusLabel(links.prevObj.statusPing, false)}]`, M, 64);
  doc.text(`Posterior na Fibra: ${links.nextTag} [Status: ${statusLabel(links.nextObj.statusPing, false)}]`, M, 72);

  let y = 86;
  const obs = document.getElementById('obsTecnicas').value.trim();
  if (obs) {
    doc.setTextColor(255, 214, 0);
    doc.text('Observações Técnicas:', M, y);
    y += 8;
    doc.setTextColor(200, 200, 200);
    doc.setFont('helvetica', 'normal');
    const lines = doc.splitTextToSize(obs, maxW);
    for (const line of lines) {
      if (y > PH - M) { doc.addPage(); paintBg(); doc.setTextColor(200, 200, 200); y = M + 6; }
      doc.text(line, M, y);
      y += 6;
    }
    y += 6;
  }

  if (capturedImageBase64) {
    const imgH = 102;
    if (y + imgH > PH - M) { doc.addPage(); paintBg(); y = M; }
    doc.addImage(capturedImageBase64, 'JPEG', M, y, 182, imgH);
  }

  const pdfBlob = doc.output('blob');
  const safeTag = selectedAsset.tag.replace(/[^\w\-]+/g, '_');
  const fileName = `Monitor_${safeTag}_${timestampForFile()}.pdf`;

  if (dirHandle) {
    try {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(pdfBlob);
      await writable.close();
      showToast('Relatório de Status salvo na pasta!');
    } catch (e) {
      doc.save(fileName);
      showToast('Relatório baixado!');
    }
  } else {
    doc.save(fileName);
    showToast('Relatório gerado!');
  }

  capturedImageBase64 = null;
  document.getElementById('obsTecnicas').value = '';
  closeFotoModal();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
