<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KMReport RioSP — Consulta Técnica & Fibras</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#06070a;--bg2:#0a0d11;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.16);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-sm:12px;--r-md:16px;--r-xl:24px;
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);--shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:9px}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
#splash.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}

/* MAIN MENU */
#main-menu{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(255,214,0,.08),transparent 35%),linear-gradient(180deg,#090b0f,#050609);overflow-y:auto}
.menu-inner{max-width:820px;width:100%;margin:auto}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mc{position:relative;overflow:hidden;min-height:240px;padding:22px;border-radius:26px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:12px;text-align:left;background:linear-gradient(145deg,#171b22,#0b0e12);box-shadow:0 22px 55px rgba(0,0,0,.5);transition:transform .18s var(--ease)}
.mc:active{transform:scale(.97)}
.mc.pri{--card:#ffd600;--card2:#b89500;border-color:rgba(255,214,0,.28)}
.mc.sec-btn{--card:#34d399;--card2:#047857;border-color:rgba(52,211,153,.25)}
.mc.top-btn{--card:#3b82f6;--card2:#1d4ed8;border-color:rgba(59,130,246,.3)}
.mc-i{position:absolute;left:22px;top:22px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--card),var(--card2));color:#050608}
.mc-i svg{width:28px;height:28px}
.mc-b h3{font-size:clamp(17px,3.2vw,22px);font-weight:950;letter-spacing:-.035em}
.mc-b p{font-size:11px;font-weight:600;color:var(--text3);margin-top:7px}
.mc-a{position:absolute;right:18px;top:20px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--text2)}
@media(max-width:768px){.menu-grid{grid-template-columns:1fr;gap:14px}.mc{min-height:170px}}

/* MODULES */
.module{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:var(--bg);z-index:10}
.module.active{display:block}

/* MODULO CONSULTA TECNICA */
#mod-topologia{overflow-y:auto;padding:calc(20px + var(--safe-t)) 16px calc(24px + var(--safe-b));background:radial-gradient(circle at 50% 0,rgba(59,130,246,.08),transparent 40%),#06070a}
.top-header{max-width:950px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center}
.top-back{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:11px;font-weight:800;text-transform:uppercase}
.top-container{max-width:950px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top-card{background:linear-gradient(145deg,#121720,#0b0e14);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg)}

/* GATE / INSPEÇÃO */
#gate{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow-y:auto}
.gate-box{max-width:400px;width:100%;border-radius:var(--r-xl);border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface2) 100%);padding:36px 24px;text-align:center;box-shadow:var(--shadow-xl)}
.gate-icon{width:72px;height:72px;border-radius:20px;background:rgba(255,214,0,.06);border:1px solid rgba(255,214,0,.12);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.gate-btn-discreet{width:100%;min-height:42px;border-radius:var(--r-sm);background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--text);font-size:11px;font-weight:800;text-transform:uppercase;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.gate-btn-discreet.sec{background:transparent;border-color:transparent;color:var(--muted);margin-top:6px}

#app-shell{position:relative;width:100vw;height:100vh;height:100dvh;visibility:hidden;overflow:hidden}
#vid, #vidUnica{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#km-hud{position:absolute;top:calc(18px + var(--safe-t));left:14px;min-width:160px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.1);background:rgba(4,120,87,.78);padding:10px 18px;text-align:center;backdrop-filter:blur(18px);z-index:100;pointer-events:none}
#ui-ctrl{position:absolute;bottom:0;left:0;right:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 18px calc(24px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.82),transparent)}
.ui-btn{height:52px;border-radius:var(--r-sm);font-size:11px;font-weight:900;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}
#btn-start{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000}
#btn-stop{flex:1;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;display:none}

/* SETTINGS */
#settings, #settingsUnica{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.6);opacity:0;visibility:hidden;pointer-events:none;transition:all .25s var(--ease)}
#settings.open, #settingsUnica.open{opacity:1;visibility:visible;pointer-events:auto}
.settings-content{width:min(90vw,400px);max-height:85vh;border-radius:var(--r-xl);border:1px solid var(--border2);background:rgba(10,13,17,0.96);padding:24px;overflow-y:auto}
.settings-close{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:20px;cursor:pointer;border:0;background:none}
.s-group{margin-top:22px}
.s-lbl{display:block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.s-inp{width:100%;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:#fff;padding:13px;font-size:13px;font-weight:800}
canvas#c, canvas#cUnica{display:none}
.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(16px);border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);padding:12px 20px;font-size:11px;font-weight:800;text-transform:uppercase;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);z-index:99998;opacity:0;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" aria-hidden="true">
  <div style="text-align:center">
    <h1 style="font-size:28px;font-weight:900;color:var(--accent)">KMReport RioSP</h1>
  </div>
</div>

<!-- MAIN MENU -->
<div id="main-menu">
  <div class="menu-inner">
    <div class="menu-grid">
      <button class="mc pri" onclick="openMod('foto-unica')">
        <span class="mc-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg></span>
        <span class="mc-b"><h3>Foto e Vídeo</h3><p>Capture fotos e vídeos com KM e GPS</p></span>
        <span class="mc-a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>

      <button class="mc sec-btn" onclick="openMod('inspecao')">
        <span class="mc-i" style="background:linear-gradient(145deg,#34d399,#047857)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
        <span class="mc-b"><h3>Inspeção PDF</h3><p>Captura contínua e relatório automático</p></span>
        <span class="mc-a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>

      <button class="mc top-btn" onclick="openMod('topologia')">
        <span class="mc-i" style="background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg></span>
        <span class="mc-b"><h3>Consulta Ativos 116</h3><p>Dados completos, IPs, Fibras e Interligação</p></span>
        <span class="mc-a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
    </div>
  </div>
</div>

<!-- MÓDULO CONSULTA TÉCNICA DE ATIVOS -->
<div id="mod-topologia" class="module">
  <div class="top-header">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);display:grid;place-items:center;color:#3b82f6">
        <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg>
      </div>
      <div>
        <h2 style="font-size:18px;font-weight:900">Consulta Técnica de Ativos & Fibras</h2>
        <p style="font-size:11px;color:var(--text3)">Sincronizado com sua posição GPS em tempo real</p>
      </div>
    </div>
    <button class="top-back" onclick="openMod('menu')">Voltar ao Menu</button>
  </div>

  <div class="top-container">
    <div class="top-card" style="padding:20px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)">Ativo Selecionado</span>
          <span id="topoKmBadge" style="font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa">GPS Sincronizado</span>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          <select id="topoSelect" onchange="renderTechnicalConsultation(this.value)" style="flex:1;background:var(--bg);border:1px solid var(--border2);color:#fff;padding:12px;border-radius:var(--r-sm);font-size:13px;font-weight:700">
          </select>
          <button onclick="autoSelectNearestNE()" style="padding:12px 16px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border-radius:var(--r-sm);font-size:11px;font-weight:900;text-transform:uppercase;white-space:nowrap">Mais Próximo (GPS)</button>
        </div>
      </div>
    </div>

    <!-- PAINEL DE DADOS COMPLETOS E INTERLIGAÇÃO -->
    <div id="topoVisualCard"></div>
  </div>
</div>

<!-- FOTO E VÍDEO -->
<div id="mod-foto-unica" class="module">
  <video id="vidUnica" autoplay playsinline muted></video>
  <div id="km-hud-unica" style="position:absolute;top:calc(18px + var(--safe-t));left:14px;min-width:160px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.1);background:rgba(4,120,87,.78);padding:10px 18px;text-align:center;backdrop-filter:blur(18px);z-index:100">
    <span style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:rgba(220,252,231,.55)">KM atual</span>
    <p style="font-size:26px;font-weight:900;line-height:1.1;margin-top:2px;color:#fff" id="kmTxtUnica">KM ---</p>
  </div>
  <div style="position:absolute;top:calc(18px + var(--safe-t));right:14px;z-index:100;">
    <button onclick="openMod('menu')" style="height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:900;text-transform:uppercase">Voltar</button>
  </div>
  <div style="position:absolute;inset:auto 0 0 0;padding:0 18px calc(24px + var(--safe-b));display:flex;gap:16px;align-items:center;justify-content:center;z-index:200">
    <button onclick="takeSinglePhoto()" style="width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,0.2);display:grid;place-items:center"><div style="width:56px;height:56px;border-radius:50%;background:#fff"></div></button>
  </div>
  <canvas id="cUnica"></canvas>
</div>

<!-- INSPEÇÃO PDF -->
<div id="mod-inspecao" class="module">
  <div id="gate">
    <div class="gate-box">
      <h1 style="font-size:20px;font-weight:900">Inspeção Fotográfica</h1>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">Selecione a pasta de salvamento para iniciar.</p>
      <button class="gate-btn-discreet" onclick="startApp()" style="background:var(--accent);color:#000;font-weight:900">Selecionar Pasta & Ativar</button>
      <button class="gate-btn-discreet sec" onclick="openMod('menu')">Voltar ao menu</button>
    </div>
  </div>
  <div id="app-shell">
    <div id="km-hud"><span class="h-l">KM atual</span><p class="h-v" id="kmTxt">KM ---</p></div>
    <div id="ui-ctrl">
      <button class="ui-btn" id="btn-start" onclick="startCap()">Iniciar</button>
      <button class="ui-btn" id="btn-stop" onclick="stopCap()">Finalizar</button>
      <button class="ui-btn" id="btn-menu" onclick="openMod('menu')" style="background:rgba(0,0,0,.4)">Voltar</button>
    </div>
  </div>
  <canvas id="c"></canvas>
</div>

<div class="toast" id="toast"></div>

      {tag: "BR116-CM0003", eq: "CFTV MÓVEL", host: "RSP-SA57-N216_946", kmStr: "216+946", kmNum: 216.946, sentido: "NORTE", fibra: "11, 12", cidade: "Seropédica", anel: "223+300 - Balança Paracambi", ipGer: "172.27.0.181", gerencia: "172.26.12.135", rede: "10.3.7.48", switchIp: "10.3.7.49", ativoIp: "10.3.7.52"},
      {tag: "BR116-CF0009", eq: "CFTV DAI", host: "RSP-SA56-N217_510", kmStr: "217+510", kmNum: 217.510, sentido: "SUL", fibra: "21, 22", cidade: "Seropédica", anel: "223+300 - Balança Paracambi", ipGer: "172.27.0.182", gerencia: "172.26.12.140", rede: "10.3.7.88", switchIp: "10.3.7.89", ativoIp: "10.3.7.90"},
      {tag: "BR116-CF0010", eq: "CFTV DAI", host: "RSP-SA56-N217_713", kmStr: "217+713", kmNum: 217.713, sentido: "NORTE", fibra: "11, 12", cidade: "Seropédica", anel: "223+300 - Balança Paracambi", ipGer: "172.27.0.184", gerencia: "172.26.12.143", rede: "10.3.7.112", switchIp: "10.3.7.113", ativoIp: "10.3.7.114"}
    ];
    
    rawData.sort((a,b) => a.kmNum - b.kmNum);

    rawData.forEach((item, idx) => {
      let prev = idx > 0 ? rawData[idx - 1] : rawData[rawData.length - 1];
      let next = idx < rawData.length - 1 ? rawData[idx + 1] : rawData[0];
      let distPrev = Math.abs(item.kmNum - prev.kmNum).toFixed(3);
      let distNext = Math.abs(next.kmNum - item.kmNum).toFixed(3);

      ativosDatabase.push({
        ...item,
        prevTag: prev.tag, prevKm: prev.kmStr, prevFibra: prev.fibra, prevDist: distPrev,
        nextTag: next.tag, nextKm: next.kmStr, nextFibra: next.fibra, nextDist: distNext
      });
    });

    initTechnicalModule();
  } catch(e) { console.error(e); }
}

function initTechnicalModule() {
  const sel = document.getElementById('topoSelect');
  if(!sel) return;
  sel.innerHTML = '';
  ativosDatabase.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${item.tag} — ${item.eq} (KM ${item.kmStr}) [Fibra ${item.fibra}]`;
    sel.appendChild(opt);
  });
  autoSelectNearestNE();
}

function autoSelectNearestNE() {
  let numKm = parseFloat(currentKm.replace(',', '.'));
  if (isNaN(numKm)) {
    if(ativosDatabase.length) { document.getElementById('topoSelect').value = 0; renderTechnicalConsultation(0); }
    return;
  }
  let bestIdx = 0, minDiff = Infinity;
  ativosDatabase.forEach((item, idx) => {
    const diff = Math.abs(item.kmNum - numKm);
    if (diff < minDiff) { minDiff = diff; bestIdx = idx; }
  });
  document.getElementById('topoSelect').value = bestIdx;
  renderTechnicalConsultation(bestIdx);
  const matched = ativosDatabase[bestIdx];
  showToast(`Ativo mais próximo: ${matched.tag} (KM ${matched.kmStr})`);
}

async function openMod(id) {
  const menu = document.getElementById('main-menu');
  if (id === 'menu') {
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    menu.style.display = 'flex';
    dirHandle = null;
    return;
  }
  if (id === 'topologia') {
    menu.style.display = 'none';
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    document.getElementById('mod-topologia').classList.add('active');
    autoSelectNearestNE();
    return;
  }
  menu.style.display = 'none';
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  document.getElementById('mod-' + id).classList.add('active');
}

async function loadKm() {
  try {
    let r = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (!r?.ok) return;
    let t = await r.text();
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const lines = t.split(/\r?\n/).filter(l => l.trim());
    const h = lines.shift().split(';');
    const iKm = findCol(h, ['km']), iLat = findCol(h, ['lat', 'latitude']), iLon = findCol(h, ['lon', 'long', 'longitude']);
    kmDB = lines.map(l => {
      const r = l.split(';');
      return { km: parsePt(r[iKm]), lat: parsePt(r[iLat]), lon: parsePt(r[iLon]) };
    }).filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
  } catch (e) {}
}
loadKm();

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    lat = p.coords.latitude.toFixed(6);
    lon = p.coords.longitude.toFixed(6);
    if (!kmDB.length) return;
    let best = null, minD = Infinity;
    for (const pt of kmDB) {
      const d = Math.hypot(pt.lat - p.coords.latitude, pt.lon - p.coords.longitude);
      if (d < minD) { minD = d; best = pt; }
    }
    if (best) {
      currentKm = (Math.round(best.km * 100) / 100).toFixed(2).replace('.', ',');
      document.getElementById('kmTxt').textContent = 'KM ' + currentKm;
      const badge = document.getElementById('topoKmBadge');
      if(badge) badge.textContent = 'KM ' + currentKm + ' (GPS)';
      autoSelectNearestNE();
    }
  }, null, { enableHighAccuracy: true });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function startApp() {
  try {
    dirHandle = await window.showDirectoryPicker();
    showToast('Pasta selecionada com sucesso');
    openMod('inspecao');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    document.getElementById('vid').srcObject = stream;
  } catch(e) { showToast('Erro ao selecionar pasta'); }
}
