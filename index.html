<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Sistema de Ativos ITS & Apoio Técnico</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#070913;
  --surface:#0b1124;
  --surface2:#111936;
  --border:rgba(59,130,246,.2);
  --border2:rgba(59,130,246,.4);
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.3);
  --green:#10b981;
  --green2:#34d399;
  --red:#ef4444;
  --warn:#f59e0b;
  --purple:#a855f7;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;
  --safe-b:max(env(safe-area-inset-bottom,0px),12px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.08),transparent 55%),var(--bg);
  color:var(--text);font-family:var(--font);overflow-x:hidden;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;}
button:active{opacity:.8;transform:scale(.97)}
input,select{font-family:var(--font);outline:none}

.hdr{
  position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.95);backdrop-filter:blur(20px);
  padding:0 12px;padding-top:var(--safe-t);
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:48px;}
.hdr-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 10px var(--accent-glow);}

.wrap{max-width:760px;margin:0 auto;padding:12px;padding-bottom:var(--safe-b);display:flex;flex-direction:column;gap:12px;}

.section-block{
  display:flex;flex-direction:column;gap:10px;
  background:rgba(11,17,36,0.85);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px;backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.menu-pills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.menu-pill{
  width:100%;padding:10px;border-radius:var(--r-xs);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text2);
  font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s ease;
}
.menu-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}

.collapsible-pane{display:none;flex-direction:column;gap:8px;margin-top:2px;}
.collapsible-pane.show{display:flex;}

.search-row{display:flex;gap:6px}
.search-wrap{flex:1;min-width:0;position:relative}
.search-input{
  width:100%;border-radius:var(--r-xs);border:1px solid var(--border2);
  background:rgba(7,9,19,.9);padding:10px 12px;
  font-size:11px;font-weight:800;text-transform:uppercase;color:#fff;
  transition:all .2s ease;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}

.btn-icon{
  width:38px;height:38px;border-radius:var(--r-xs);display:grid;place-items:center;
  flex-shrink:0;border:1px solid var(--border);
}
.btn-icon.go{background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;border:none;}
.btn-icon.clr{background:rgba(7,9,19,.9);color:var(--muted)}
.btn-icon svg{width:16px;height:16px}

.km-hero-compact{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r-sm);border:1px solid rgba(59,130,246,.35);
  background:linear-gradient(145deg,#111936 0%,#070913 100%);padding:10px 14px;
}
.km-value-compact{
  font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.gps{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  min-height:28px;border-radius:var(--r-xs);border:1px solid;padding:0 10px;
  font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.gps.bad{border-color:rgba(100,116,139,.3);background:rgba(11,17,36,.9);color:#e5e7eb}
.gps.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#d1fae5}

.card{border-radius:var(--r-sm);border:1px solid var(--border);background:rgba(11,17,36,0.9);padding:10px;}
.card-accent{border-color:rgba(59,130,246,.35);background:linear-gradient(145deg,rgba(59,130,246,.05),rgba(11,17,36,.9));}

.map-box{
  border-radius:var(--r-xs);border:1px solid var(--border2);
  overflow:hidden;position:relative;height:240px;background:#020617;margin-top:4px;
}
body.fs-active .hdr, body.fs-active .wrap > .section-block:not(:has(#mapBox)) {display:none !important;}
body.fs-active .wrap {max-width:100% !important;padding:0 !important;margin:0 !important;}
body.fs-active .map-box.fullscreen {
  position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;
  z-index:999999 !important;border-radius:0 !important;border:none !important;margin:0 !important;
}

.map-ctrls{
  position:absolute;top:6px;right:6px;z-index:1000;display:flex;gap:4px;
  background:rgba(7,9,19,.9);padding:3px;border-radius:4px;border:1px solid var(--border2);
}
.map-btn{font-size:7.5px;font-weight:900;text-transform:uppercase;padding:3px 6px;border-radius:2px;background:rgba(255,255,255,.05);color:var(--text2);}
.map-btn.active{background:var(--accent);color:#fff}

.fs-close-btn{
  display:none;position:fixed;top:16px;left:16px;z-index:10000000;
  background:rgba(239,68,68,.95);color:#fff;padding:10px 18px;border-radius:var(--r-xs);
  font-size:10px;font-weight:900;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.7);
}
body.fs-active .fs-close-btn {display:inline-flex;}

/* Ficha de Ativo */
.asset-card{
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:rgba(11,17,36,0.95);overflow:hidden;
  display:flex;flex-direction:column;gap:8px;padding:12px;margin-bottom:8px;
}
.asset-card.near{border-color:rgba(16,185,129,.5);background:linear-gradient(145deg,rgba(16,185,129,.1),rgba(11,17,36,.95));}
.asset-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.asset-title{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.02em;}
.asset-badge{font-size:8px;font-weight:900;padding:2px 6px;border-radius:3px;background:rgba(59,130,246,.2);color:var(--accent);border:1px solid var(--border2);}

.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;}
.asset-field{background:rgba(7,9,19,.6);padding:6px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.05);}
.asset-field-lbl{font-size:7px;font-weight:800;color:var(--muted);text-transform:uppercase;}
.asset-field-val{font-size:9px;font-weight:800;color:var(--text);margin-top:2px;word-break:break-word;}

/* Seção de Fibra Óptica */
.fiber-box{
  background:linear-gradient(145deg,rgba(168,85,247,.1),rgba(11,17,36,.9));
  border:1px solid rgba(168,85,247,.3);border-radius:var(--r-xs);padding:8px;margin-top:4px;
}
.fiber-header{font-size:8px;font-weight:900;color:var(--purple);text-transform:uppercase;display:flex;align-items:center;gap:4px;}
.fiber-neighbors{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.fiber-card{
  background:rgba(7,9,19,.8);border:1px solid rgba(168,85,247,.2);
  border-radius:4px;padding:6px;cursor:pointer;transition:all .2s ease;
}
.fiber-card:hover{border-color:var(--purple);background:rgba(168,85,247,.15);}
.fiber-card-lbl{font-size:7px;font-weight:900;color:var(--purple);text-transform:uppercase;}
.fiber-card-id{font-size:8.5px;font-weight:900;color:#fff;margin-top:1px;}
.fiber-card-sub{font-size:7px;font-weight:700;color:var(--muted);}

.btn-wa{
  width:100%;padding:8px;border-radius:var(--r-xs);
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;
  font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;
}

.toast{
  position:fixed;bottom:calc(12px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(10px);border-radius:var(--r-xs);
  border:1px solid var(--border2);background:var(--surface);padding:8px 14px;
  font-size:8.5px;font-weight:800;text-transform:uppercase;z-index:99999;
  opacity:0;transition:all .15s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--accent);border-color:rgba(59,130,246,.4);box-shadow:0 0 10px var(--accent-glow)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-title">Ativos ITS & Apoio Campo</div>
    <div style="font-size:9px;font-weight:900;color:var(--accent);" id="topKmLive">—</div>
  </div>
</header>

<div class="wrap">

  <div class="section-block">
    <div class="menu-pills-grid">
      <button class="menu-pill active" id="pillSearch" onclick="switchTab('search')">🔍 Pesquisa Ativos / KM</button>
      <button class="menu-pill" id="pillMap" onclick="switchTab('map')">🗺️ Mapa Interativo</button>
    </div>

    <!-- PAINEL PESQUISA -->
    <div class="collapsible-pane show" id="paneSearch">
      <div class="card card-accent">
        <div class="search-row">
          <div class="search-wrap">
            <input class="search-input" id="inputSearch" placeholder="DIGITE KM (EX: 115), TAG, HOST, FIBRA..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')triggerSearch()">
          </div>
          <button class="btn-icon go" onclick="triggerSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="btn-icon clr" onclick="clearSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- PAINEL MAPA -->
    <div class="collapsible-pane" id="paneMap">
      <div class="card">
        <div class="map-box" id="mapBox">
          <div class="map-ctrls">
            <button class="map-btn active" id="btnLayerSat" onclick="setMapLayer('sat')">Sat</button>
            <button class="map-btn" id="btnLayerNorm" onclick="setMapLayer('norm')">Norm</button>
            <button class="map-btn" onclick="toggleFullscreen()">Full</button>
          </div>
          <div id="leafletMap" style="width:100%;height:100%;"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="fs-close-btn" onclick="toggleFullscreen()">✕ Sair do Full Screen</button>

  <div class="section-block">
    <div class="km-hero-compact">
      <div>
        <div class="km-value-compact" id="kmVal">—</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <span style="font-size:8px;font-weight:900;color:var(--accent)" id="kmBrBadge">SINTONIZANDO...</span>
        <div id="cityNameDisplay" style="font-size:8.5px;font-weight:800;color:var(--text2);text-transform:uppercase;">---</div>
      </div>
    </div>

    <div id="gpsStatus" class="gps bad">
      <span id="gpsText">GPS · BUSCANDO SINAL</span>
    </div>

    <div id="assetsContainer" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
const norm = s => String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_ ]+/g,' ').replace(/\s+/g,' ');
const parsePt = v => { const s = String(v??'').trim().replace(',','.'); return Number(s); };
const parseKmNum = kmStr => {
  if(!kmStr) return null;
  let s = String(kmStr).trim().toUpperCase().replace('KM','').trim();
  if(s.includes('+')){
    let parts = s.split('+');
    return (parsePt(parts[0]) || 0) + ((parsePt(parts[1]) || 0) / 1000.0);
  }
  return parsePt(s);
};
const hav = (a,b,c,d) => {
  const p = Math.PI/180, x = .5 - Math.cos((c-a)*p)/2 + Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return 12742000 * Math.asin(Math.sqrt(x));
};
const formatDist = dist => {
  const m = Math.max(0, Math.round(dist));
  if (m < 1000) return `${m}m`;
  return `${(m / 1000).toFixed(2).replace('.', ',')} km`;
};

let rawAssets = [];
let kmDB = { 'BR101_SP': [], 'BR101_RJ': [], 'BR116_SP': [], 'BR116_RJ': [] };
let pos = null;
let mapInstance = null, mapMarker = null, mapLayerObj = null;

function showToast(msg, type='ok'){
  const el = document.getElementById('toast');
  el.className = 'toast ' + type; el.textContent = msg;
  requestAnimationFrame(() => { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); });
}

function switchTab(tab){
  document.getElementById('pillSearch').classList.toggle('active', tab==='search');
  document.getElementById('pillMap').classList.toggle('active', tab==='map');
  document.getElementById('paneSearch').classList.toggle('show', tab==='search');
  document.getElementById('paneMap').classList.toggle('show', tab==='map');
  if(tab==='map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 50);
}

function gpsBadge(p, err){
  const el = document.getElementById('gpsStatus');
  const textEl = document.getElementById('gpsText');
  if(err) { el.className = 'gps bad'; textEl.textContent = 'GPS · SEM SINAL'; }
  else { el.className = 'gps ok'; textEl.textContent = `GPS · ALTA PRECISÃO (±${Math.round(p.acc)}M)`; }
}

async function fetchCSV(files){
  for(const f of files){
    try{
      let r = await fetch(f + '?v=' + Date.now(), {cache:'force-cache'});
      if(r?.ok){
        let t = await r.text();
        if(t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
        return t;
      }
    }catch(e){}
  }
  return null;
}

function parseCSVLine(line, delimiter=';'){
  return line.split(delimiter).map(c => c.replace(/^"|"$/g, '').trim());
}

async function initSystemData(){
  initMap(-22.8512, -43.7744);

  // Carrega ativos ITS
  let tAssets = await fetchCSV(['ITS ATIVOX TESTE.csv', 'its_ativos.csv', 'ATIVOS.csv']);
  if(tAssets){
    let lines = tAssets.split(/\r?\n/).filter(l => l.trim());
    if(lines.length > 1){
      let delimiter = lines[0].includes(';') ? ';' : ',';
      let h = parseCSVLine(lines.shift(), delimiter).map(norm);
      let iTag = findCol(h, ['TAG', 'ATIVO']), iEquip = findCol(h, ['EQUIPAMENTO']), iKm = findCol(h, ['KM']), iRod = findCol(h, ['ESTADO', 'RODOVIA']), iHost = findCol(h, ['HOSTNAME', 'HOSTNAME ANTIGO']), iFibra = findCol(h, ['FIBRA']), iIpGer = findCol(h, ['IP GERENCIA']), iIpRede = findCol(h, ['REDE']), iIpSw = findCol(h, ['SWITCH']), iIpAt = findCol(h, ['ATIVO']);
      rawAssets = lines.map(l => {
        let r = parseCSVLine(l, delimiter);
        let tag = r[iTag] || '', kmStr = r[iKm] || '', rod = r[iRod] || '';
        let kmVal = parseKmNum(kmStr);
        return {
          tag: tag.toUpperCase(), equip: r[iEquip] || '', kmStr, kmVal, rod: rod.toUpperCase(),
          host: r[iHost] || '', fibra: r[iFibra] || '', ipGer: r[iIpGer] || '',
          ipRede: r[iIpRede] || '', ipSw: r[iIpSw] || '', ipAt: r[iIpAt] || '',
          rawSearch: norm(`${tag} ${r[iEquip]} ${kmStr} ${rod} ${r[iHost]} ${r[iFibra]} ${r[iIpGer]} ${r[iIpRede]} ${r[iIpSw]} ${r[iIpAt]}`)
        };
      }).filter(a => a.tag && a.kmVal !== null);
    }
  }

  // Carrega bases SNV para GPS e KM
  let [t101SP, t101RJ, t116SP, t116RJ] = await Promise.all([
    fetchCSV(['BR101_SP.csv', 'SNVBR101SP.csv']), fetchCSV(['BR101_RJ.csv', 'SNVBR101RJ.csv']),
    fetchCSV(['BR116_SP.csv', 'SNVBR116SP.csv']), fetchCSV(['BR116_RJ.csv', 'SNVBR116SPRJ.csv', 'SNVBR116RJ.csv'])
  ]);

  kmDB['BR101_SP'] = parseKmGeoFile(t101SP); kmDB['BR101_RJ'] = parseKmGeoFile(t101RJ);
  kmDB['BR116_SP'] = parseKmGeoFile(t116SP); kmDB['BR116_RJ'] = parseKmGeoFile(t116RJ);

  startAutoGps();
}

function findCol(h, cs){
  for(const c of cs){ const i = h.indexOf(norm(c)); if(i >= 0) return i; }
  return 0;
}

function parseKmGeoFile(text){
  if(!text) return [];
  let lines = text.split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return [];
  let delimiter = lines[0].includes(';') ? ';' : ',';
  let h = parseCSVLine(lines.shift(), delimiter).map(norm);
  let iKm = findCol(h, ['KM']), iLat = findCol(h, ['LAT', 'LATITUDE']), iLon = findCol(h, ['LON', 'LONGITUDE']);
  return lines.map(l => {
    let r = parseCSVLine(l, delimiter);
    return { km: parsePt(r[iKm]), lat: parsePt(r[iLat]), lon: parsePt(r[iLon]) };
  }).filter(p => Number.isFinite(p.km) && Number.isFinite(p.lat) && Number.isFinite(p.lon));
}

function findNearestInAnyDB(lat, lon){
  let candidates = Object.keys(kmDB).map(name => {
    let db = kmDB[name];
    let best = null, bd = Infinity;
    for(let p of db){
      if(Math.abs(p.lat - lat) > 0.4 || Math.abs(p.lon - lon) > 0.4) continue;
      let d = hav(lat, lon, p.lat, p.lon);
      if(d < bd){ bd = d; best = { ...p, d }; }
    }
    return { name, res: best };
  }).filter(c => c.res !== null);

  if(!candidates.length) return null;
  candidates.sort((a,b) => a.res.d - b.res.d);
  return candidates[0];
}

function updateKmFromGps(){
  if(!pos) return;
  let nearest = findNearestInAnyDB(pos.lat, pos.lon);
  if(!nearest) return;
  let kmValStr = (Math.round(nearest.res.km*100)/100).toFixed(2).replace('.',',');
  let fullStr = `KM ${kmValStr}`;
  document.getElementById('kmVal').textContent = fullStr;
  document.getElementById('topKmLive').textContent = fullStr;
  document.getElementById('kmBrBadge').textContent = nearest.name;
}

function getAssetCoords(asset){
  let dbKey = '';
  if(asset.tag.includes('101') || asset.rod.includes('101')){
    dbKey = asset.rod.includes('SP') ? 'BR101_SP' : 'BR101_RJ';
  } else {
    dbKey = asset.rod.includes('SP') ? 'BR116_SP' : 'BR116_RJ';
  }
  let db = kmDB[dbKey] || [];
  if(!db.length){
    for(let k in kmDB){ if(kmDB[k].length){ db = kmDB[k]; break; } }
  }
  if(!db.length) return null;
  let best = null, minDiff = Infinity;
  for(let pt of db){
    let diff = Math.abs(pt.km - asset.kmVal);
    if(diff < minDiff){ minDiff = diff; best = pt; }
  }
  return best;
}

function getFiberNeighbors(targetAsset){
  let sameRod = rawAssets.filter(a => a.rod === targetAsset.rod || (a.tag.substring(0,5) === targetAsset.tag.substring(0,5)));
  sameRod.sort((a,b) => a.kmVal - b.kmVal);

  let targetFibers = targetAsset.fibra.split(/[,/ ]+/).map(f => f.trim()).filter(Boolean);

  let prevFiber = null, nextFiber = null;

  for(let a of sameRod){
    if(a.kmVal < targetAsset.kmVal){
      let sharesFiber = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(sharesFiber) prevFiber = a;
    }
    if(a.kmVal > targetAsset.kmVal && !nextFiber){
      let sharesFiber = a.fibra.split(/[,/ ]+/).some(f => f.trim() && targetFibers.includes(f.trim()));
      if(sharesFiber) nextFiber = a;
    }
  }

  return { prevFiber, nextFiber };
}

function triggerSearch(){
  let q = norm(document.getElementById('inputSearch').value);
  if(!q){ renderNearbyAssets(); return; }

  // Se pesquisar por número (ex: 115)
  let numQ = parseFloat(q.replace(',', '.'));
  let matched = [];
  if(!isNaN(numQ) && q.length <= 5){
    // Pesquisa por proximidade de KM
    matched = rawAssets.map(a => ({
      ...a, kmDiff: Math.abs(a.kmVal - numQ)
    })).sort((a,b) => a.kmDiff - b.kmDiff).slice(0, 15);
  } else {
    matched = rawAssets.filter(a => a.rawSearch.includes(q)).slice(0, 15);
  }

  renderAssetsList(matched, `Resultados para "${q}"`);
  showToast(`${matched.length} Ativos Encontrados`);
}

function clearSearch(){
  document.getElementById('inputSearch').value = '';
  renderNearbyAssets();
}

function renderNearbyAssets(){
  if(!pos || !rawAssets.length) return;
  updateKmFromGps();
  let items = rawAssets.map(a => {
    let coords = getAssetCoords(a);
    let d = coords ? hav(pos.lat, pos.lon, coords.lat, coords.lon) : 999999;
    return { ...a, coords, d };
  }).sort((a,b) => a.d - b.d).slice(0, 10);

  renderAssetsList(items, 'Ativos Mais Próximos da Sua Posição (GPS)');
}

function renderAssetsList(items, title){
  let container = document.getElementById('assetsContainer');
  if(!items.length){
    container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:10px;font-weight:800;">NENHUM ATIVO ENCONTRADO</div>`;
    return;
  }

  let html = `<div style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:2px;">${title}</div>`;

  items.forEach((a, idx) => {
    let coords = a.coords || getAssetCoords(a);
    let distStr = (pos && coords) ? formatDist(hav(pos.lat, pos.lon, coords.lat, coords.lon)) : '---';
    let neighbors = getFiberNeighbors(a);
    let isNear = idx === 0 && pos;

    html += `
      <div class="asset-card ${isNear ? 'near' : ''}">
        <div class="asset-header">
          <div>
            <div class="asset-title">${a.tag}</div>
            <div style="font-size:8px;font-weight:800;color:var(--text2);margin-top:1px;">${a.equip} · KM ${a.kmStr} (${a.rod})</div>
          </div>
          <div class="asset-badge">${distStr}</div>
        </div>

        <div class="asset-grid">
          <div class="asset-field"><div class="asset-field-lbl">Hostname</div><div class="asset-field-val">${a.host || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">Fibra Óptica</div><div class="asset-field-val" style="color:var(--purple);">${a.fibra || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">IP Gerência</div><div class="asset-field-val">${a.ipGer || '---'}</div></div>
          <div class="asset-field"><div class="asset-field-lbl">IP Ativo / Rede</div><div class="asset-field-val">${a.ipAt || a.ipRede || '---'}</div></div>
        </div>

        <div class="fiber-box">
          <div class="fiber-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            Vizinhos na Mesma Fibra
          </div>
          <div class="fiber-neighbors">
            <div class="fiber-card" onclick="focusAssetByTag('${neighbors.prevFiber ? neighbors.prevFiber.tag : ''}')">
              <div class="fiber-card-lbl">⬅️ Anterior (Fibra)</div>
              <div class="fiber-card-id">${neighbors.prevFiber ? neighbors.prevFiber.tag : 'Nenhum'}</div>
              <div class="fiber-card-sub">${neighbors.prevFiber ? 'KM ' + neighbors.prevFiber.kmStr : '---'}</div>
            </div>
            <div class="fiber-card" onclick="focusAssetByTag('${neighbors.nextFiber ? neighbors.nextFiber.tag : ''}')">
              <div class="fiber-card-lbl">➡️ Próximo (Fibra)</div>
              <div class="fiber-card-id">${neighbors.nextFiber ? neighbors.nextFiber.tag : 'Nenhum'}</div>
              <div class="fiber-card-sub">${neighbors.nextFiber ? 'KM ' + neighbors.nextFiber.kmStr : '---'}</div>
            </div>
          </div>
        </div>

        <button class="btn-wa" onclick="shareAssetWhatsApp('${a.tag}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Enviar Ficha Completa WhatsApp
        </button>
      </div>
    `;
  });

  container.innerHTML = html;
}

function focusAssetByTag(tag){
  if(!tag) return;
  let found = rawAssets.find(a => a.tag === tag);
  if(!found) return;
  let coords = getAssetCoords(found);
  if(coords && mapInstance){
    mapInstance.setView([coords.lat, coords.lon], 16);
    mapMarker.setLatLng([coords.lat, coords.lon]);
  }
  renderAssetsList([found], `Ativo Selecionado: ${tag}`);
  switchTab('map');
  showToast(`Focado em ${tag}`);
}

function shareAssetWhatsApp(tag){
  let a = rawAssets.find(item => item.tag === tag);
  if(!a) return;
  let coords = getAssetCoords(a);
  let neighbors = getFiberNeighbors(a);

  let tx = `📍 *FICHA TÉCNICA DE ATIVO ITS*\n`;
  tx += `TAG: *${a.tag}*\nEquipamento: ${a.equip}\nKM: ${a.kmStr} (${a.rod})\n`;
  tx += `Hostname: ${a.host}\nFibra: *${a.fibra}*\nIP Gerência: ${a.ipGer}\nIP Ativo: ${a.ipAt}\n\n`;
  tx += `🔌 *VIZINHOS DE FIBRA*\n`;
  tx += `Anterior: ${neighbors.prevFiber ? neighbors.prevFiber.tag + ' (KM ' + neighbors.prevFiber.kmStr + ')' : 'N/A'}\n`;
  tx += `Próximo: ${neighbors.nextFiber ? neighbors.nextFiber.tag + ' (KM ' + neighbors.nextFiber.kmStr + ')' : 'N/A'}\n\n`;
  if(coords){
    tx += `🗺️ *Localização:* https://maps.google.com/?q=${coords.lat.toFixed(5)},${coords.lon.toFixed(5)}`;
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(tx), '_blank', 'noopener');
}

function initMap(lat, lon){
  if(mapInstance) return;
  mapInstance = L.map('leafletMap', {zoomControl:false, attributionControl:false}).setView([lat, lon], 14);
  setMapLayer('sat');
  mapMarker = L.marker([lat, lon]).addTo(mapInstance);
}

function setMapLayer(mode){
  document.getElementById('btnLayerSat').classList.toggle('active', mode==='sat');
  document.getElementById('btnLayerNorm').classList.toggle('active', mode==='norm');
  if(!mapInstance) return;
  if(mapLayerObj) mapInstance.removeLayer(mapLayerObj);
  if(mode==='sat'){
    mapLayerObj = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
  }else{
    mapLayerObj = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
  }
  mapLayerObj.addTo(mapInstance);
}

function toggleFullscreen(){
  let box = document.getElementById('mapBox');
  let isFS = box.classList.toggle('fullscreen');
  document.body.classList.toggle('fs-active', isFS);
  if(mapInstance) setTimeout(() => mapInstance.invalidateSize(), 50);
}

function startAutoGps(){
  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(
      upd => {
        pos = { lat: upd.coords.latitude, lon: upd.coords.longitude, acc: upd.coords.accuracy };
        gpsBadge(pos);
        if(mapInstance && mapMarker){
          mapMarker.setLatLng([pos.lat, pos.lon]);
        }
        updateKmFromGps();
        if(!document.getElementById('inputSearch').value){
          renderNearbyAssets();
        }
      },
      err => gpsBadge(null, true),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
    );
  }
}

window.addEventListener('DOMContentLoaded', initSystemData);
</script>
</body>
</html>
