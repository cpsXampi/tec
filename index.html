<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>INDEX - Localizador de Ativos & IP</title>
<style>
:root {
  --bg: #07090c;
  --s1: #10141a;
  --s2: #171c24;
  --line: rgba(255, 255, 255, 0.12);
  --acc: #ffd600;
  --ok: #34d399;
  --bad: #ef4444;
  --tx: #f2f2f4;
  --mu: #8b8f98;
  --sb: max(env(safe-area-inset-bottom), 16px);
  --st: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: calc(10px + var(--st)) 12px var(--sb);
  gap: 10px;
}

/* Header HUD de KM / GPS */
.hud-card {
  background: linear-gradient(135deg, rgba(4, 90, 64, 0.95), rgba(2, 55, 39, 0.95));
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 12px 16px;
  flex: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.hud-card small { display: block; font-size: 11px; color: #bbf7d0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.hud-card b { display: block; font-size: 28px; line-height: 1.1; color: #fff; margin-top: 2px; font-weight: 900; }
.hud-card .meta { font-size: 11px; color: #bbf7d0; margin-top: 6px; display: flex; justify-content: space-between; font-weight: 500; }

/* Controles de Som e Status de Diagnóstico */
.control-bar {
  display: flex;
  gap: 8px;
  flex: none;
}
.status-badge {
  flex: 1;
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.status-badge small { font-size: 10px; color: var(--mu); text-transform: uppercase; font-weight: 700; }
.status-badge b { font-size: 12px; color: var(--acc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn-bip {
  background: var(--s2);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 12px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.btn-bip.active {
  background: rgba(52, 211, 153, 0.2);
  border-color: var(--ok);
  color: var(--ok);
}

/* Lista de Ativos */
.assets-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 2px;
}
.asset-card {
  background: var(--s1);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.asset-card.nearest {
  background: linear-gradient(135deg, rgba(255, 214, 0, 0.18), rgba(255, 214, 0, 0.05));
  border: 2px solid var(--acc);
  box-shadow: 0 0 16px rgba(255, 214, 0, 0.25);
}
.asset-head { display: flex; justify-content: space-between; align-items: flex-start; }
.asset-title { font-size: 14px; font-weight: 800; color: #fff; }
.asset-card.nearest .asset-title { color: var(--acc); }
.asset-km { font-size: 12px; font-weight: 800; color: var(--acc); background: rgba(255,214,0,0.12); padding: 2px 8px; border-radius: 6px; }

.asset-ip-box {
  background: rgba(0, 0, 0, 0.3);
  border: 1px dashed rgba(255, 255, 255, 0.15);
  padding: 6px 10px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 2px 0;
}
.asset-ip-box b { font-size: 14px; font-family: monospace; color: #34d399; letter-spacing: 0.5px; }

.asset-details { font-size: 11px; color: #c3c6ce; display: flex; flex-direction: column; gap: 3px; }
.asset-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11px; }

.badge-ping {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}
.badge-ping.online { background: rgba(52, 211, 153, 0.2); color: var(--ok); border: 1px solid rgba(52, 211, 153, 0.5); }
.badge-ping.offline { background: rgba(239, 68, 68, 0.25); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.6); }
.badge-ping.checking { background: rgba(255, 214, 0, 0.2); color: var(--acc); border: 1px solid rgba(255, 214, 0, 0.4); }
.badge-ping::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.empty-state { text-align: center; color: var(--mu); margin: auto; font-size: 13px; padding: 20px; line-height: 1.5; }
</style>
</head>
<body>

<div class="app-container">
  <!-- HUD de Posição GPS e KM -->
  <div class="hud-card">
    <small id="locTitle">Obtendo Sinal de GPS...</small>
    <b id="kmLabel">KM ---</b>
    <div class="meta">
      <span id="gpsAcc">GPS: Aguardando permissão</span>
      <span id="coords">0.00000, 0.00000</span>
    </div>
  </div>

  <div class="control-bar">
    <div class="status-badge">
      <small>Status dos Dados</small>
      <b id="dbStatus">Carregando tabelas...</b>
    </div>
    <button class="btn-bip" id="btnBip" onclick="toggleBipAlert()">
      <span id="bipIcon">🔔</span> <span id="bipText">Alerta: OFF</span>
    </button>
  </div>

  <!-- Lista de Ativos Próximos -->
  <div class="assets-container" id="assetsList">
    <div class="empty-state">Iniciando sistema e buscando localização GPS…</div>
  </div>
</div>

<script>
const S = {
  db: [],          // Registros SNV (km, lat, lon)
  assets: [],      // Lista de ativos com IP e KM
  pingStatus: {},
  kmValue: null,
  kmText: '---',
  lat: 0,
  lon: 0,
  acc: null,
  bipActive: false,
  audioCtx: null
};

const $ = id => document.getElementById(id);

/* Conversão robusta de números e KM */
function num(v) {
  if (v === null || v === undefined) return NaN;
  let s = String(v).trim().replace(/^\uFEFF/, '').replace(/^"/, '').replace(/"$/, '');
  if (!s) return NaN;
  if (/^\d{1,3}\s*\+\s*\d{1,3}/.test(s)) {
    const m = s.match(/^(\d{1,3})\s*\+\s*(\d{1,3})(?:[,.](\d+))?/);
    if (m) {
      const parteInteira = Number(m[1]);
      const metros = Number(`${m[2]}${m[3] || ''}`);
      const divisor = Math.pow(10, (m[3] || '').length + 3);
      return parteInteira + (metros / divisor);
    }
  }
  s = s.replace(/\./g, '').replace(',', '.');
  return Number(s);
}

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Parser robusto de CSV lidando com aspas e delimitadores */
function parseCSV(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  
  const lines = [];
  let curLine = [];
  let curVal = '';
  let insideQuotes = false;
  
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i+1];
    
    if (c === '"') {
      if (insideQuotes && next === '"') {
        curVal += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if ((c === ';' || c === ',') && !insideQuotes) {
      curLine.push(curVal.trim());
      curVal = '';
    } else if ((c === '\r' || c === '\n') && !insideQuotes) {
      if (c === '\r' && next === '\n') i++;
      curLine.push(curVal.trim());
      if (curLine.some(x => x.length > 0)) lines.push(curLine);
      curLine = [];
      curVal = '';
    } else {
      curVal += c;
    }
  }
  if (curVal.length > 0 || curLine.length > 0) {
    curLine.push(curVal.trim());
    lines.push(curLine);
  }
  return lines;
}

/* Leitura e parsing do SNV (KM x Latitude/Longitude) */
function parseKmCsv(t) {
  const rows = parseCSV(t);
  if (rows.length < 2) return [];
  
  const header = rows[0].map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const idxKm = header.findIndex(x => x.includes('km'));
  const idxLat = header.findIndex(x => x.includes('lat'));
  const idxLon = header.findIndex(x => x.includes('lon') || x.includes('long'));
  
  if (idxKm < 0 || idxLat < 0 || idxLon < 0) return [];
  
  const res = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const k = num(r[idxKm]);
    const la = num(r[idxLat]);
    const lo = num(r[idxLon]);
    if (Number.isFinite(k) && Number.isFinite(la) && Number.isFinite(lo)) {
      res.push({ km: k, lat: la, lon: lo });
    }
  }
  return res;
}

/* Leitura dos Ativos (com Tag, Equipamento, KM, IP, Fibra) */
function parseAssetsCsv(t) {
  const rows = parseCSV(t);
  if (rows.length < 2) return [];
  
  const header = rows[0].map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const idxTag = header.findIndex(x => x === 'tag' || x.includes('ativo') || x.includes('nome'));
  const idxEquip = header.findIndex(x => x.includes('equip') || x.includes('tipo'));
  const idxKm = header.findIndex(x => x === 'km' || x.includes('quilomet'));
  const idxIp = header.findIndex(x => x === 'ip' || x.includes('enderecoip') || x.includes('enderecip'));
  const idxFibra = header.findIndex(x => x.includes('fibra') || x.includes('anel') || x.includes('circuito'));
  
  if (idxKm < 0) return [];
  
  const res = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const rawKm = r[idxKm] || '';
    const parsedKm = num(rawKm);
    if (Number.isFinite(parsedKm)) {
      res.push({
        tag: idxTag >= 0 ? r[idxTag] : 'Ativo',
        equip: idxEquip >= 0 ? r[idxEquip] : 'Equipamento',
        km: parsedKm,
        kmLabel: rawKm || parsedKm.toFixed(3),
        ip: idxIp >= 0 ? r[idxIp] : '',
        fibra: idxFibra >= 0 ? r[idxFibra] : 'FIBRA-PRINCIPAL'
      });
    }
  }
  return res.sort((a, b) => a.km - b.km);
}

/* Encontrar KM da rodovia mais próximo das coordenadas do celular */
function nearestKm(la, lo) {
  if (!S.db.length) return null;
  let best = S.db[0], minDist = Infinity;
  const rad = Math.PI / 180, R = 6371000;
  
  for (let i = 0; i < S.db.length; i++) {
    const p = S.db[i];
    const dLat = (p.lat - la) * rad;
    const dLon = (p.lon - lo) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(la * rad) * Math.cos(p.lat * rad) * Math.sin(dLon / 2) ** 2;
    const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    if (dist < minDist) {
      minDist = dist;
      best = p;
    }
  }
  return { km: best.km, dist: minDist };
}

/* Busca binária para achar o ativo com KM mais próximo da posição atual */
function findNearestAssetIndex(currentKm) {
  if (!S.assets.length) return -1;
  let low = 0, high = S.assets.length - 1;
  while (low <= high) {
    const mid = (low + high) >> 1;
    if (S.assets[mid].km < currentKm) low = mid + 1;
    else high = mid - 1;
  }
  if (low >= S.assets.length) return S.assets.length - 1;
  if (low <= 0) return 0;
  return Math.abs(S.assets[low].km - currentKm) < Math.abs(S.assets[low - 1].km - currentKm) ? low : low - 1;
}

/* Pega os 4 ativos mais próximos em torno do KM atual */
function getNearestAssets(currentKm) {
  if (!S.assets.length) return { list: [], nearestAsset: null };
  const centerIdx = findNearestAssetIndex(currentKm);
  const nearestAsset = S.assets[centerIdx];
  
  const start = Math.max(0, centerIdx - 1);
  const list = S.assets.slice(start, start + 4);
  return { list, nearestAsset };
}

/* Simulação / Teste de IP */
async function pingIp(ip) {
  if (!ip) return 'no-ip';
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), 1000);
  try {
    await fetch(ip.startsWith('http') ? ip : `http://${ip}`, { mode: 'no-cors', signal: controller.signal, cache: 'no-store' });
    clearTimeout(id);
    return 'online';
  } catch (e) {
    clearTimeout(id);
    return (e.name === 'AbortError') ? 'offline' : 'online';
  }
}

async function checkAssetPings(displayAssets) {
  let hasOffline = false;
  for (const asset of displayAssets) {
    if (!asset.ip) continue;
    const res = await pingIp(asset.ip);
    S.pingStatus[asset.ip] = res;
    if (res === 'offline') hasOffline = true;
  }
  if (S.bipActive && hasOffline) playBeep(440, 300);
  renderAssetsUI();
}

function renderAssetsUI() {
  const current = S.kmValue;
  if (!Number.isFinite(current)) {
    $('assetsList').innerHTML = '<div class="empty-state">Aguardando coordenadas GPS para calcular o KM e localizar os ativos mais próximos...</div>';
    return;
  }
  
  if (!S.assets.length) {
    $('assetsList').innerHTML = '<div class="empty-state">Nenhum ativo carregado da planilha. Verifique o arquivo CSV de ativos.</div>';
    return;
  }

  const { list, nearestAsset } = getNearestAssets(current);

  $('assetsList').innerHTML = list.map(a => {
    const isNearest = a === nearestAsset;
    const deltaKm = a.km - current;
    const distMetros = Math.abs(deltaKm * 1000).toFixed(0);
    const dir = deltaKm < 0 ? 'atrás' : deltaKm > 0 ? 'à frente' : 'exatamente no local';
    const st = S.pingStatus[a.ip] || 'checking';

    let badgeClass = 'checking', badgeText = 'CHECANDO';
    if (st === 'online') { badgeClass = 'online'; badgeText = 'ONLINE'; }
    else if (st === 'offline') { badgeClass = 'offline'; badgeText = 'OFFLINE'; }
    if (!a.ip) { badgeClass = 'checking'; badgeText = 'SEM IP'; }

    return `<div class="asset-card${isNearest ? ' nearest' : ''}">
      <div class="asset-head">
        <span class="asset-title">${isNearest ? '★ ATIVO MAIS PRÓXIMO · ' : ''}${escapeHtml(a.tag || a.equip)}</span>
        <span class="asset-km">KM ${escapeHtml(a.kmLabel)}</span>
      </div>
      
      <div class="asset-ip-box">
        <small style="color: var(--mu); font-size: 11px;">IP DO ATIVO:</small>
        <b>${a.ip ? escapeHtml(a.ip) : 'NÃO CONFIGURADO'}</b>
      </div>

      <div class="asset-details">
        <span><b>Equipamento:</b> ${escapeHtml(a.equip)}</span>
        <span><b>Circuito/Fibra:</b> ${escapeHtml(a.fibra)}</span>
      </div>

      <div class="asset-foot">
        <span>Distância: <b>${distMetros} metros</b> (${dir})</span>
        <span class="badge-ping ${badgeClass}">${badgeText}</span>
      </div>
    </div>`;
  }).join('');
}

function renderAssets() {
  const current = S.kmValue;
  if (!S.assets.length || !Number.isFinite(current)) return;
  const { list } = getNearestAssets(current);
  renderAssetsUI();
  checkAssetPings(list);
}

function updateLocationUI() {
  $('kmLabel').textContent = S.kmText === '---' ? 'KM ---' : `KM ${S.kmText}`;
  $('locTitle').textContent = 'KM Localizado (GPS Ativo)';
  $('gpsAcc').textContent = S.acc !== null ? `Precisão GPS ±${Math.round(S.acc)} m` : 'GPS Ativo';
  $('coords').textContent = `${S.lat.toFixed(5)}, ${S.lon.toFixed(5)}`;
}

function refreshNearest() {
  if (!S.db.length || !S.lat) return;
  const n = nearestKm(S.lat, S.lon);
  if (n) {
    S.kmValue = n.km;
    S.kmText = (Math.round(n.km * 100) / 100).toFixed(2).replace('.', ',');
    updateLocationUI();
    renderAssets();
  }
}

function updateDbStatus() {
  $('dbStatus').textContent = `SNV: ${S.db.length} Pts | Ativos: ${S.assets.length}`;
}

function playBeep(freq = 880, duration = 150) {
  try {
    if (!S.audioCtx) S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (S.audioCtx.state === 'suspended') S.audioCtx.resume();
    const osc = S.audioCtx.createOscillator();
    const gain = S.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, S.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, S.audioCtx.currentTime + duration / 1000);
    osc.connect(gain);
    gain.connect(S.audioCtx.destination);
    osc.start();
    osc.stop(S.audioCtx.currentTime + duration / 1000);
  } catch(e) {}
}

function toggleBipAlert() {
  S.bipActive = !S.bipActive;
  $('btnBip').className = S.bipActive ? 'btn-bip active' : 'btn-bip';
  $('bipIcon').textContent = S.bipActive ? '🚨' : '🔔';
  $('bipText').textContent = S.bipActive ? 'Alerta: ON' : 'Alerta: OFF';
  if(S.bipActive) playBeep(1200, 200);
}

/* Carregamento automático dos CSVs tentando nomes padrão */
async function loadData() {
  try {
    // 1. Tenta carregar SNV
    let r = await fetch('SNVBR116SPRJ.csv?v=' + Date.now());
    if (r.ok) {
      const txt = await r.text();
      S.db = parseKmCsv(txt);
    }
    
    // 2. Tenta carregar Ativos em possíveis variações de nome de arquivo
    const assetFiles = ['ativos 116.csv', 'ativos 116 (1).csv', 'ativos_116.csv', 'ativos.csv'];
    for (const file of assetFiles) {
      try {
        r = await fetch(encodeURI(file + '?v=' + Date.now()));
        if (r.ok) {
          const txt = await r.text();
          const parsed = parseAssetsCsv(txt);
          if (parsed.length > 0) {
            S.assets = parsed;
            break;
          }
        }
      } catch(e) {}
    }
    
    updateDbStatus();
    refreshNearest();
  } catch(e) {
    console.error("Erro na carga de dados:", e);
  }
}

loadData();

/* Monitoramento GPS Contínuo do Dispositivo Móvel */
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    S.lat = p.coords.latitude;
    S.lon = p.coords.longitude;
    S.acc = p.coords.accuracy;
    refreshNearest();
  }, (err) => {
    $('locTitle').textContent = 'Permissão de GPS necessária no celular!';
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
} else {
  $('locTitle').textContent = 'Dispositivo sem suporte a GPS';
}
</script>
</body>
</html>
