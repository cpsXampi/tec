<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KM Report — Sistema de Apoio & Inspeção</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --bg:#06070a;--bg2:#0a0d11;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.16);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --accent-dim:rgba(255,214,0,.06);--accent-glow:rgba(255,214,0,.15);
  --green:#10b981;--green2:#34d399;--green3:#059669;--red:#ef4444;--warn:#f59e0b;
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;--dim:#3f3f46;--dimmer:#27272a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--r-2xl:28px;
  --safe-b:max(env(safe-area-inset-bottom,0px),18px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none} body{position:relative} button,input,select{font:inherit} button{cursor:pointer;border:0;background:none;color:inherit;-webkit-user-select:none;user-select:none} input,select{outline:none} a{color:inherit} ::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}

#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .45s var(--ease);}
#splash.done{opacity:0;pointer-events:none}
.sp-bar-container{width:190px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;box-shadow:0 0 20px rgba(255,214,0,.2)}
#sp-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}

#main-menu{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) 20px calc(22px + var(--safe-b));background:radial-gradient(circle at top, rgba(255,214,0,.14), transparent 32%), #06070a}
.menu-inner{width:min(760px,100%)}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mc{position:relative;min-height:260px;padding:26px;border-radius:30px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.015));overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start;box-shadow:var(--shadow-xl)}
.mc::before{content:"";position:absolute;left:-52px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--card-glow);opacity:.26;filter:blur(4px)}
.mc:active{transform:scale(.985)}
.mc.pri{--card:#ffd600;--card2:#b89500;--card-glow:#ffd600;border-color:rgba(255,214,0,.28)}
.mc.sec-btn{--card:#34d399;--card2:#047857;--card-glow:#10b981;border-color:rgba(52,211,153,.25)}
.mc-i{position:absolute;left:24px;top:24px;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,var(--card),var(--card2));color:#05070a;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.mc-i svg{width:34px;height:34px}
.mc-b{position:relative;z-index:1;max-width:260px;padding-top:90px}
.mc-b h3{font-size:clamp(19px,3.8vw,27px);line-height:1.02;font-weight:950;letter-spacing:-.035em;margin:0}
.mc-b p{margin-top:8px;font-size:12px;line-height:1.5;color:var(--text3);font-weight:600}
.mc-a{position:absolute;right:22px;top:24px;width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--text2)}
.mc-a svg{width:16px;height:16px}
@media(max-width:620px){.menu-grid{grid-template-columns:1fr}.mc{min-height:200px}.mc-i{width:62px;height:62px}.mc-i svg{width:28px;height:28px}}

.module{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:var(--bg);z-index:10}
.module.active{display:block}

#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow-y:auto}
.gate-box{max-width:420px;width:100%;padding:34px 24px;border-radius:var(--r-xl);border:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface2));box-shadow:var(--shadow-xl);text-align:center}
.gate-icon{width:72px;height:72px;margin:0 auto;border-radius:20px;background:linear-gradient(135deg,var(--accent-dim),rgba(255,214,0,.06));border:1px solid rgba(255,214,0,.12);color:var(--accent);display:grid;place-items:center}
.gate-icon svg{width:36px;height:36px}
.gate-box h1{font-size:22px;font-weight:900;margin-top:24px}
.gate-box>p{font-size:12px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.6}
.gate-err{margin-top:16px;padding:12px;border-radius:var(--r-sm);background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);font-size:11px;font-weight:700;color:#fca5a5;text-align:left;display:none}
.gate-btn-discreet{width:100%;min-height:42px;border-radius:var(--r-sm);background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--text);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.gate-btn-discreet:active{transform:scale(.98);background:rgba(255,255,255,.1)}
.gate-btn-discreet.sec{background:transparent;border-color:transparent;color:var(--muted);margin-top:6px}

#app-shell{position:relative;width:100vw;height:100vh;height:100dvh;visibility:hidden;overflow:hidden}
#vid,#vidUnica{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000}
#km-hud{position:absolute;top:calc(18px + var(--safe-t));left:14px;min-width:170px;padding:10px 18px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.1);background:rgba(4,120,87,.78);box-shadow:var(--shadow-sm)}
#km-hud .h-l{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:rgba(220,252,231,.58)}
#km-hud .h-v{font-size:26px;font-weight:900;line-height:1.1;margin-top:2px}
#label-hud{position:absolute;top:calc(90px + var(--safe-t));right:14px;max-width:220px;padding:10px 10px 8px;border-radius:var(--r-sm);border:1px solid rgba(255,214,0,.3);background:rgba(0,0,0,.68);box-shadow:var(--shadow-sm)}
#label-hud p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,214,0,.75);margin-bottom:6px}
#label-hud input{width:100%;background:transparent;border:0;outline:none;color:#fdf6d7;font-size:12px;font-weight:700}
#rec-tag{position:absolute;top:calc(20px + var(--safe-t));right:14px;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);opacity:.9;box-shadow:var(--shadow-sm)}
#rec-tag.on{opacity:1}
#rec-tag .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.1}}
#rec-tag span{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}

#ui-ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 18px calc(24px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.35) 55%,transparent);z-index:200}
.ui-btn{height:52px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s var(--ease);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.ui-btn:active{transform:scale(.94)}
.ui-btn svg{width:18px;height:18px}
#btn-gear{width:52px;flex-shrink:0;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);color:var(--text2)}
#btn-start{flex:1;min-width:120px;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#000;box-shadow:0 6px 24px rgba(255,214,0,.18)}
#btn-stop{flex:1;min-width:120px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;display:none;box-shadow:0 6px 24px rgba(220,38,38,.2)}
#btn-menu{flex-shrink:0;padding:0 16px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);color:var(--text2)}
#btn-report-snapshot{display:none;width:58px;min-width:58px;height:52px;flex:0 0 58px;border:1px solid rgba(255,255,255,.18);background:rgba(5,8,11,.84);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 8px 16px rgba(0,0,0,.28)}
#btn-report-snapshot svg{width:20px;height:20px;color:var(--accent)}
#btn-report-snapshot span{font-size:7px;font-weight:900}

#settings,#settingsUnica{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease;z-index:1000}
#settings.open,#settingsUnica.open{opacity:1;visibility:visible;pointer-events:auto}
.settings-content{width:min(90vw,420px);max-height:85vh;padding:24px;border-radius:var(--r-xl);border:1px solid var(--border2);background:rgba(10,13,17,.96);overflow-y:auto;box-shadow:var(--shadow-xl);transform:scale(.98);transition:transform .2s var(--ease)}
#settings.open .settings-content,#settingsUnica.open .settings-content{transform:scale(1)}
.settings-close{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:20px;border:0;background:none;padding:0}
.settings-close svg{width:14px;height:14px}
.settings-content h2{font-size:18px;font-weight:900;margin:0}
.s-group{margin-top:22px}
.s-lbl{display:block;margin-bottom:7px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.s-inp{width:100%;padding:13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:#fff;font-size:13px;font-weight:800}
.toggle-row{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);cursor:pointer;color:var(--text2);font-size:12px;line-height:1.5}
.toggle-row input{width:16px;height:16px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}
.toggle-row strong{color:var(--text);font-weight:800}
.s-note{margin-top:7px;color:var(--muted);font-size:10px;line-height:1.45}
.ai-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,214,0,.25);background:rgba(255,214,0,.06);color:var(--accent);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}
.ai-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(16,185,129,.7)}

#captureCount{position:absolute;left:50%;top:calc(18px + var(--safe-t));transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);color:#fff;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;z-index:120}

.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%) translateY(16px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);color:#fff;font-size:11px;font-weight:700;opacity:0;transition:all .18s ease;z-index:99999;max-width:min(88vw,420px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(16,185,129,.25);color:var(--green2)}
.toast.err{border-color:rgba(239,68,68,.25);color:#fca5a5}
.toast svg{width:14px;height:14px;flex-shrink:0}
.toast.quick-photo{top:calc(18px + var(--safe-t));right:14px;left:auto;bottom:auto;max-width:min(60vw,240px);padding:7px 11px;font-size:9px;border-color:rgba(255,214,0,.35);background:rgba(12,15,20,.88);color:#fff;transform:translateY(-8px)}
.toast.quick-photo.show{transform:translateY(0)}
canvas{display:none}

@media(max-width:390px){#ui-ctrl{gap:6px;padding-left:10px;padding-right:10px}#btn-menu{padding:0 9px}#btn-stop{font-size:9px;margin-left:2px}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-bar-container"><div id="sp-bar"></div></div>
</div>

<div id="main-menu">
  <div class="menu-inner">
    <div class="menu-grid">
      <button class="mc pri" onclick="openModule('foto-unica')">
        <span class="mc-i">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </span>
        <span class="mc-b">
          <h3>Foto e Vídeo</h3>
          <p>Capture fotos e vídeos com KM, GPS e etiqueta.</p>
        </span>
        <span class="mc-a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>

      <button class="mc sec-btn" onclick="openModule('inspecao')">
        <span class="mc-i">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"></path><path d="M14 2v6h6"></path><path d="M8 13h8M8 17h8"></path></svg>
        </span>
        <span class="mc-b">
          <h3>Inspeção</h3>
          <p>Relatórios, lote, PDF e captura inteligente por movimento ou voz.</p>
        </span>
        <span class="mc-a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
    </div>
  </div>
</div>

<div id="mod-foto-unica" class="module">
  <video id="vidUnica" autoplay playsinline muted></video>
  <div id="km-hud" style="left:14px;top:calc(18px + var(--safe-t));">
    <span class="h-l">KM atual</span>
    <p class="h-v" id="kmTxtUnica">KM ---</p>
  </div>

  <div style="position:absolute;top:calc(18px + var(--safe-t));right:14px;display:flex;align-items:center;gap:8px;z-index:50;">
    <button id="aiBadgeUnica" class="ai-chip" style="display:none" onclick="toggleSetUnica()"><span class="dot"></span>IA local</button>
    <button onclick="openModule('menu')" style="height:42px;padding:0 16px;color:#fff;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.58);font-size:11px;font-weight:800;letter-spacing:.08em;">Menu</button>
  </div>

  <div id="settingsUnica">
    <div class="settings-content">
      <button class="settings-close" onclick="toggleSetUnica()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Fechar</button>
      <h2>Configurações</h2>
      <div class="s-group">
        <label class="s-lbl">Câmera ativa</label>
        <select class="s-inp" id="camSelUnica" onchange="switchCamUnica(this.value)"></select>
        <p id="camStatusUnica" class="s-note">A câmera do ambiente será usada quando disponível.</p>
      </div>
      <div class="s-group">
        <label class="s-lbl">Etiqueta</label>
        <input class="s-inp" id="fotoLabelUnica" type="text" maxlength="80" placeholder="Ex.: Inspeção, Vistoria, Manutenção..." autocomplete="off" spellcheck="false">
      </div>
      <div class="s-group">
        <label class="s-lbl">Metadados visuais</label>
        <label class="toggle-row"><input type="checkbox" id="discreteModeUnica"> <span><strong>Modo discreto</strong><br>Oculta KM, GPS, data e etiqueta na foto/vídeo salvo.</span></label>
      </div>
      <div class="s-group">
        <label class="s-lbl">Agentes de IA</label>
        <label class="toggle-row"><input type="checkbox" id="aiMotionUnica"> <span><strong>Captura por movimento</strong><br>Dispara foto ao detectar movimento forte.</span></label>
        <label class="toggle-row"><input type="checkbox" id="aiVoiceUnica"> <span><strong>Comandos por voz</strong><br>“fotografar”, “iniciar”, “parar”, “etiqueta”.</span></label>
        <label class="toggle-row"><input type="checkbox" id="aiBackgroundUnica"> <span><strong>Manter ativo em segundo plano</strong><br>Ajuda com tela apagada ou uso contínuo.</span></label>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;gap:16px;align-items:center;justify-content:center;padding:0 18px calc(24px + var(--safe-b));background:linear-gradient(to top,rgba(0,0,0,.84),rgba(0,0,0,.3) 55%,transparent);z-index:200;">
    <button class="ui-btn" id="btn-gear" aria-label="Abrir configurações" onclick="toggleSetUnica()" style="width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(8,10,13,.72);color:#fff;display:grid;place-items:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <button onclick="takeSinglePhoto()" style="width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15);display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.28);flex-shrink:0;">
      <div style="width:56px;height:56px;border-radius:50%;background:#fff;"></div>
    </button>
    <button id="btnRecVideoUnica" onclick="toggleVideoRecordingUnica()" style="width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;flex-shrink:0;">
      <svg id="iconVideoUnica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
    </button>
  </div>
  <canvas id="cUnica"></canvas>
</div>

<div id="mod-inspecao" class="module">
  <div id="gate">
    <div class="gate-box">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      </div>
      <h1>Inspeção Fotográfica</h1>
      <p>Selecione a pasta de destino e inicie a captura por câmera, voz, movimento ou relatório em lote.</p>
      <div id="gateErr" class="gate-err"></div>
      <div style="margin-top:20px;text-align:left;">
        <label style="display:block;margin-bottom:8px;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;">Etiqueta</label>
        <input id="fotoLabel" type="text" placeholder="Ex.: Manutenção, Vistoria, Inspeção..." autocomplete="off" spellcheck="false" oninput="syncFotoLabel(this.value)" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;font-size:13px;font-weight:700;">
      </div>
      <button class="gate-btn-discreet" onclick="startApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M7 20h10"></path></svg>
        Iniciar câmera
      </button>
      <button class="gate-btn-discreet sec" onclick="openModule('menu')">Voltar ao menu</button>
    </div>
  </div>

  <div id="settings">
    <div class="settings-content">

        Parar

      <button class="ui-btn" id="btn-report-snapshot" onclick="takeReportSnapshot()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="4"></circle></svg>

</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
(() => {
  const splash = document.getElementById('splash');
  const bar = document.getElementById('sp-bar');
  let started = 0;
  const run = (ts) => {
    if (!started) started = ts;
    const p = Math.min((ts - started) / 1400, 1);
    if (bar) bar.style.width = (p * 100) + '%';
    if (p < 1) requestAnimationFrame(run);
    else {
      splash.classList.add('done');
      setTimeout(() => splash.remove(), 420);
    }
  };
  requestAnimationFrame(run);
})();

const STORAGE_KEY = 'km-report-ai-config-v1';
const state = {
  module: null,
  stream: null,
  streamUnica: null,
  dirHandle: null,
  currentKm: '---',
  lat: '0.000000',
  lon: '0.000000',
  kmDB: [],
  captureTimer: null,
  captureRunning: false,
  captureBusy: false,
  buffer: [],
  captureLimit: 150,
  captureInterval: 200,
  batchNo: 1,
  pdfQueue: [],
  pdfBusy: false,
  savedBatches: 0,
  recordingUnica: false,
  mediaRecorder: null,
  recorderChunks: [],
  settingsOpen: false,
  ai: {
    motion: false,
    voice: false,
    background: false,
    recognition: null,
    wakeLock: null,
    motionHandler: null,
    lastMotionTs: 0,
  },
  discrete: {
    unica: false,
    inspecao: false
  }
};

function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  const icons = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4"/><path d="m12 16h.01"/><circle cx="12" cy="12" r="10"/></svg>'
  };
  el.className = 'toast ' + type;
  el.innerHTML = (icons[type] || '') + msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function showQuickPhotoToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.className = 'toast quick-photo ' + type;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => el.classList.remove('show'), 600);
}

function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    discrete: state.discrete,
    ai: {
      motion: state.ai.motion,
      voice: state.ai.voice,
      background: state.ai.background
    }
  }));
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    state.discrete = Object.assign(state.discrete, data.discrete || {});
    state.ai.motion = !!(data.ai && data.ai.motion);
    state.ai.voice = !!(data.ai && data.ai.voice);
    state.ai.background = !!(data.ai && data.ai.background);
  } catch (e) {
    console.warn('Configuração inválida', e);
  }
}

function syncSettingsInputs() {
  const d1 = document.getElementById('discreteModeUnica');
  const d2 = document.getElementById('discreteModeInspecao');
  if (d1) d1.checked = !!state.discrete.unica;
  if (d2) d2.checked = !!state.discrete.inspecao;

  const m1 = document.getElementById('aiMotionUnica');
  const m2 = document.getElementById('aiMotionInspecao');
  const v1 = document.getElementById('aiVoiceUnica');
  const v2 = document.getElementById('aiVoiceInspecao');
  const b1 = document.getElementById('aiBackgroundUnica');
  const b2 = document.getElementById('aiBackgroundInspecao');
  if (m1) m1.checked = state.ai.motion;
  if (m2) m2.checked = state.ai.motion;
  if (v1) v1.checked = state.ai.voice;
  if (v2) v2.checked = state.ai.voice;
  if (b1) b1.checked = state.ai.background;
  if (b2) b2.checked = state.ai.background;

  const chip = document.getElementById('aiBadgeUnica');
  if (chip) chip.style.display = (state.ai.motion || state.ai.voice || state.ai.background) ? 'inline-flex' : 'none';
}

function applyDiscreteState() {
  const visible = !state.discrete.inspecao;
  const recTag = document.getElementById('rec-tag');
  if (recTag) recTag.style.display = visible ? 'flex' : 'none';
}

function bindSettings() {
  document.getElementById('discreteModeUnica')?.addEventListener('change', (e) => {
    state.discrete.unica = !!e.target.checked;
    saveSettings();
    showToast(state.discrete.unica ? 'Modo discreto ativado na foto/vídeo' : 'Modo padrão ativado');
  });

  document.getElementById('discreteModeInspecao')?.addEventListener('change', (e) => {
    state.discrete.inspecao = !!e.target.checked;
    saveSettings();
    showToast(state.discrete.inspecao ? 'Modo discreto ativado no relatório' : 'Modo padrão ativado');
  });

  document.getElementById('aiMotionUnica')?.addEventListener('change', (e) => {
    state.ai.motion = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });
  document.getElementById('aiMotionInspecao')?.addEventListener('change', (e) => {
    state.ai.motion = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });

  document.getElementById('aiVoiceUnica')?.addEventListener('change', (e) => {
    state.ai.voice = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });
  document.getElementById('aiVoiceInspecao')?.addEventListener('change', (e) => {
    state.ai.voice = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });

  document.getElementById('aiBackgroundUnica')?.addEventListener('change', (e) => {
    state.ai.background = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });
  document.getElementById('aiBackgroundInspecao')?.addEventListener('change', (e) => {
    state.ai.background = !!e.target.checked;
    saveSettings();
    updateAIAssistantState();
  });
}

function openModule(target) {
  const menu = document.getElementById('main-menu');
  if (target === 'menu') {
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    document.getElementById('settings').classList.remove('open');
    document.getElementById('settingsUnica').classList.remove('open');
    menu.style.display = 'flex';
    state.module = null;
    stopAllStreams();
    document.getElementById('app-shell').style.visibility = 'hidden';
    document.getElementById('gate').style.display = 'flex';
    return;
  }

  if (!state.dirHandle && target === 'inspecao') {
    document.getElementById('gateErr').style.display = 'none';
  }

  menu.style.display = 'none';
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  const moduleNode = document.getElementById('mod-' + target);
  if (moduleNode) moduleNode.classList.add('active');
  state.module = target;

  if (target === 'foto-unica') {
    initSingleCamera();
  }
}

function stopAllStreams() {
  [state.stream, state.streamUnica].forEach(stream => {
    if (stream) stream.getTracks().forEach(track => track.stop());
  });
  state.stream = null;
  state.streamUnica = null;
  const v = document.getElementById('vid');
  const vU = document.getElementById('vidUnica');
  if (v) v.srcObject = null;
  if (vU) vU.srcObject = null;
}

async function chooseDirectoryForModule() {
  if ('showDirectoryPicker' in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      let perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') throw new Error('Permissão de pasta negada');
      state.dirHandle = handle;
      showToast('Pasta de destino selecionada');
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') {
        showToast('Seleção cancelada', 'err');
      } else {
        showToast('Não foi possível acessar a pasta', 'err');
      }
      return false;
    }
  }
  state.dirHandle = null;
  showToast('Uso em navegador desktop: a seleção da pasta ficará disponível em Chrome/Edge.', 'err');
  return false;
}

async function startApp() {
  const ok = await chooseDirectoryForModule();
  if (!ok) return;
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const vid = document.getElementById('vid');
    vid.srcObject = state.stream;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app-shell').style.visibility = 'visible';
    document.getElementById('app-shell').scrollIntoView({ behavior: 'instant' });
    loadCameraList();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {
    const gateErr = document.getElementById('gateErr');
    gateErr.style.display = 'block';
    gateErr.textContent = 'Erro ao acessar câmera: ' + (e.message || 'desconhecido');
  }
}

async function initSingleCamera() {
  try {
    state.streamUnica = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const vid = document.getElementById('vidUnica');
    vid.srcObject = state.streamUnica;
    loadCameraListUnica();
    const c = document.getElementById('cUnica');
    const ctx = c.getContext('2d');
    setInterval(() => {
      const video = document.getElementById('vidUnica');
      if (!video || !video.videoWidth) return;
      if (c.width !== video.videoWidth || c.height !== video.videoHeight) {
        c.width = video.videoWidth;
        c.height = video.videoHeight;
      }
      drawOverlayCustom(ctx, video, c.width, c.height, state.currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${state.lat}, ${state.lon}`, document.getElementById('fotoLabelUnica').value, !!state.discrete.unica);
    }, 90);
  } catch (e) {
    showToast('Erro ao acessar câmera do módulo único', 'err');
  }
}

async function loadCameraList() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const video = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('camSel');
    sel.innerHTML = '';
    if (!video.length) return;
    video.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = `Câmera ${idx + 1}`;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.warn('Câmeras não disponíveis', e);
  }
}

async function loadCameraListUnica() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const video = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('camSelUnica');
    sel.innerHTML = '';
    if (!video.length) return;
    video.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = `Câmera ${idx + 1}`;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.warn('Câmeras únicas não disponíveis', e);
  }
}

async function switchCam(deviceId) {
  if (state.stream) state.stream.getTracks().forEach(track => track.stop());
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('vid').srcObject = state.stream;
    showToast('Câmera alterada');
  } catch (e) {
    showToast('Não foi possível trocar a câmera', 'err');
  }
}

async function switchCamUnica(deviceId) {
  if (state.streamUnica) state.streamUnica.getTracks().forEach(track => track.stop());
  try {
    state.streamUnica = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('vidUnica').srcObject = state.streamUnica;
    showToast('Câmera única alterada');
  } catch (e) {
    showToast('Não foi possível trocar a câmera', 'err');
  }
}

function toggleSet() {
  document.getElementById('settings').classList.toggle('open');
}

function toggleSetUnica() {
  document.getElementById('settingsUnica').classList.toggle('open');
}

function syncFotoLabel(value) {
  const live = document.getElementById('fotoLabelLive');
  const gate = document.getElementById('fotoLabel');
  const unica = document.getElementById('fotoLabelUnica');
  if (live) live.value = value;
  if (gate) gate.value = value;
  if (unica) unica.value = value;
}

function updateCaptureHUD() {
  const limit = Math.max(parseInt(document.getElementById('cfgLote').value) || 150, 1);
  document.getElementById('captureCount').textContent = `Lote ${state.batchNo} · ${state.buffer.length} / ${limit}`;
}

function startCap() {
  if (!state.dirHandle) {
    showToast('Selecione a pasta antes de iniciar a sessão', 'err');
    return;
  }
  if (state.captureRunning) return;

  state.captureRunning = true;
  state.buffer = [];
  state.batchNo = 1;
  state.captureLimit = Math.max(parseInt(document.getElementById('cfgLote').value) || 150, 1);
  state.captureInterval = Math.max(parseInt(document.getElementById('cfgInt').value) || 200, 100);
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'flex';
  document.getElementById('btn-report-snapshot').style.display = 'flex';
  document.getElementById('rec-tag').classList.add('on');
  updateCaptureHUD();
  showToast('Captura contínua iniciada');
  captureLoop();
}

function captureLoop() {
  if (!state.captureRunning) return;
  const startTs = performance.now();
  captureFrame();
  const every = Math.max(80, state.captureInterval - (performance.now() - startTs));
  state.captureTimer = setTimeout(captureLoop, every);
}

function captureFrame() {
  if (!state.captureRunning || state.captureBusy) return;
  const video = document.getElementById('vid');
  if (!video || !video.videoWidth) return;
  state.captureBusy = true;
  try {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    drawOverlayCustom(ctx, video, canvas.width, canvas.height, state.currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${state.lat}, ${state.lon}`, document.getElementById('fotoLabel').value, !!state.discrete.inspecao);
    state.buffer.push({
      dataUrl: canvas.toDataURL('image/jpeg', 0.82),
      ts: new Date().toLocaleTimeString('pt-BR'),
      km: state.currentKm
    });

    if (state.buffer.length >= state.captureLimit) {
      enqueueBatch([...state.buffer]);
      state.buffer = [];
      state.batchNo += 1;
    }
    updateCaptureHUD();
  } catch (e) {
    console.error(e);
  } finally {
    state.captureBusy = false;
  }
}

function enqueueBatch(batch) {
  state.pdfQueue.push({ items: batch, batchNo: state.batchNo });
  processPdfQueue();
}

async function processPdfQueue() {
  if (state.pdfBusy) return;
  state.pdfBusy = true;
  try {
    while (state.pdfQueue.length) {
      const job = state.pdfQueue.shift();
      await generatePdfForBatch(job);
      state.savedBatches += 1;
      showQuickPhotoToast(`PDF salvo: lote ${job.batchNo}`);
    }
  } catch (e) {
    console.error(e);
    showToast('Falha ao salvar lote PDF', 'err');
  } finally {
    state.pdfBusy = false;
  }
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function generatePdfForBatch(job) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'px', format: 'a4' });

  for (let i = 0; i < job.items.length; i++) {
    const it = job.items[i];
    const img = await loadImage(it.dataUrl);
    const ratio = Math.min(doc.internal.pageSize.getWidth() / img.width, doc.internal.pageSize.getHeight() / img.height);
    const w = img.width * ratio;
    const h = img.height * ratio;
    if (i > 0) doc.addPage();
    doc.addImage(it.dataUrl, 'JPEG', (doc.internal.pageSize.getWidth() - w) / 2, (doc.internal.pageSize.getHeight() - h) / 2, w, h, undefined, 'FAST');
  }

  const blob = doc.output('blob');
  const fileName = `Relatorio_Lote_${job.batchNo}_KM_${job.items[0].km}_a_${job.items[job.items.length - 1].km}.pdf`.replace(/[,/]/g, '_');
  await saveBlobToFolder(blob, fileName);
}

async function saveBlobToFolder(blob, fileName) {
  if (!state.dirHandle) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
    return;
  }

  try {
    const handle = await state.dirHandle.getFileHandle(fileName, { create: true });
    const writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
  } catch (e) {
    console.error('Erro ao salvar no diretório', e);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }
}

function takeReportSnapshot() {
  if (!state.captureRunning || !state.dirHandle) {
    showToast('Sessão não ativa ou pasta indisponível', 'err');
    return;
  }
  const video = document.getElementById('vid');
  if (!video || !video.videoWidth) return;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  drawOverlayCustom(ctx, video, canvas.width, canvas.height, state.currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${state.lat}, ${state.lon}`, document.getElementById('fotoLabel').value, !!state.discrete.inspecao);
  const fileName = `Foto_Extra_${state.currentKm}_${makeStamp()}.jpg`.replace(/[,/]/g, '_');
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    await saveBlobToFolder(blob, fileName);
    showQuickPhotoToast(`Foto salva: ${fileName}`);
  }, 'image/jpeg', 0.9);
}

function makeStamp() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}-${String(d.getSeconds()).padStart(2,'0')}`;
}

async function stopCap() {
  if (!state.captureRunning) return;

  state.captureRunning = false;
  clearTimeout(state.captureTimer);
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-start').style.display = 'flex';
  document.getElementById('btn-report-snapshot').style.display = 'none';
  document.getElementById('rec-tag').classList.remove('on');

  if (state.buffer.length) {
    enqueueBatch([...state.buffer]);
    state.buffer = [];
  }

  while (state.pdfQueue.length && state.pdfBusy) {
    await new Promise(r => setTimeout(r, 100));
  }

  showToast(`Sessão finalizada. ${state.savedBatches} lote(s) salvo(s).`);
  state.savedBatches = 0;
  state.batchNo = 1;
  updateCaptureHUD();
}

function drawOverlayCustom(ctx, videoEl, w, h, kmVal, ts, gpsStr, label = '', discrete = false) {
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(videoEl, 0, 0, w, h);
  if (discrete) return;

  const hGrad = h * 0.14;
  const grad = ctx.createLinearGradient(0, h - hGrad, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.35, 'rgba(0,0,0,.55)');
  grad.addColorStop(1, 'rgba(0,0,0,.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, h - hGrad, w, hGrad);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(hGrad * 0.32) + 'px Arial';
  ctx.fillText('KM ' + (kmVal || '---'), 20, h - hGrad * 0.54);
  ctx.font = Math.round(hGrad * 0.18) + 'px Arial';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(ts + ' | GPS: ' + gpsStr, 20, h - hGrad * 0.22);

  if (label && label.trim()) {
    const txt = label.trim();
    const fontSize = Math.round(h * 0.035);
    ctx.font = 'bold ' + fontSize + 'px Arial';
    const textWidth = ctx.measureText(txt).width;
    const padX = fontSize * 0.8;
    const padY = fontSize * 0.5;
    const boxW = textWidth + padX * 2;
    const boxH = fontSize + padY * 2;
    const x = w - boxW - 30;
    const y = 28;

    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#ffd600';
    ctx.beginPath();
    ctx.roundRect(x, y, boxW, boxH, 10);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, x + boxW / 2, y + boxH / 2 + 1);
  }
}

function updateKmFromGPS(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  state.lat = lat.toFixed(6);
  state.lon = lon.toFixed(6);

  if (!state.kmDB.length) {
    const km = Number.isFinite(position.coords.altitude) ? '---' : '---';
    document.getElementById('kmTxt').textContent = 'KM ' + km;
    document.getElementById('kmTxtUnica').textContent = 'KM ' + km;
    return;
  }

  let nearest = null;
  let minDist = Infinity;
  for (const pt of state.kmDB) {
    const d = Math.hypot(pt.lat - lat, pt.lon - lon);
    if (d < minDist) { minDist = d; nearest = pt; }
  }
  if (nearest) {
    state.currentKm = (Math.round(nearest.km * 100) / 100).toFixed(2).replace('.', ',');
  }
  document.getElementById('kmTxt').textContent = 'KM ' + state.currentKm;
  document.getElementById('kmTxtUnica').textContent = 'KM ' + state.currentKm;
}

async function loadKmDataset() {
  try {
    const resp = await fetch('SNVBR116SPRJ.csv?v=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (!resp || !resp.ok) return;
    const text = await resp.text();
    const rows = text.split(/\r?\n/).filter(Boolean);
    if (!rows.length) return;
    const header = rows[0].split(';');
    const kI = header.findIndex(h => /km/i.test(h));
    const latI = header.findIndex(h => /lat|latitude/i.test(h));
    const lonI = header.findIndex(h => /lon|long|longitude/i.test(h));
    if (kI < 0 || latI < 0 || lonI < 0) return;
    state.kmDB = rows.slice(1).map(row => {
      const cols = row.split(';');
      return {
        km: Number(cols[kI]?.replace('.', '').replace(',', '.')),
        lat: Number(cols[latI]?.replace('.', '').replace(',', '.')),
        lon: Number(cols[lonI]?.replace('.', '').replace(',', '.'))
      };
    }).filter(v => Number.isFinite(v.km) && Number.isFinite(v.lat) && Number.isFinite(v.lon));
  } catch (e) {
    console.warn('KM dataset não carregado', e);
  }
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(updateKmFromGPS, () => {}, { enableHighAccuracy: true });
}
loadKmDataset();

function triggerFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

async function saveImageToFolder(fileName, canvas) {
  if (!state.dirHandle) {
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 0.9);
    return;
  }

  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const handle = await state.dirHandle.getFileHandle(fileName, { create: true });
    const w = await handle.createWritable();
    await w.write(blob);
    await w.close();
  }, 'image/jpeg', 0.9);
}

function takeSinglePhoto() {
  const canvas = document.getElementById('cUnica');
  const video = document.getElementById('vidUnica');
  if (!video || !video.videoWidth) return;
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  drawOverlayCustom(ctx, video, canvas.width, canvas.height, state.currentKm, new Date().toLocaleString('pt-BR').toUpperCase(), `${state.lat}, ${state.lon}`, document.getElementById('fotoLabelUnica').value, !!state.discrete.unica);
  const fileName = `FOTO_${state.currentKm}_${makeStamp()}.jpg`.replace(/[,/]/g, '_');
  saveImageToFolder(fileName, canvas);
  showQuickPhotoToast('Foto salva: ' + fileName);
}

async function toggleVideoRecordingUnica() {
  if (!state.recordingUnica) {
    await startVideoRecordingUnica();
  } else {
    stopVideoRecordingUnica();
  }
}

async function startVideoRecordingUnica() {
  const video = document.getElementById('vidUnica');
  const canvas = document.getElementById('cUnica');
  if (!video || !video.videoWidth) {
    showToast('Câmera indisponível para gravação', 'err');
    return;
  }

  const stream = canvas.captureStream(30);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(type => MediaRecorder.isTypeSupported(type)) || '';
  try {
    state.mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  } catch (e) {
    state.mediaRecorder = new MediaRecorder(stream);
  }

  state.recorderChunks = [];
  state.mediaRecorder.ondataavailable = (event) => {
    if (event.data && event.data.size) state.recorderChunks.push(event.data);
  };

  state.mediaRecorder.onstop = async () => {
    const blob = new Blob(state.recorderChunks, { type: state.mediaRecorder.mimeType || 'video/webm' });
    const fileName = `VIDEO_${state.currentKm}_${makeStamp()}.webm`.replace(/[,/]/g, '_');
    if (state.dirHandle) {
      try {
        const handle = await state.dirHandle.getFileHandle(fileName, { create: true });
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        showQuickPhotoToast(`Vídeo salvo: ${fileName}`);
      } catch (e) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
      showQuickPhotoToast(`Vídeo salvo: ${fileName}`);
    }
  };

  state.mediaRecorder.start();
  state.recordingUnica = true;
  const btn = document.getElementById('btnRecVideoUnica');
  if (btn) {
    btn.style.background = '#ef4444';
    btn.style.borderColor = '#fca5a5';
  }
  showToast('Gravação de vídeo iniciada');
}

function stopVideoRecordingUnica() {
  if (!state.mediaRecorder || !state.recordingUnica) return;
  state.mediaRecorder.stop();
  state.recordingUnica = false;
  const btn = document.getElementById('btnRecVideoUnica');
  if (btn) {
    btn.style.background = 'rgba(0,0,0,.5)';
    btn.style.borderColor = 'rgba(255,255,255,.35)';
  }
}

function updateAIAssistantState() {
  const enabled = !!(state.ai.motion || state.ai.voice || state.ai.background);
  saveSettings();
  syncSettingsInputs();

  if (state.ai.motion) startMotionDetection(); else stopMotionDetection();
  if (state.ai.voice) startVoiceAssistant(); else stopVoiceAssistant();
  if (state.ai.background) enableWakeLock(); else releaseWakeLock();

  const chip = document.getElementById('aiBadgeUnica');
  if (chip) chip.style.display = enabled ? 'inline-flex' : 'none';
}

function startMotionDetection() {
  if (!('DeviceMotionEvent' in window)) {
    showToast('Sensores de movimento não suportados neste navegador', 'err');
    return;
  }
  if (state.ai.motionHandler) {
    window.removeEventListener('devicemotion', state.ai.motionHandler);
  }
  state.ai.motionHandler = (event) => {
    const acc = event.accelerationIncludingGravity || event.acceleration;
    if (!acc) return;
    const total = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
    const now = Date.now();
    if (total >= 1.6 && now - state.ai.lastMotionTs > 1800) {
      state.ai.lastMotionTs = now;
      if (state.module === 'foto-unica' && state.streamUnica) {
        takeSinglePhoto();
      } else if (state.module === 'inspecao' && state.stream) {
        if (!state.captureRunning) startCap();
        else captureFrame();
      }
    }
  };
  window.addEventListener('devicemotion', state.ai.motionHandler, { passive: true });
  showToast('Detecção por movimento ativa');
}

function stopMotionDetection() {
  if (state.ai.motionHandler) {
    window.removeEventListener('devicemotion', state.ai.motionHandler);
    state.ai.motionHandler = null;
  }
}

function startVoiceAssistant() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Reconhecimento por voz não suportado neste navegador', 'err');
    return;
  }
  if (state.ai.recognition) {
    try { state.ai.recognition.stop(); } catch (e) {}
  }

  const recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript + ' ';
    }
    transcript = transcript.trim();
    handleVoiceCommand(transcript);
  };
  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') console.warn('Speech error', e);
  };
  recognition.onend = () => {
    if (state.ai.voice) {
      try { recognition.start(); } catch (e) {}
    }
  };

  state.ai.recognition = recognition;
  try { recognition.start(); } catch (e) {}
  showToast('Assistente por voz pronto');
}

function stopVoiceAssistant() {
  if (state.ai.recognition) {
    try { state.ai.recognition.stop(); } catch (e) {}
    state.ai.recognition = null;
  }
}

function handleVoiceCommand(text) {
  const t = text.toLowerCase();
  if (!t) return;

  if (t.includes('etiqueta')) {
    const suffix = t.replace(/.*etiqueta\s*/, '').trim();
    if (suffix) {
      const value = suffix.replace(/^(de|da|do|para|a|o)\s+/i, '');
      const normalized = value.charAt(0).toUpperCase() + value.slice(1);
      syncFotoLabel(normalized);
      showToast('Etiqueta atualizada por voz');
    }
    return;
  }

  if (t.includes('iniciar') || t.includes('começar') || t.includes('capturar')) {
    if (state.module === 'foto-unica') takeSinglePhoto();
    else if (state.module === 'inspecao' && state.stream) startCap();
    return;
  }

  if (t.includes('parar') || t.includes('pausar') || t.includes('finalizar')) {
    if (state.captureRunning) stopCap();
    return;
  }

  if (t.includes('foto') || t.includes('fotografar') || t.includes('tirar')) {
    if (state.module === 'foto-unica') takeSinglePhoto();
    else if (state.module === 'inspecao' && state.captureRunning) takeReportSnapshot();
    return;
  }
}

async function enableWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    state.ai.wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {
    console.warn('Wake lock falhou', e);
  }
}

async function releaseWakeLock() {
  if (state.ai.wakeLock) {
    try { await state.ai.wakeLock.release(); } catch (e) {}
    state.ai.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden' && state.ai.background) {
    if (state.ai.voice && state.ai.recognition && state.ai.recognition.state === 'inactive') {
      try { state.ai.recognition.start(); } catch (e) {}
    }
    if ('wakeLock' in navigator && !state.ai.wakeLock) await enableWakeLock();
  }
  if (document.visibilityState === 'visible' && state.ai.wakeLock) {
    await releaseWakeLock();
  }
});

loadSettings();
syncSettingsInputs();
bindSettings();
updateAIAssistantState();
updateCaptureHUD();
</script>
